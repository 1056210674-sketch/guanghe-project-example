# Include INSIDE the existing Web server block, replacing its location / block.
# Existing server-level security headers remain inherited (no add_header override).
# Before switching releases, run scripts/retain_web_assets.py under the deploy lock.
location ^~ /assets/ {
    try_files $uri @retained_web_asset;
    expires 1y;
}

location @retained_web_asset {
    root /opt/zhixiaohe/web/retained;
    try_files $uri =404;
    expires 1y;
}

location = /index.html {
    try_files $uri =404;
    expires -1;
}

location / {
    try_files $uri $uri/ /index.html;
    expires -1;
}

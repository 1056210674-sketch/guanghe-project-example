openapi: 3.1.0
info:
  title: Guanghe Agent Internal API
  description: Internal loopback-only API for the bounded Python Agent service.
  version: 0.1.0
servers:
- url: http://127.0.0.1:8000
paths:
  /health:
    get:
      tags:
      - system
      summary: Health Check
      description: Process liveness; this does not claim Provider readiness.
      operationId: getAgentLiveness
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Getagentliveness
  /internal/v1/health/ready:
    get:
      tags:
      - system
      summary: Readiness
      description: Report safe readiness without exposing configuration or file paths.
      operationId: getAgentReadiness
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '403':
          description: Readiness is accessible only by a direct loopback caller.
      security: []
  /internal/v1/capabilities:
    get:
      tags:
      - system
      summary: Capabilities
      description: Describe only validated Bundle and explicitly configured Provider capabilities.
      operationId: getAgentCapabilities
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorResponse'
        '401':
          description: Internal authentication failed or the nonce was replayed.
      security:
      - InternalHmac: []
      parameters:
      - $ref: '#/components/parameters/InternalKeyId'
      - $ref: '#/components/parameters/InternalTimestamp'
      - $ref: '#/components/parameters/InternalNonce'
      - $ref: '#/components/parameters/ContentSha256'
      - $ref: '#/components/parameters/InternalSignature'
      - $ref: '#/components/parameters/Traceparent'
  /internal/v1/chat-runs:
    post:
      tags:
      - chat-runs
      summary: Start Chat Run
      operationId: startChatRun
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRunRequest'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatRunAccepted'
        '401':
          description: Internal authentication failed or the nonce was replayed.
        '409':
          description: A Chat Run with the requested runId already exists.
        '503':
          description: Internal authentication infrastructure, the Agent runtime, or a required dependency
            is unavailable.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - InternalHmac: []
      parameters:
      - $ref: '#/components/parameters/InternalKeyId'
      - $ref: '#/components/parameters/InternalTimestamp'
      - $ref: '#/components/parameters/InternalNonce'
      - $ref: '#/components/parameters/ContentSha256'
      - $ref: '#/components/parameters/InternalSignature'
      - $ref: '#/components/parameters/Traceparent'
  /internal/v1/chat-runs/{runId}:
    get:
      tags:
      - chat-runs
      summary: Get Chat Run
      operationId: getChatRunSnapshot
      parameters:
      - $ref: '#/components/parameters/InternalKeyId'
      - $ref: '#/components/parameters/InternalTimestamp'
      - $ref: '#/components/parameters/InternalNonce'
      - $ref: '#/components/parameters/ContentSha256'
      - $ref: '#/components/parameters/InternalSignature'
      - $ref: '#/components/parameters/Traceparent'
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Runid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatRunSnapshot'
        '401':
          description: Internal authentication failed or the nonce was replayed.
        '404':
          description: The Chat Run was not found.
        '503':
          description: Internal authentication infrastructure or the Agent runtime is unavailable.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - InternalHmac: []
  /internal/v1/chat-runs/{runId}/events:
    get:
      tags:
      - chat-runs
      summary: Stream Chat Run Events
      operationId: streamChatRunEvents
      parameters:
      - $ref: '#/components/parameters/InternalKeyId'
      - $ref: '#/components/parameters/InternalTimestamp'
      - $ref: '#/components/parameters/InternalNonce'
      - $ref: '#/components/parameters/ContentSha256'
      - $ref: '#/components/parameters/InternalSignature'
      - $ref: '#/components/parameters/Traceparent'
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Runid
      - name: Last-Event-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Last-Event-Id
      responses:
        '200':
          description: Server-sent Chat Run events.
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          description: Last-Event-ID is not a valid numeric sequence.
        '401':
          description: Internal authentication failed or the nonce was replayed.
        '404':
          description: The Chat Run was not found.
        '503':
          description: Internal authentication infrastructure or the Agent runtime is unavailable.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - InternalHmac: []
  /internal/v1/chat-runs/{runId}/stop:
    post:
      tags:
      - chat-runs
      summary: Stop Chat Run
      operationId: stopChatRun
      parameters:
      - $ref: '#/components/parameters/InternalKeyId'
      - $ref: '#/components/parameters/InternalTimestamp'
      - $ref: '#/components/parameters/InternalNonce'
      - $ref: '#/components/parameters/ContentSha256'
      - $ref: '#/components/parameters/InternalSignature'
      - $ref: '#/components/parameters/Traceparent'
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Runid
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StopRunResponse'
        '401':
          description: Internal authentication failed or the nonce was replayed.
        '404':
          description: The Chat Run was not found.
        '503':
          description: Internal authentication infrastructure or the Agent runtime is unavailable.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - InternalHmac: []
  /internal/v1/creative/geo-plans:
    post:
      tags:
      - creative
      summary: Create Plan
      operationId: createGeoVisualPlan
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeoVisualPlanRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoVisualPlan'
        '401':
          description: Internal HMAC authentication failed or the nonce was replayed.
        '429':
          description: The bounded GEO planning capacity is full.
        '503':
          description: The structured DeepSeek planner is unavailable or returned an invalid plan.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - InternalHmac: []
      parameters:
      - $ref: '#/components/parameters/InternalKeyId'
      - $ref: '#/components/parameters/InternalTimestamp'
      - $ref: '#/components/parameters/InternalNonce'
      - $ref: '#/components/parameters/ContentSha256'
      - $ref: '#/components/parameters/InternalSignature'
      - $ref: '#/components/parameters/Traceparent'
  /internal/v1/geo/syntheses:
    post:
      tags:
      - geo
      summary: Regenerate
      operationId: regenerateGeoSynthesis
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeoSynthesisRecoveryRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoSynthesisRecoveryResponse'
        '401':
          description: Internal HMAC authentication failed or nonce replayed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorResponse'
        '422':
          description: Invalid or empty authorized saved evidence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoSynthesisRecoveryErrorResponse'
        '429':
          description: Bounded analysis capacity full.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoSynthesisRecoveryErrorResponse'
        '503':
          description: Model unavailable or structured synthesis failed; no fallback success.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/GeoSynthesisRecoveryErrorResponse'
                - $ref: '#/components/schemas/InternalErrorResponse'
                title: Response 503 Regenerategeosynthesis
        '504':
          description: The at-most-60-second analysis deadline expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoSynthesisRecoveryErrorResponse'
      security:
      - InternalHmac: []
      parameters:
      - $ref: '#/components/parameters/InternalKeyId'
      - $ref: '#/components/parameters/InternalTimestamp'
      - $ref: '#/components/parameters/InternalNonce'
      - $ref: '#/components/parameters/ContentSha256'
      - $ref: '#/components/parameters/InternalSignature'
      - $ref: '#/components/parameters/Traceparent'
  /internal/v1/geo/period-report-summaries:
    post:
      tags:
      - geo
      summary: Summarize
      operationId: summarizeGeoPeriodReport
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeoPeriodReportSummaryRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoPeriodReportSummaryResponse'
        '401':
          description: Internal HMAC invalid or replayed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorResponse'
        '422':
          description: Invalid bounded Java-frozen evidence; source contents never echoed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoPeriodReportSummaryErrorResponse'
        '429':
          description: Existing bounded GEO analysis capacity is full.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoPeriodReportSummaryErrorResponse'
        '503':
          description: DeepSeek unavailable or narrative invalid; no fallback success.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/GeoPeriodReportSummaryErrorResponse'
                - $ref: '#/components/schemas/InternalErrorResponse'
                title: Response 503 Summarizegeoperiodreport
        '504':
          description: At-most-60-second deadline expired; never retried by this route.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoPeriodReportSummaryErrorResponse'
      security:
      - InternalHmac: []
      parameters:
      - $ref: '#/components/parameters/InternalKeyId'
      - $ref: '#/components/parameters/InternalTimestamp'
      - $ref: '#/components/parameters/InternalNonce'
      - $ref: '#/components/parameters/ContentSha256'
      - $ref: '#/components/parameters/InternalSignature'
      - $ref: '#/components/parameters/Traceparent'
  /internal/v1/geo/diagnostic-preparations:
    post:
      tags:
      - geo
      summary: Prepare
      operationId: prepareGeoDiagnostic
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiagnosticPreparationRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticPreparationResponse'
        '401':
          description: Internal HMAC invalid or replayed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorResponse'
        '422':
          description: Invalid frozen diagnostic input; source text never echoed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticPreparationErrorResponse'
        '429':
          description: Existing bounded GEO analysis capacity is full.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticPreparationErrorResponse'
        '503':
          description: Search/model unavailable or grounding invalid; no fake success.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/DiagnosticPreparationErrorResponse'
                - $ref: '#/components/schemas/InternalErrorResponse'
                title: Response 503 Preparegeodiagnostic
        '504':
          description: At-most-60-second deadline expired; no automatic job replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticPreparationErrorResponse'
      security:
      - InternalHmac: []
      parameters:
      - $ref: '#/components/parameters/InternalKeyId'
      - $ref: '#/components/parameters/InternalTimestamp'
      - $ref: '#/components/parameters/InternalNonce'
      - $ref: '#/components/parameters/ContentSha256'
      - $ref: '#/components/parameters/InternalSignature'
      - $ref: '#/components/parameters/Traceparent'
  /internal/v1/geo/diagnostic-analyses:
    post:
      tags:
      - geo
      summary: Analyze
      operationId: analyzeGeoDiagnostic
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiagnosticAnalysisRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticAnalysisResponse'
        '401':
          description: Internal HMAC invalid or replayed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorResponse'
        '422':
          description: Invalid or over-budget frozen evidence; private text never echoed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticPreparationErrorResponse'
        '429':
          description: Existing bounded GEO analysis capacity is full.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticPreparationErrorResponse'
        '503':
          description: Model or evidence validation failed; no fake report.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/DiagnosticPreparationErrorResponse'
                - $ref: '#/components/schemas/InternalErrorResponse'
                title: Response 503 Analyzegeodiagnostic
        '504':
          description: At-most-120-second analysis expired; no sampling or automatic replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticPreparationErrorResponse'
      security:
      - InternalHmac: []
      parameters:
      - $ref: '#/components/parameters/InternalKeyId'
      - $ref: '#/components/parameters/InternalTimestamp'
      - $ref: '#/components/parameters/InternalNonce'
      - $ref: '#/components/parameters/ContentSha256'
      - $ref: '#/components/parameters/InternalSignature'
      - $ref: '#/components/parameters/Traceparent'
components:
  schemas:
    CapabilitiesResponse:
      properties:
        serviceVersion:
          type: string
          title: Serviceversion
        bundleVersion:
          type: string
          title: Bundleversion
        bundleHash:
          type: string
          title: Bundlehash
        promptHash:
          type: string
          title: Prompthash
        gitCommit:
          type: string
          title: Gitcommit
        modelGateway:
          $ref: '#/components/schemas/ModelGatewayCapability'
        intentRouter:
          $ref: '#/components/schemas/IntentRouterCapability'
        langfuseExport:
          $ref: '#/components/schemas/LangfuseExportCapability'
        supportedProfiles:
          items:
            $ref: '#/components/schemas/ProfileCapability'
          type: array
          title: Supportedprofiles
        providers:
          items:
            $ref: '#/components/schemas/ProviderCapability'
          type: array
          title: Providers
      type: object
      required:
      - serviceVersion
      - bundleVersion
      - bundleHash
      - promptHash
      - gitCommit
      - modelGateway
      - intentRouter
      - langfuseExport
      - supportedProfiles
      - providers
      title: CapabilitiesResponse
    ChatMessage:
      properties:
        messageId:
          type: string
          maxLength: 128
          minLength: 1
          title: Messageid
        content:
          type: string
          maxLength: 16000
          minLength: 1
          title: Content
        replyToMessageId:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Replytomessageid
        attachmentAssetIds:
          items:
            type: string
          type: array
          maxItems: 16
          title: Attachmentassetids
          default: []
      additionalProperties: false
      type: object
      required:
      - messageId
      - content
      title: ChatMessage
    ChatRunAccepted:
      properties:
        runId:
          type: string
          format: uuid
          title: Runid
        status:
          $ref: '#/components/schemas/RunStatus'
        eventsUrl:
          type: string
          title: Eventsurl
      additionalProperties: false
      type: object
      required:
      - runId
      - status
      - eventsUrl
      title: ChatRunAccepted
    ChatRunEvent:
      properties:
        schemaVersion:
          type: integer
          const: 1
          title: Schemaversion
          default: 1
        eventId:
          type: string
          format: uuid
          title: Eventid
        eventType:
          type: string
          enum:
          - run.started
          - run.progress
          - message.delta
          - interaction.required
          - task-draft.proposed
          - run.completed
          - run.failed
          - usage.reported
          - heartbeat
          title: Eventtype
        runId:
          type: string
          format: uuid
          title: Runid
        occurredAt:
          type: string
          format: date-time
          title: Occurredat
        sequence:
          type: integer
          minimum: 1.0
          title: Sequence
        payload:
          additionalProperties:
            $ref: '#/components/schemas/JsonValue'
          type: object
          title: Payload
      additionalProperties: false
      type: object
      required:
      - eventId
      - eventType
      - runId
      - occurredAt
      - sequence
      - payload
      title: ChatRunEvent
      allOf:
      - if:
          properties:
            eventType:
              const: message.delta
          required:
          - eventType
        then:
          properties:
            payload:
              $ref: '#/components/schemas/MessageDeltaPayload'
      - if:
          properties:
            eventType:
              const: run.completed
          required:
          - eventType
        then:
          properties:
            payload:
              properties:
                businessOutcome:
                  $ref: '#/components/schemas/BusinessOutcome'
                  description: Runtime-owned business result. Sent only when both per-Run authorization
                    and Python output configuration enable it. Java verifies actual drafts before DRAFT_READY.
                    Omitted on STOPPED.
                geoContextUsed:
                  type: boolean
                  description: True only when this Run used the GEO readonly renderer. Java derives action
                    metadata solely from this Run's frozen authorized context, never from model-generated
                    IDs. Omitted for ordinary replies, drafts, or stopped Runs.
      - if:
          properties:
            eventType:
              const: usage.reported
          required:
          - eventType
        then:
          properties:
            payload:
              $ref: '#/components/schemas/Usage'
      - if:
          properties:
            eventType:
              const: run.progress
          required:
          - eventType
        then:
          properties:
            payload:
              $ref: '#/components/schemas/RunProgressPayload'
      - if:
          properties:
            eventType:
              const: task-draft.proposed
          required:
          - eventType
        then:
          properties:
            payload:
              $ref: '#/components/schemas/TaskDraftProposal'
    ChatRunRequest:
      properties:
        runId:
          type: string
          format: uuid
          title: Runid
        conversationId:
          type: string
          maxLength: 128
          minLength: 1
          title: Conversationid
        userContextRef:
          type: string
          maxLength: 512
          minLength: 1
          title: Usercontextref
        message:
          $ref: '#/components/schemas/ChatMessage'
        trustedState:
          $ref: '#/components/schemas/TrustedState'
        budget:
          $ref: '#/components/schemas/RunBudget'
      additionalProperties: false
      type: object
      required:
      - runId
      - conversationId
      - userContextRef
      - message
      - trustedState
      - budget
      title: ChatRunRequest
    ChatRunSnapshot:
      properties:
        runId:
          type: string
          format: uuid
          title: Runid
        conversationId:
          type: string
          title: Conversationid
        status:
          $ref: '#/components/schemas/RunStatus'
        eventCount:
          type: integer
          title: Eventcount
        lastEvent:
          anyOf:
          - $ref: '#/components/schemas/ChatRunEvent'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - runId
      - conversationId
      - status
      - eventCount
      title: ChatRunSnapshot
    CompetitorCandidate:
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 1
          title: Name
        brandTerms:
          items:
            type: string
            maxLength: 200
            minLength: 1
          type: array
          maxItems: 50
          minItems: 1
          title: Brandterms
        reason:
          type: string
          maxLength: 1000
          minLength: 1
          title: Reason
        sourceIds:
          items:
            type: string
            maxLength: 128
            minLength: 1
          type: array
          maxItems: 8
          minItems: 1
          title: Sourceids
      additionalProperties: false
      type: object
      required:
      - name
      - brandTerms
      - reason
      - sourceIds
      title: CompetitorCandidate
    DiagnosticAnalysisEvidence:
      properties:
        profile:
          $ref: '#/components/schemas/DiagnosticConfirmedProfile'
        competitors:
          items:
            $ref: '#/components/schemas/DiagnosticCompetitor'
          type: array
          maxItems: 5
          title: Competitors
        questions:
          items:
            $ref: '#/components/schemas/GeoDiagnosticQuestionSnapshot'
          type: array
          maxItems: 10
          minItems: 3
          title: Questions
        platformCodes:
          items:
            type: string
            enum:
            - DOUBAO
            - DEEPSEEK
            - QWEN
            - WENXIN
            - KIMI
            - YUANBAO
            - ZHIPU
          type: array
          maxItems: 7
          minItems: 1
          title: Platformcodes
        metrics:
          $ref: '#/components/schemas/DiagnosticMetrics'
        samples:
          items:
            $ref: '#/components/schemas/DiagnosticSample'
          type: array
          maxItems: 70
          minItems: 1
          title: Samples
        sources:
          items:
            $ref: '#/components/schemas/DiagnosticAnalysisSource'
          type: array
          maxItems: 100
          title: Sources
        limitations:
          items:
            type: string
            maxLength: 1000
            minLength: 1
          type: array
          maxItems: 20
          title: Limitations
      additionalProperties: false
      type: object
      required:
      - profile
      - competitors
      - questions
      - platformCodes
      - metrics
      - samples
      - sources
      - limitations
      title: DiagnosticAnalysisEvidence
    DiagnosticAnalysisRequest:
      properties:
        jobId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          title: Jobid
        inputHash:
          type: string
          pattern: ^[0-9a-f]{64}$
          title: Inputhash
        deadlineAt:
          type: string
          format: date-time
          title: Deadlineat
        title:
          type: string
          maxLength: 200
          minLength: 1
          title: Title
        evidence:
          $ref: '#/components/schemas/DiagnosticAnalysisEvidence'
      additionalProperties: false
      type: object
      required:
      - jobId
      - inputHash
      - deadlineAt
      - title
      - evidence
      title: DiagnosticAnalysisRequest
      description: Frozen classified matrix; maximum 262144 UTF-8 bytes, no new collection.
    DiagnosticAnalysisResponse:
      properties:
        jobId:
          type: string
          pattern: ^[1-9][0-9]{0,18}$
          title: Jobid
        inputHash:
          type: string
          pattern: ^[0-9a-f]{64}$
          title: Inputhash
        promptVersion:
          type: string
          const: GEO_DIAGNOSTIC_ANALYSIS_V11
          title: Promptversion
          default: GEO_DIAGNOSTIC_ANALYSIS_V11
        report:
          $ref: '#/components/schemas/DiagnosticReport'
        synthesisUsage:
          $ref: '#/components/schemas/GeoSynthesisUsage'
      additionalProperties: false
      type: object
      required:

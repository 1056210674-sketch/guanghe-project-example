  securitySchemes:
    InternalHmac:
      type: apiKey
      in: header
      name: X-Internal-Signature
      description: HMAC-SHA256 Base64 signature. The companion key ID, epoch-second timestamp, UUID nonce,
        and lowercase body SHA-256 headers are mandatory.
  parameters:
    InternalKeyId:
      in: header
      name: X-Internal-Key-Id
      required: true
      schema:
        type: string
    InternalTimestamp:
      in: header
      name: X-Internal-Timestamp
      required: true
      schema:
        type: string
        pattern: ^-?[0-9]{1,20}$
    InternalNonce:
      in: header
      name: X-Internal-Nonce
      required: true
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      description: A canonical lowercase UUID. Uppercase or non-canonical forms are rejected before the
        Nonce claim.
    ContentSha256:
      in: header
      name: X-Content-SHA256
      required: true
      schema:
        type: string
        pattern: ^[0-9a-f]{64}$
    InternalSignature:
      in: header
      name: X-Internal-Signature
      required: true
      schema:
        type: string
        maxLength: 128
    Traceparent:
      in: header
      name: traceparent
      required: false
      schema:
        type: string
        pattern: ^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$
      description: A valid W3C context is continued; otherwise Python creates a new one.

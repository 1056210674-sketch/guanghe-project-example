    MemoryPreference: {"type":"object","additionalProperties":false,"required":["id","projectId","scope","content","sourceType","sourceMessageId","version","createdAt","updatedAt"],"properties":{"id":{"$ref":"#/components/schemas/SnowflakeId"},"projectId":{"anyOf":[{"$ref":"#/components/schemas/SnowflakeId"},{"type":"null"}]},"scope":{"type":"string","enum":["PERSONAL","PROJECT"]},"content":{"type":"string","minLength":1,"maxLength":1000},"sourceType":{"type":"string","enum":["USER_INPUT","USER_MESSAGE"]},"sourceMessageId":{"anyOf":[{"$ref":"#/components/schemas/SnowflakeId"},{"type":"null"}]},"version":{"type":"integer","minimum":1},"createdAt":{"type":"string","format":"date-time"},"updatedAt":{"type":"string","format":"date-time"}}}
    ProjectBusinessHistory: {"type":"object","additionalProperties":false,"required":["projectId","writtenArticleCount","publishedArticleCount","publishedPlacementCount","asOf"],"properties":{"projectId":{"$ref":"#/components/schemas/SnowflakeId"},"writtenArticleCount":{"type":"integer","minimum":0},"publishedArticleCount":{"type":"integer","minimum":0},"publishedPlacementCount":{"type":"integer","minimum":0},"asOf":{"type":"string","format":"date-time"}}}

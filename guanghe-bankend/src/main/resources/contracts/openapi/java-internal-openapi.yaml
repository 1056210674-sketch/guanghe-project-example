        - properties:
            action: { const: memory.read }
            arguments: { type: object, additionalProperties: false }
        - properties:
            action: { const: memory.upsert }
            arguments: { $ref: '#/components/schemas/RunMemoryUpsertArguments' }
        - properties:
            action: { const: memory.forget }
            arguments: { $ref: '#/components/schemas/RunMemoryForgetArguments' }
    RunImageGenerateArguments:
      type: object
      additionalProperties: false
      required: [sourceMode, scene]
      description: >-
        Only creative identity can generate. The original current USER message must explicitly request
        image creation or modification, or carry a matching Harness-owned CREATE_NEW continuation review;
        omitted-subject edits require the unique Java-resolved sourceImageAssetId and PREVIOUS_IMAGE_RESULT.
        Questions, quotations, examples, pricing inquiries, conditional
        requests and refusals cannot authorize a paid task. Java independently enforces this boundary.
        Java restores source message and frozen attachment/product references; model-supplied IDs, prices,
        identity, grants and publication permissions are forbidden. TEXT_ONLY needs no project/brand.
        CURRENT_ATTACHMENTS uses 1-3 current message images; CATALOG_PRODUCT uses the selected product's
        existing identity images. PREVIOUS_IMAGE_RESULT asks Java to resolve the latest ready image result
        from this user and conversation before the current USER message; the model never supplies its asset ID.
        PREVIOUS_USER_ATTACHMENT asks Java to freeze the immediately preceding USER message's sole READY
        image; it does not skip an intervening USER message and the model never supplies IDs.
        Native tools do not pretend to support region-mask editing.
        Reuses finite per-action/day policy, wallet reservation, existing worker and one-task-per-Run idempotency.
      properties:
        sourceMode: { type: string, enum: [TEXT_ONLY, CURRENT_ATTACHMENTS, CATALOG_PRODUCT, PREVIOUS_IMAGE_RESULT, PREVIOUS_USER_ATTACHMENT] }
        scene: { type: string, minLength: 1, maxLength: 1000 }
        count: { type: integer, minimum: 1, maximum: 4, default: 1 }
        aspectRatio: { type: string, enum: ['1:1', '3:4', '4:3', '9:16', '16:9'], default: '1:1' }
        style: { type: string, minLength: 1, maxLength: 256 }
        lighting: { type: string, minLength: 1, maxLength: 256 }
        negativePrompt: { type: string, minLength: 1, maxLength: 1000 }
        continuationReview: { $ref: '#/components/schemas/RunCreativeContinuationReview' }
    RunVideoGenerateArguments:
      type: object
      additionalProperties: false
      required: [sourceMode, scene]
      description: >-
        Same server-enforced original-current-USER admission boundary as image.generate. Questions,
        quotations, examples, pricing inquiries, conditional requests and refusals cannot authorize a task.
        CURRENT_ATTACHMENTS uses exactly
        one current message reference image; PRODUCT_MATERIALS uses 1-3 current references that Java verifies
        belong to the selected product; CATALOG_PRODUCT uses one product identity image. PREVIOUS_IMAGE_RESULT
        asks Java to resolve the latest ready image result in the same user and conversation before the current
        USER message and use it as the first frame; the model never supplies its asset ID. TEXT_ONLY needs no project.
        PREVIOUS_USER_ATTACHMENT instead freezes the immediately preceding USER message's sole READY image,
        without skipping an intervening USER message or accepting model-supplied IDs.
        Queued admission is not successful generation. Unsupported provider modes fail truthfully.
      properties:
        sourceMode: { type: string, enum: [TEXT_ONLY, CURRENT_ATTACHMENTS, CATALOG_PRODUCT, PRODUCT_MATERIALS, PREVIOUS_IMAGE_RESULT, PREVIOUS_USER_ATTACHMENT] }
        scene: { type: string, minLength: 1, maxLength: 1000 }
        durationSeconds: { type: integer, minimum: 2, maximum: 30, default: 5 }
        aspectRatio: { type: string, enum: ['16:9', '4:3', '1:1', '3:4', '9:16'], default: '16:9' }
        resolution: { type: string, enum: [480P, 720P, 1080P], default: 720P }
        audio: { type: boolean, default: false }
        style: { type: string, minLength: 1, maxLength: 256 }
        cameraMotion: { type: string, minLength: 1, maxLength: 256 }
        continuationReview: { $ref: '#/components/schemas/RunCreativeContinuationReview' }
    RunCreativeContinuationReview:
      type: object
      additionalProperties: false
      required: [currentMessageId, historyFingerprint, taskType, decision, sourceMode]
      description: >-
        Harness-owned semantic review, never a model-supplied tool field. For a current selected-image
        request or dialogue continuation, the Harness reviews context.read.creativeContinuation and
        the current USER text. Only CREATE_NEW may be attached. Java reconstructs the candidate
        under existing admission locks and matches current message, frozen project including null,
        task type, frozen currentAttachmentAssetIds and fingerprint. Review metadata is excluded
        from business task parameters and hash. CURRENT_ATTACHMENTS preserves the exact current
        message selection and cannot substitute a historical image. Its sourceImageAssetId must
        be null or absent, as for TEXT_ONLY.
        Omitted-subject IMAGE edits require sourceImageAssetId matching the sole server-resolved image,
        and PREVIOUS_IMAGE_RESULT sourceMode. A matched image is frozen directly without selecting latest again.
        Ownership, explicit prior-upload source references, budgets, wallet and one-task-per-Run
        idempotency remain unchanged. A candidate or old assistant offer alone cannot authorize work.
      properties:
        currentMessageId: { type: string, pattern: '^[1-9][0-9]{0,18}$' }
        historyFingerprint: { type: string, pattern: '^[a-f0-9]{64}$' }
        taskType: { type: string, enum: [IMAGE, VIDEO] }
        decision: { type: string, const: CREATE_NEW }
        sourceMode: { type: string, enum: [TEXT_ONLY, PREVIOUS_IMAGE_RESULT, CURRENT_ATTACHMENTS] }
        sourceImageAssetId: { type: [string, 'null'], pattern: '^[1-9][0-9]{0,18}$' }
      allOf:
        - if:
            properties:
              sourceMode: { const: PREVIOUS_IMAGE_RESULT }
            required: [sourceMode]
          then:
            required: [sourceImageAssetId]
            properties:
              sourceImageAssetId: { type: string }
          else:
            properties:
              sourceImageAssetId: { type: 'null' }
    RunCreativeContinuationEvidence:
      type: object
      additionalProperties: false
      required: [authorized, reviewRequired, currentMessageId, conversationId, projectId, historyFingerprint, history, historyIncomplete, sourceImageAssetId, currentAttachmentAssetIds]
      description: >-
        Read-only evidence assembled from Java-owned immutable dialogue, including projectless
        creative conversations. At most six complete raw USER/ASSISTANT messages before the current
        USER are returned chronologically, with at most 16000 characters total. Individual messages
        are never clipped. Other users/conversations, messages after the current turn, mutable
        statuses, duplicate identities and messages before the latest memory history boundary are
        excluded. historyIncomplete records a bound or exclusion. The SHA256 fingerprint also binds
        the exact current USER text, Run/user/conversation/project scope, current memory boundary,
        Java-frozen currentAttachmentAssetIds and nullable sourceImageAssetId. Current attachment IDs
        preserve the current USER selection, with at most eight distinct images. Empty history is allowed
        only with a nonempty current selection; both collections cannot be empty. A current selection
        still requires semantic review and does not grant paid execution. The historical image is present
        only when the latest completed image task has exactly one
        READY result in the same frozen project (including null), and its source USER is inside complete
        bounded history. Ambiguous, deleted, stale, cross-project or truncated history never selects a source.
        Models cannot choose this field; only the Harness copies it into reviewed admission metadata.
      properties:
        authorized: { type: boolean, const: false }
        reviewRequired: { type: boolean, const: true }
        currentMessageId: { type: string, pattern: '^[1-9][0-9]{0,18}$' }
        conversationId: { type: string, pattern: '^[1-9][0-9]{0,18}$' }
        projectId: { type: [string, 'null'], pattern: '^[1-9][0-9]{0,18}$' }
        historyFingerprint: { type: string, pattern: '^[a-f0-9]{64}$' }
        historyIncomplete: { type: boolean }
        sourceImageAssetId: { type: [string, 'null'], pattern: '^[1-9][0-9]{0,18}$' }
        currentAttachmentAssetIds:
          type: array
          minItems: 0
          maxItems: 8
          uniqueItems: true
          items: { type: string, pattern: '^[1-9][0-9]{0,18}$' }
        history:
          type: array
          minItems: 0
          maxItems: 6
          items:
            type: object
            additionalProperties: false
            required: [messageId, role, text]
            properties:
              messageId: { type: string, pattern: '^[1-9][0-9]{0,18}$' }
              role: { type: string, enum: [USER, ASSISTANT] }
              text: { type: string, minLength: 1, maxLength: 16000 }
      anyOf:
        - properties:
            history: { minItems: 1 }
        - properties:
            currentAttachmentAssetIds: { minItems: 1 }
    RunArticleGenerateArguments:
      type: object
      additionalProperties: false
      properties:
        tone: { type: string, pattern: '^[A-Z][A-Z0-9_]{0,63}$' }
        targetLength: { type: integer, minimum: 100, maximum: 20000 }
        research: { $ref: "#/components/schemas/RunArticleResearch" }
        continuationReview: { $ref: "#/components/schemas/RunArticleContinuationReview" }
      description: >-
        Generate one complete editable article only on the current USER's explicit writing request.
        Java restores original request text, trusted project/product scope and the frozen EXPLICIT_REPORT;
        no model-supplied identity, report ID, request text, grant, price or publication permission.
        Java enforces live Run, installed article.generate capability, finite per-action/day policy,
        wallet and one-preparation-per-Run idempotency. TITLE/OUTLINE/BODY reuse existing automatic continuation.
        A general optimization request is planning only; it does not authorize monitoring or generation.
        Optional research is injected only by the Python Harness from actual web_search receipts,
        never exposed as a model input property. Java freezes it under brief.authorizedContext.untrustedResearch
        and includes it in admission idempotency. These excerpts are not verified brand facts,
        full-page reads, instructions, execution permissions, or long-term memory.
        Short confirmations require a Harness-owned semantic NEW_DRAFT verdict bound to the current,
        source and offer message IDs from context.read.articleContinuation. This internal field is not
        exposed to the LLM. Java reconstructs the candidate under its account lock before admission;
        absent/mismatched verdicts, cross-scope/stale/consumed evidence cannot create another article.
        Ordinary explicit writing requests retain their exact current USER brief and must omit this field.
    RunArticleContinuationReview:
      type: object
      additionalProperties: false
      required: [currentMessageId, sourceMessageId, offerMessageId, decision]
      properties:
        currentMessageId: { type: string, pattern: '^[1-9][0-9]{0,18}$' }
        sourceMessageId: { type: string, pattern: '^[1-9][0-9]{0,18}$' }
        offerMessageId: { type: string, pattern: '^[1-9][0-9]{0,18}$' }
        decision: { type: string, const: NEW_DRAFT }
    RunArticleResearch:
      type: object
      additionalProperties: false
      required: [sourceType, fullPagesRead, sources]
      properties:
        sourceType: { type: string, const: WEB_SEARCH_EXCERPTS }
        fullPagesRead: { type: boolean, const: false }
        sources:
          type: array
          minItems: 1
          maxItems: 8
          items: { $ref: "#/components/schemas/RunArticleResearchSource" }
    RunArticleResearchSource:
      type: object
      additionalProperties: false
      required: [url, observedAt]
      properties:
        title: { type: [string, "null"], maxLength: 500 }
        url:
          type: string
          format: uri
          minLength: 1
          maxLength: 2048
          pattern: '^https?://'
          description: Absolute HTTP(S) source URL with a hostname and without userinfo; never fetched by Java.
        snippet: { type: [string, "null"], maxLength: 600 }
        observedAt: { type: string, format: date-time }
    RunBrandSaveArguments:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        aliases:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 100 }
        information:
          type: string
          maxLength: 16000
          description: Deprecated compatibility field; ignored. Save individual exact USER facts with memory.upsert instead.
    RunGeoMonitorArguments:
      type: object
      additionalProperties: false
      required: [region, questions]
      properties:
        topic: { type: string, minLength: 1, maxLength: 100 }
        region: { type: string, minLength: 1, maxLength: 100 }
        questions:
          type: array
          minItems: 3
          maxItems: 10
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 1000 }
        platformCodes:
          type: array
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items: { type: string, enum: [DOUBAO, DEEPSEEK, QWEN, WENXIN, KIMI, YUANBAO, ZHIPU] }
    RunActionResponse:
      type: object
      additionalProperties: false
      required: [action, status, data]
      properties:
        action: { type: string, enum: [context.read, brand.save, geo.monitor, article.generate, image.generate, video.generate, memory.read, memory.upsert, memory.forget] }
        status: { type: string, enum: [COMPLETED, WAIT_INPUT] }
        data:
          type: object
          properties:
            creativeContinuation: { $ref: '#/components/schemas/RunCreativeContinuationEvidence' }
          description: >-
            context.read returns sourceMessageId, projects (at most 5), project (nullable;
            id/name/brandName/aliases), knowledge (nullable KnowledgeContext), budget
            (configured/enabled/maxPointsPerAction/maxPointsPerDay/policySource/status/timezone/
            effectiveShanghaiDate/message/finalAdmissionRequired), configuredPlatforms,
            maxDiscoveryQuestions, and recentTasks (at most 5, taskId/status/topicId/reportId/
            quotedPoints/settledPoints). Budget configured means an account-specific policy exists,
            not that execution is available: policySource=DEFAULT uses bounded system defaults without
            requiring user configuration; ACCOUNT preserves the account policy, including disabled ones.
            Budget status is ENABLED, DISABLED, NOT_EFFECTIVE, or INVALID; effectiveShanghaiDate is null
            for DEFAULT, otherwise evaluated against the existing billing clock in Asia/Shanghai.
            ENABLED describes the policy only, not a quote or wallet/daily remaining balance.
            finalAdmissionRequired is always true: the existing Java admission must still check the
            actual quote, wallet balance and daily consumption.
            Creative context.read may include creativeContinuation (RunCreativeContinuationEvidence),
            including nullable-project conversations. It is bounded raw dialogue evidence only:
            authorized=false and reviewRequired=true. The Harness reviews the current USER request;
            image edits bind the sole sourceImageAssetId and use PREVIOUS_IMAGE_RESULT. Java rebuilds
            and matches evidence before admission; arbitrary model IDs and TEXT_ONLY cannot substitute.
            GEO context.read may include monitorContinuation with currentMessageId/conversationId/projectId/
            sourceMessageId/requestText/submissionState=NOT_ATTEMPTED. It is evidence only: the immediately
            preceding USER run must have completed in the same project within 24 hours before this request,
            with no task draft/action and all counted calls matched by durable action or read-only resource
            receipts. Unknown outcomes never qualify. Python additionally checks an exact current submit
            confirmation and an explicit prior monitor request before exposing geo_monitor; ordinary
            optimization, negation, summaries and assistant suggestions cannot authorize execution.
            GEO context.read may also include articleContinuation: authorized=false, reviewRequired=true, action=article.generate,
            currentMessageId/conversationId/projectId/sourceMessageId/offerMessageId (string IDs),
            requestText/sourceText/offerText (each at most 4000 characters, complete, never silently truncated),
            optional geoReportId, and submissionState=NOT_ATTEMPTED.
            Only an exact short affirmative USER reply to the immediately preceding completed, same-project,
            ASSISTANT response within 24 hours can form a semantic candidate. Java does not match assistant
            phrasing or keywords to authorize work. Source messages, memory cutoff and unsubmitted status are
            verified by Java; the Harness reviews current/source/offer prose and supplies continuationReview
            only for NEW_DRAFT. At admission Java reconstructs and matches the three IDs, revalidates source
            identity and explicit report, then freezes authorized=true in the existing stage snapshot.
            The combined request retains source requirements and proposed editorial structure, not new brand
            facts, monitoring or publication authority. Consumed offers instead return authorized=false,
            reviewRequired=false, submissionState=ALREADY_STARTED, and preparation={id,articleId,status};
            this is read-only existing work, not permission to execute again. No model-selected history IDs
            or replacement brief are accepted. The account lock and frozen offer provenance prevent duplicate
            admission across runs, including failed or unknown article preparations; no database migration.
            GEO context.read may include latestArticle, selected only by Java from this owned project and
            conversation before the current USER message. Fields are preparationId/articleId (string IDs),
            title/version/articleStatus/preparationStatus/workflowStage/updatedAt, bodyText (at most 12000
            UTF-16 characters with paragraph boundaries), bodyAvailable/totalCharacters/returnedCharacters/
            truncated/bodyComplete, source=PERSISTED_ARTICLE, referenceOnly=true. This is the most recent
            non-archived preparation, including failed/running status; no older successful draft is silently
            substituted. bodyComplete requires stored nonblank body, no truncation, COMPLETED article and
            SUCCEEDED preparation. Stream previews are not returned and no model-supplied article ID is accepted.
            bodyPredatesMemoryBoundary marks articles created before the latest ACCOUNT/PROJECT memory cutoff;
            their persisted text remains readable solely to review that document, never as current brand facts
            or automatic writing references. Deleting memory does not delete a user's article.
            Article admission preserves the exact current USER request in the frozen parent. Java may freeze
            articleWritingReference containing source message IDs and roles (at most four completed same-project,
            same-chat messages within 24 hours before that USER), and a bounded older article excerpt/version.
            Messages and article references before the current ACCOUNT/PROJECT memory cutoff are excluded.
            This reference cannot authorize execution or establish brand facts. Current USER constraints always
            take precedence, including neutral/anonymous content. The existing verified offer is the base for
            short confirmations. Only spare space in the existing 4000-character worker brief is used; the
            current request is never truncated. Provenance is stripped before provider dispatch, not a new
            provider field. Querying/complaining about a draft does not itself create a task.
            brand.save returns projectId/name/aliases/sourceMessageId.
            geo.monitor returns taskId/status/topicId/quotedPoints/reportId/reused.
            article.generate returns RunArticlePreparation. COMPLETED acknowledges tool admission;
            only data.status=SUCCEEDED means the article is finished. It never submits to a media outlet.
            image.generate/video.generate return taskId/taskType/status/quotedPoints/reused; status QUEUED is
            admission only. Creative context.read recentTasks instead returns this conversation's last five
            IMAGE/VIDEO tasks with taskId/taskType/status/quotedPoints/settledPoints, even when project is null.
            memory.read returns AgentMemoryContext; memory.upsert/forget return entry (AgentMemoryEntry) and memory (AgentMemoryContext).
            WAIT_INPUT returns reasonCode/message. All Snowflake IDs are strings.
    RunArticlePreparation:
      type: object
      additionalProperties: false
      required: [id, templateCode, status, conversationId, articleId, articleVersion, quotedPoints, settledPoints, releasedPoints, deadlineAt, errorCode, stages, publicationRequiresConfirmation, knowledgeSourcesCurrent]
      properties:
        id: { $ref: '#/components/schemas/SnowflakeId' }
        templateCode: { type: string, const: ARTICLE_FULL_V1 }
        status: { type: string, enum: [RUNNING, SUCCEEDED, FAILED] }
        conversationId: { $ref: '#/components/schemas/SnowflakeId' }
        articleId: { $ref: '#/components/schemas/SnowflakeId' }
        articleVersion: { type: integer, minimum: 1 }
        quotedPoints: { type: integer, minimum: 0 }
        settledPoints: { type: integer, minimum: 0 }
        releasedPoints: { type: integer, minimum: 0 }
        deadlineAt: { type: string, format: date-time }
        errorCode: { type: [string, 'null'], minLength: 1, maxLength: 128 }
        publicationRequiresConfirmation: { type: boolean, const: true }
        knowledgeSourcesCurrent: { type: boolean }
        stages:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: object
            additionalProperties: false
            required: [ordinal, mode, status, taskId, quotedPoints, errorCode]
            properties:
              ordinal: { type: integer, minimum: 1, maximum: 3 }
              mode: { type: string, enum: [TITLE, OUTLINE, BODY] }
              status: { type: string, enum: [PENDING, READY, RUNNING, WAITING, SUCCEEDED, FAILED, SKIPPED] }
              taskId: { type: [string, 'null'], pattern: '^[1-9][0-9]{0,18}$' }
              quotedPoints: { type: integer, minimum: 0 }
              errorCode: { type: [string, 'null'], minLength: 1, maxLength: 128 }
    RunResourceSearchRequest:
      type: object
      additionalProperties: false
      required: [toolCallId, kind, keyword]
      properties:
        toolCallId: { type: string, minLength: 1, maxLength: 128, pattern: ".*\\S.*" }
        kind: { type: string, enum: [SPACE, PRODUCT, GEO_TOPIC] }
        keyword: { type: string, minLength: 1, maxLength: 200, pattern: ".*\\S.*" }
        scopeRef: { $ref: "#/components/schemas/SnowflakeId" }
    RunResourceCandidate:
      type: object
      additionalProperties: false
      required: [choiceId, kind, resourceId, name, hasReport, exact]
      properties:
        choiceId: { type: string, minLength: 1, maxLength: 128 }
        kind: { type: string, enum: [SPACE, PRODUCT, GEO_TOPIC] }
        resourceId: { $ref: "#/components/schemas/SnowflakeId" }
        name: { type: string, minLength: 1, maxLength: 200 }
        spaceId: { $ref: "#/components/schemas/SnowflakeId" }
        spaceName: { type: string, minLength: 1, maxLength: 200 }
        hasReport: { type: boolean }
        exact: { type: boolean }
    RunResourceSearchResponse:
      type: object
      additionalProperties: false
      required: [candidateSetId, kind, status, totalMatches, complete, candidates, expiresAt]
      properties:
        candidateSetId: { $ref: "#/components/schemas/SnowflakeId" }
        kind: { type: string, enum: [SPACE, PRODUCT, GEO_TOPIC] }
        status: { type: string, enum: [UNIQUE, MULTIPLE, NOT_FOUND, INCOMPLETE] }
        totalMatches: { type: integer, format: int64, minimum: 0 }
        complete: { type: boolean }
        candidates: { type: array, maxItems: 6, items: { $ref: "#/components/schemas/RunResourceCandidate" } }
        expiresAt: { type: string, format: date-time }
    RunResourceSelection:
      type: object
      additionalProperties: false
      required: [kind, resourceId, name, spaceId, productId, candidateSetId, choiceId]
      properties:
        kind: { type: string, enum: [SPACE, PRODUCT, GEO_TOPIC] }
        resourceId: { $ref: "#/components/schemas/SnowflakeId" }
        name: { type: string, minLength: 1, maxLength: 200 }
        spaceId: { $ref: "#/components/schemas/SnowflakeId" }
        productId:
          oneOf: [{ $ref: "#/components/schemas/SnowflakeId" }, { type: "null" }]
        candidateSetId: { $ref: "#/components/schemas/SnowflakeId" }
        choiceId: { type: string, minLength: 1, maxLength: 128 }
    RunResourceReadRequest:
      type: object
      additionalProperties: false
      description: >-
        When this Run contains READY/EXPLICIT_REPORT geoInsightContext, LATEST_GEO_REPORT reads
        the exact browser-selected report for its topic regardless of reportPolicy; it never resolves
        a newer report. GEO_ANSWER_EVIDENCE must continue an observation for that same report.
        Owner, selected project/product, active project, unarchived terminal report and existing
        candidate/observation lifecycle constraints still apply. Reads create no monitoring or paid tasks.
      required: [toolCallId, purpose]
      properties:
        toolCallId: { type: string, minLength: 1, maxLength: 128, pattern: ".*\\S.*" }
        purpose: { type: string, enum: [CATALOG_SUMMARY, LATEST_GEO_REPORT, GEO_ANSWER_EVIDENCE, GEO_DIAGNOSTIC_REPORT, ASSET_INVENTORY] }
        candidateSetId: { $ref: "#/components/schemas/SnowflakeId" }
        choiceId: { type: string, minLength: 1, maxLength: 128 }
        observationId: { $ref: "#/components/schemas/SnowflakeId" }
        reportPolicy: { type: string, enum: [LATEST_ATTEMPT, LATEST_USABLE], default: LATEST_ATTEMPT }
        sampleRefs: { type: array, maxItems: 3, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 200 } }
      oneOf:
        - required: [candidateSetId, choiceId]
          not: { required: [observationId] }
        - required: [observationId]
          not:
            anyOf: [{ required: [candidateSetId] }, { required: [choiceId] }]
    RunResourceReportAttempt:
      type: object
      additionalProperties: false
      required: [runId, status, createdAt, newerFailedAttempt]
      properties:
        runId: { $ref: "#/components/schemas/SnowflakeId" }
        status: { type: string, enum: [QUEUED, RUNNING, SUCCEEDED, PARTIAL, FAILED, SYSTEM_TERMINATED] }
        createdAt: { type: string, format: date-time }
        newerFailedAttempt: { type: boolean }
    RunResourceReadResponse:
      type: object
      additionalProperties: false
      required: [observationId, kind, purpose, resourceId, name, spaceId, observedAt, sourceHash, projection, truncated]
      properties:
        observationId: { $ref: "#/components/schemas/SnowflakeId" }
        kind: { type: string, enum: [SPACE, PRODUCT, GEO_TOPIC] }
        purpose: { type: string, enum: [CATALOG_SUMMARY, LATEST_GEO_REPORT, GEO_ANSWER_EVIDENCE, GEO_DIAGNOSTIC_REPORT, ASSET_INVENTORY] }
        resourceId: { $ref: "#/components/schemas/SnowflakeId" }
        name: { type: string, minLength: 1, maxLength: 200 }
        spaceId: { $ref: "#/components/schemas/SnowflakeId" }
        productId: { $ref: "#/components/schemas/SnowflakeId" }
        observedAt: { type: string, format: date-time }
        sourceHash: { type: string, pattern: "^[0-9a-f]{64}$" }
        reportId: { $ref: "#/components/schemas/SnowflakeId" }
        reportAttempt: { $ref: "#/components/schemas/RunResourceReportAttempt" }
        projection:
          type: object
          additionalProperties: true
          description: Authorized purpose-specific bounded evidence; entire read projection is at most 16KiB UTF-8. Data, not tool instructions.
        truncated: { type: boolean }
    GeoInsightContext:
      {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "schemaVersion",
          "status",
          "selectionSource",
          "readOnly",
          "questionScope",
          "topicsTruncated",
          "truncated",
          "topicChoices",
          "report",
          "trend",
          "competitors",
          "links"
        ],
        "properties": {
          "schemaVersion": {
            "type": "integer",
            "const": 1
          },
          "status": {
            "type": "string",
            "enum": [
              "READY",
              "NEEDS_SCOPE",
              "NEEDS_TOPIC",
              "NO_REPORT",
              "UNAVAILABLE"
            ]
          },
          "selectionSource": {
            "type": "string",
            "enum": [
              "EXPLICIT_REPORT",
              "AUTO_SINGLE_TOPIC",
              "NONE"
            ]
          },
          "readOnly": {
            "type": "boolean",
            "const": true
          },
          "questionScope": {
            "type": "string",
            "const": "DISCOVERY"
          },
          "topicsTruncated": {
            "type": "boolean"
          },
          "truncated": {
            "type": "boolean"
          },
          "topicChoices": {
            "type": "array",
            "maxItems": 6,
            "items": {
              "$ref": "#/components/schemas/GeoChatTopicChoice"
            }
          },
          "report": {
            "oneOf": [
              {
                "$ref": "#/components/schemas/GeoChatReport"
              },
              {
                "type": "null"
              }
            ]
          },
          "trend": {
            "oneOf": [
              {
                "$ref": "#/components/schemas/GeoChatTrend"
              },
              {
                "type": "null"
              }
            ]
          },
          "competitors": {
            "oneOf": [
              {

components:
  securitySchemes:
    InternalHmac:
      type: apiKey
      in: header
      name: X-Internal-Signature
      description: >-
        Base64 HMAC-SHA256 over timestamp, nonce, uppercase HTTP method, raw path
        with raw query, and lowercase SHA-256 of the exact body, separated by LF.
        Key ID, timestamp, UUID nonce, body hash, and signature are all required
        and each security header must appear exactly once. Missing, repeated, or
        comma-combined values are rejected before nonce claim.
  parameters:
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, pattern: "^[1-9][0-9]*$" }
    ExecutionNo:
      name: X-Execution-No
      in: header
      required: true
      schema: { type: integer, minimum: 1 }
    ExecutionToken:
      name: X-Execution-Token
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 512 }
    InternalKeyId:
      in: header
      name: X-Internal-Key-Id
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    InternalTimestamp:
      in: header
      name: X-Internal-Timestamp
      required: true
      schema:
        type: string
        pattern: "^-?[0-9]{1,20}$"
    InternalNonce:
      in: header
      name: X-Internal-Nonce
      required: true
      description: Canonical 36-character lowercase UUID; uppercase or non-canonical forms are rejected before nonce claim.
      schema:
        type: string
        format: uuid
        pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
    ContentSha256:
      in: header
      name: X-Content-SHA256
      required: true
      schema:
        type: string
        pattern: "^[0-9a-f]{64}$"
    InternalSignature:
      in: header
      name: X-Internal-Signature
      required: true
      schema:
        type: string
        maxLength: 128
    Traceparent:
      in: header
      name: traceparent
      required: false
      description: Valid W3C trace context is continued; otherwise Java creates a new trace.
      schema:
        $ref: "#/components/schemas/Traceparent"
  responses:
    Forbidden:
      description: The unsigned readiness request did not originate from loopback.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InternalErrorResponse"
    InternalUnauthorized:
      description: HMAC validation failed or the nonce was replayed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InternalErrorResponse"
    InternalAuthenticationUnavailable:
      description: Nonce storage is unavailable; authentication fails closed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InternalErrorResponse"
    InternalNotFound:
      description: The task or Outbox event does not exist.
      content: { application/json: { schema: { $ref: "#/components/schemas/InternalErrorResponse" } } }
    InternalConflict:
      description: The task state, execution lease, or idempotent claim conflicts.
      content: { application/json: { schema: { $ref: "#/components/schemas/InternalErrorResponse" } } }
    InternalValidationFailed:
      description: The path, body, or provider evidence is invalid.
      content: { application/json: { schema: { $ref: "#/components/schemas/InternalErrorResponse" } } }
  schemas:
    RunCompactionSourceRequest:
      type: object
      additionalProperties: false
      required: [maxSourceChars, force]
      properties:
        maxSourceChars: { type: integer, minimum: 4000, maximum: 24000 }
        force: { type: boolean }
    RunCompactionCommitRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, throughSequence, sourceHash, summary, maxSourceChars, force]
      properties:
        expectedVersion: { type: integer, minimum: 0 }
        throughSequence: { type: integer, format: int64, minimum: 1 }
        sourceHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        summary: { type: string, minLength: 1, maxLength: 6000 }
        maxSourceChars: { type: integer, minimum: 4000, maximum: 24000 }
        force: { type: boolean }
    RunCompactionSource:
      type: object
      additionalProperties: false
      required: [version, throughSequence, summary, sourceHash, sourceThroughSequence, needsCompaction, hasMore, messages, recentMessages, memory]
      properties:
        version: { type: integer, minimum: 0 }
        throughSequence: { type: integer, format: int64, minimum: 0 }
        summary: { type: string, maxLength: 6000 }
        sourceHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        sourceThroughSequence: { type: integer, format: int64, minimum: 0 }
        needsCompaction: { type: boolean }
        hasMore: { type: boolean }
        messages: { type: array, items: { $ref: '#/components/schemas/ConversationMemoryMessage' } }
        recentMessages: { type: array, items: { $ref: '#/components/schemas/ConversationMemoryMessage' } }
        memory: { $ref: '#/components/schemas/AgentMemoryContext' }
    AgentMemoryEntry:
      type: object
      additionalProperties: false
      required: [id, scope, projectId, kind, key, label, value, version, deleted, sourceType, sourceMessageId, sourceConversationId, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/BusinessId' }
        scope: { type: string, enum: [PROJECT, ACCOUNT] }
        projectId: { anyOf: [{ $ref: '#/components/schemas/BusinessId' }, { type: 'null' }] }
        kind: { type: string, enum: [FACT, PREFERENCE] }
        key: { type: string, pattern: '^[a-z][a-z0-9_.-]{0,63}$' }
        label: { type: string, minLength: 1, maxLength: 100 }
        value: { anyOf: [{ type: string, minLength: 1, maxLength: 2000 }, { type: 'null' }] }
        version: { type: integer, minimum: 1 }
        deleted: { type: boolean }
        sourceType: { type: string, enum: [USER_MESSAGE, USER_INPUT] }
        sourceMessageId: { anyOf: [{ $ref: '#/components/schemas/BusinessId' }, { type: 'null' }] }
        sourceConversationId: { anyOf: [{ $ref: '#/components/schemas/BusinessId' }, { type: 'null' }] }
        updatedAt: { type: string, format: date-time }
    AgentMemoryContext:
      type: object
      additionalProperties: false
      required: [schemaVersion, projectId, entries, revision, historyCutoffAt]
      properties:
        schemaVersion: { const: 1 }
        projectId: { anyOf: [{ $ref: '#/components/schemas/BusinessId' }, { type: 'null' }] }
        entries: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/AgentMemoryEntry' } }
        revision: { type: string, minLength: 1, maxLength: 128 }
        historyCutoffAt: { anyOf: [{ type: string, format: date-time }, { type: 'null' }] }
      description: Authoritative current project plus explicit ACCOUNT preferences, including value-free tombstones. Maximum 100 entries and 6000 key/label/value characters per scope; no silent tombstone truncation. Corrections/deletions fence old model history and summary, not stored chat UI. Current USER and independent task/report references remain.
    RunMemoryUpsertArguments:
      type: object
      additionalProperties: false
      required: [kind, key, label, value, expectedVersion, sourceQuote]
      properties:
        scope: { type: string, enum: [PROJECT, ACCOUNT], default: PROJECT }
        kind: { type: string, enum: [FACT, PREFERENCE] }
        key: { type: string, pattern: '^[a-z][a-z0-9_.-]{0,63}$' }
        label: { type: string, minLength: 1, maxLength: 100 }
        value: { type: string, minLength: 1, maxLength: 2000 }
        expectedVersion: { type: integer, minimum: 0 }
        sourceQuote: { type: string, minLength: 1, maxLength: 4000 }
        mode: { type: string, enum: [REPLACE, APPEND], default: REPLACE }
      description: expectedVersion=0 only for a new key; otherwise exact current version including tombstones. value must be an exact substring of sourceQuote, which must be literal current USER text. Old source messages cannot overwrite later corrections. APPEND is allowed only for an existing live PROJECT FACT brand.categories entry; Java retains its current value and appends new exact newline fragments, deduplicating exact whole fragments, within the 2000-character entry limit. Missing or deleted entries require REPLACE. APPEND never expands service or exposure regions. ACCOUNT requires an explicit all-project expression preference; brand facts remain PROJECT.
    RunMemoryForgetArguments:
      type: object
      additionalProperties: false
      required: [key, expectedVersion, sourceQuote]
      properties:
        scope: { type: string, enum: [PROJECT, ACCOUNT], default: PROJECT }
        key: { type: string, pattern: '^[a-z][a-z0-9_.-]{0,63}$' }
        expectedVersion: { type: integer, minimum: 1 }
        sourceQuote: { type: string, minLength: 1, maxLength: 4000 }
      description: Requires an explicit forget/delete instruction in current USER text. Stored old value and original label are removed; no sourceQuote is exposed by memory projection.

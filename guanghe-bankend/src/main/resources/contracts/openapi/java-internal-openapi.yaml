openapi: 3.1.0
info:
  title: Zhixiaohe Java Internal M1/M2B API
  version: 1.16.0-geo-diagnostic-delivery
  description: >-
    Frozen M1 control-plane security envelope. Every /internal/v1 operation is
    loopback-only. Readiness is the only unsigned operation; all other calls
    require the complete HMAC header set and a one-time nonce.
servers:
  - url: http://127.0.0.1:8080
paths:
  /internal/v1/health/ready:
    get:
      operationId: getJavaReadiness
      summary: Return Java capability and deployment gate state.
      description: Unsigned, but accepted only from a loopback peer.
      security: []
      responses:
        "200":
          description: Java process is ready to answer the M0/M1 probe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JavaReadiness"
        "403":
          $ref: "#/components/responses/Forbidden"
  /internal/v1/test/reverse-call:
    post:
      operationId: reverseHmacProbe
      summary: Verify a Python-to-Java signed POST in non-production environments.
      description: Available only when the dev/test probe is explicitly enabled.
      security:
        - InternalHmac: []
      parameters:
        - name: mode
          in: query
          required: true
          description: Fixed proof that Python signs and sends the raw query target.
          schema:
            type: string
            enum: [python-m1]
        - $ref: "#/components/parameters/InternalKeyId"
        - $ref: "#/components/parameters/InternalTimestamp"
        - $ref: "#/components/parameters/InternalNonce"
        - $ref: "#/components/parameters/ContentSha256"
        - $ref: "#/components/parameters/InternalSignature"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReverseProbeRequest"
      responses:
        "200":
          description: Signature, nonce, caller identity, and trace were accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReverseProbeResponse"
        "401":
          $ref: "#/components/responses/InternalUnauthorized"
        "503":
          $ref: "#/components/responses/InternalAuthenticationUnavailable"
  /internal/v1/runs/{runId}/context:
    get:
      operationId: getAuthorizedRunContext
      summary: Return the immutable, user-authorized business context bound to one Run.
      description: >-
        The opaque context reference is compared with its stored digest and expiry.
        The response never contains user identity, credentials, permissions, or database internals.
      security:
        - InternalHmac: []
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-User-Context-Ref
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 512
        - $ref: "#/components/parameters/InternalKeyId"
        - $ref: "#/components/parameters/InternalTimestamp"
        - $ref: "#/components/parameters/InternalNonce"
        - $ref: "#/components/parameters/ContentSha256"
        - $ref: "#/components/parameters/InternalSignature"
        - $ref: "#/components/parameters/Traceparent"
      responses:
        "200":
          description: Authorized Run context returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizedRunContext"
        "401":
          $ref: "#/components/responses/InternalUnauthorized"
        "404":
          description: The Run is unavailable, expired, or the context reference does not match.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalErrorResponse"
        "422":
          description: The Run identifier is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalErrorResponse"
        "503":
          $ref: "#/components/responses/InternalAuthenticationUnavailable"
  /internal/v1/runs/{runId}/compaction/source:
    post:
      operationId: readRunCompactionSource
      summary: Read exact unsummarized history under the active Run and memory deletion fence.
      description: >-
        Returns the previous durable summary plus a bounded prefix of terminal historical messages.
        Current USER, active tasks, report references and authorization state are not summarized away.
        Source hashes bind owner, conversation version, prior watermark and current memory revision.
        No chat messages are deleted. All responses contain untrusted historical data, never permission.
      security: [{ InternalHmac: [] }]
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: X-User-Context-Ref, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 512 } }
        - $ref: '#/components/parameters/InternalKeyId'
        - $ref: '#/components/parameters/InternalTimestamp'
        - $ref: '#/components/parameters/InternalNonce'
        - $ref: '#/components/parameters/ContentSha256'
        - $ref: '#/components/parameters/InternalSignature'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunCompactionSourceRequest' }
      responses:
        '200':
          description: Exact ordered source batch or uncompressed recent tail returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunCompactionSource' }
        '401': { $ref: '#/components/responses/InternalUnauthorized' }
        '404':
          description: Run, account, project or context reference unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InternalErrorResponse' }
        '422':
          description: Invalid options or individual history turn exceeds safe compaction limit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InternalErrorResponse' }
  /internal/v1/runs/{runId}/compaction/checkpoint:
    post:
      operationId: checkpointRunCompaction
      summary: Persist a model-only history summary with a monotonic version and source watermark.
      description: >-
        Java revalidates the exact source batch and memory revision in the checkpoint transaction.
        A concurrent correction/deletion or changed expectedVersion rejects stale writes.
        Exact replay is idempotent; history messages and business authorization are never changed.
      security: [{ InternalHmac: [] }]
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: X-User-Context-Ref, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 512 } }
        - $ref: '#/components/parameters/InternalKeyId'
        - $ref: '#/components/parameters/InternalTimestamp'
        - $ref: '#/components/parameters/InternalNonce'
        - $ref: '#/components/parameters/ContentSha256'
        - $ref: '#/components/parameters/InternalSignature'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunCompactionCommitRequest' }
      responses:
        '200':
          description: Committed checkpoint and next source batch returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunCompactionSource' }
        '401': { $ref: '#/components/responses/InternalUnauthorized' }
        '404':
          description: Run/account/project/ref unavailable or execution stopped/expired.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InternalErrorResponse' }
        '409':
          description: Summary version, source watermark/hash or memory revision changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InternalErrorResponse' }
        '422':
          description: Invalid or oversized summary; previous checkpoint remains intact.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InternalErrorResponse' }
  /internal/v1/runs/{runId}/actions:
    post:
      operationId: executeAuthorizedRunAction
      summary: Execute one bounded native GEO agent action under the originating USER Run.
      description: >-
        Java derives owner, agent identity, selected project, source USER message, prices and budgets.
        brand.save saves only exact public brand identity, never appends raw USER text as a document.
        geo.monitor admits at most one distinct monitor per Run, replays retries and reuses an identical
        active task in the conversation. It uses existing task/points/outbox transactions without
        fabricating a user confirmation. Unbound conversations never guess a client's project.
        memory.read/upsert/forget use the current trusted project, versioned keys and current USER provenance;
        ACCOUNT allows only explicitly all-project expression preferences. Tool parameters cannot specify an owner or project.
        Publishing is not available here. Live Run/ref/account validation precedes every replay.
      security: [{ InternalHmac: [] }]
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-User-Context-Ref
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 512 }
        - $ref: "#/components/parameters/InternalKeyId"
        - $ref: "#/components/parameters/InternalTimestamp"
        - $ref: "#/components/parameters/InternalNonce"
        - $ref: "#/components/parameters/ContentSha256"
        - $ref: "#/components/parameters/InternalSignature"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunActionRequest" }
      responses:
        "200":
          description: Structured action result, or bounded request for missing user information.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunActionResponse" }
        "401": { $ref: "#/components/responses/InternalUnauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Run, context reference or owned project is unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InternalErrorResponse" }
        "409":
          description: Conflicting idempotency input, action budget, or business state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InternalErrorResponse" }
        "422":
          description: Invalid action arguments or unsupported fields.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InternalErrorResponse" }
        "503": { $ref: "#/components/responses/InternalAuthenticationUnavailable" }
  /internal/v1/runs/{runId}/resources/search:
    post:
      operationId: searchAuthorizedRunResources
      summary: Find bounded resource candidates owned by the active Run account.
      description: >-
        Exact total count and literal normalized matching; never infers uniqueness from a partial page.
        Additional searches in the same active Run do not invalidate its earlier issued candidate sets.
      security: [{ InternalHmac: [] }]
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-User-Context-Ref
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 512 }
        - $ref: "#/components/parameters/InternalKeyId"
        - $ref: "#/components/parameters/InternalTimestamp"
        - $ref: "#/components/parameters/InternalNonce"
        - $ref: "#/components/parameters/ContentSha256"
        - $ref: "#/components/parameters/InternalSignature"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunResourceSearchRequest" }
      responses:
        "200":
          description: Persisted bounded search result (not catalog body text).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunResourceSearchResponse" }
        "401": { $ref: "#/components/responses/InternalUnauthorized" }
        "404":
          description: Run, context reference or authorized resource is unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InternalErrorResponse" }
        "409":
          description: Reused tool call with different input or resource call budget exhausted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InternalErrorResponse" }
        "422":
          description: Invalid bounded query.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InternalErrorResponse" }
        "503": { $ref: "#/components/responses/InternalAuthenticationUnavailable" }
  /internal/v1/runs/{runId}/resources/read:
    post:
      operationId: readAuthorizedRunResource
      summary: Read one saved candidate or observation and persist a frozen bounded projection.
      description: >-
        Authorization precedes replay; original toolCallId replays precede candidate expiry and consumption.
        A candidate set issued by this active Run remains readable after another search in that Run,
        provided its owner, conversation, selected scope, reset boundary, expiry and set-wide unconsumed
        state are still valid. Across Runs only the current candidate set remains eligible as before.
        After a successful candidate read, continue from the returned observationId rather than reusing
        its consumed candidate set with a new toolCallId.
        Latest attempt without a report returns truthful attempt metadata, never a fabricated report.
      security: [{ InternalHmac: [] }]
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-User-Context-Ref
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 512 }
        - $ref: "#/components/parameters/InternalKeyId"
        - $ref: "#/components/parameters/InternalTimestamp"
        - $ref: "#/components/parameters/InternalNonce"
        - $ref: "#/components/parameters/ContentSha256"
        - $ref: "#/components/parameters/InternalSignature"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunResourceReadRequest" }
      responses:
        "200":
          description: Persisted authorized read; reportId is omitted if no report exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunResourceReadResponse" }
        "401": { $ref: "#/components/responses/InternalUnauthorized" }
        "404":
          description: Run, context reference, candidate or observation is unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InternalErrorResponse" }
        "409":
          description: Candidate consumed or reset, input conflict, or bounded resource budget exhausted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InternalErrorResponse" }
        "422":
          description: Invalid purpose, source combination or evidence sample references.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InternalErrorResponse" }
        "503": { $ref: "#/components/responses/InternalAuthenticationUnavailable" }
  /internal/v1/runs/{runId}/workflow-plans:
    post:
      operationId: proposeWorkflowPlan
      summary: Persist one proposal-only complex workflow and its existing TaskDraft references.
      description: >-
        Java verifies the active Run context, ownership, DAG, tool policy, budgets and quotes.
        This operation never consumes confirmation, creates business tasks, freezes points,
        publishes RabbitMQ messages or invokes a Provider.
      security: [{ InternalHmac: [] }]
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-User-Context-Ref
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 512 }
        - $ref: "#/components/parameters/InternalKeyId"
        - $ref: "#/components/parameters/InternalTimestamp"
        - $ref: "#/components/parameters/InternalNonce"
        - $ref: "#/components/parameters/ContentSha256"
        - $ref: "#/components/parameters/InternalSignature"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkflowPlanProposalRequest" }
      responses:
        "201": { description: Plan and proposal-only TaskDrafts persisted atomically., content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowPlan" } } } }
        "401": { $ref: "#/components/responses/InternalUnauthorized" }
        "404": { $ref: "#/components/responses/InternalNotFound" }
        "409": { $ref: "#/components/responses/InternalConflict" }
        "422": { $ref: "#/components/responses/InternalValidationFailed" }
        "503": { $ref: "#/components/responses/InternalAuthenticationUnavailable" }
  /internal/v1/workflow-plans/{planId}/claim:
    post:
      operationId: claimWorkflowExecution
      summary: Idempotently claim the current workflow execution generation.
      security: [{ InternalHmac: [] }]
      parameters:
        - { name: planId, in: path, required: true, schema: { $ref: "#/components/schemas/BusinessId" } }
        - { $ref: "#/components/parameters/InternalKeyId" }
        - { $ref: "#/components/parameters/InternalTimestamp" }
        - { $ref: "#/components/parameters/InternalNonce" }
        - { $ref: "#/components/parameters/ContentSha256" }
        - { $ref: "#/components/parameters/InternalSignature" }
        - { $ref: "#/components/parameters/Traceparent" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowExecutionClaimRequest" } } } }
      responses:
        "200": { description: Claim disposition returned., content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowExecutionClaimResponse" } } } }
        "401": { $ref: "#/components/responses/InternalUnauthorized" }
        "404": { $ref: "#/components/responses/InternalNotFound" }
        "409": { $ref: "#/components/responses/InternalConflict" }
        "422": { $ref: "#/components/responses/InternalValidationFailed" }
        "503": { $ref: "#/components/responses/InternalAuthenticationUnavailable" }
  /internal/v1/workflow-plans/{planId}/execution-context:
    get:
      operationId: getWorkflowExecutionContext
      summary: Return the immutable plan, steps, budget and previously accepted observations.
      security: [{ InternalHmac: [] }]
      parameters:
        - { name: planId, in: path, required: true, schema: { $ref: "#/components/schemas/BusinessId" } }
        - { $ref: "#/components/parameters/ExecutionNo" }
        - { $ref: "#/components/parameters/ExecutionToken" }
        - { $ref: "#/components/parameters/InternalKeyId" }
        - { $ref: "#/components/parameters/InternalTimestamp" }
        - { $ref: "#/components/parameters/InternalNonce" }
        - { $ref: "#/components/parameters/ContentSha256" }
        - { $ref: "#/components/parameters/InternalSignature" }
        - { $ref: "#/components/parameters/Traceparent" }
      responses:
        "200": { description: Immutable execution context returned., content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowExecutionContext" } } } }
        "401": { $ref: "#/components/responses/InternalUnauthorized" }
        "404": { $ref: "#/components/responses/InternalNotFound" }
        "409": { $ref: "#/components/responses/InternalConflict" }
        "422": { $ref: "#/components/responses/InternalValidationFailed" }
        "503": { $ref: "#/components/responses/InternalAuthenticationUnavailable" }
  /internal/v1/workflow-plans/{planId}/heartbeat:
    post:
      operationId: heartbeatWorkflowExecution
      summary: Renew the current fenced workflow execution lease.
      security: [{ InternalHmac: [] }]
      parameters:
        - { name: planId, in: path, required: true, schema: { $ref: "#/components/schemas/BusinessId" } }
        - { $ref: "#/components/parameters/InternalKeyId" }
        - { $ref: "#/components/parameters/InternalTimestamp" }
        - { $ref: "#/components/parameters/InternalNonce" }
        - { $ref: "#/components/parameters/ContentSha256" }
        - { $ref: "#/components/parameters/InternalSignature" }
        - { $ref: "#/components/parameters/Traceparent" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowExecutionHeartbeatRequest" } } } }
      responses:
        "200": { description: Lease renewed., content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowExecutionHeartbeatResponse" } } } }
        "401": { $ref: "#/components/responses/InternalUnauthorized" }
        "409": { $ref: "#/components/responses/InternalConflict" }
        "422": { $ref: "#/components/responses/InternalValidationFailed" }
        "503": { $ref: "#/components/responses/InternalAuthenticationUnavailable" }
  /internal/v1/workflow-plans/{planId}/observations:
    post:
      operationId: appendWorkflowObservation
      summary: Append one idempotent, immutable and size-bounded tool observation.
      security: [{ InternalHmac: [] }]
      parameters:
        - { name: planId, in: path, required: true, schema: { $ref: "#/components/schemas/BusinessId" } }
        - { $ref: "#/components/parameters/InternalKeyId" }
        - { $ref: "#/components/parameters/InternalTimestamp" }
        - { $ref: "#/components/parameters/InternalNonce" }
        - { $ref: "#/components/parameters/ContentSha256" }
        - { $ref: "#/components/parameters/InternalSignature" }
        - { $ref: "#/components/parameters/Traceparent" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowObservationRequest" } } } }
      responses:
        "200": { description: Observation disposition returned., content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowObservationAccepted" } } } }
        "401": { $ref: "#/components/responses/InternalUnauthorized" }
        "404": { $ref: "#/components/responses/InternalNotFound" }
        "409": { $ref: "#/components/responses/InternalConflict" }
        "422": { $ref: "#/components/responses/InternalValidationFailed" }
        "503": { $ref: "#/components/responses/InternalAuthenticationUnavailable" }
  /internal/v1/workflow-plans/{planId}/steps/{stepId}/state:
    put:
      operationId: reportWorkflowStepState
      summary: Apply one fenced and idempotent step transition.
      security: [{ InternalHmac: [] }]
      parameters:
        - { name: planId, in: path, required: true, schema: { $ref: "#/components/schemas/BusinessId" } }
        - { name: stepId, in: path, required: true, schema: { type: string, pattern: "^step-[1-9][0-9]?$" } }
        - { $ref: "#/components/parameters/InternalKeyId" }
        - { $ref: "#/components/parameters/InternalTimestamp" }
        - { $ref: "#/components/parameters/InternalNonce" }
        - { $ref: "#/components/parameters/ContentSha256" }
        - { $ref: "#/components/parameters/InternalSignature" }
        - { $ref: "#/components/parameters/Traceparent" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowStepStateRequest" } } } }
      responses:
        "200": { description: Step transition disposition returned., content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowExecutionAccepted" } } } }
        "401": { $ref: "#/components/responses/InternalUnauthorized" }
        "404": { $ref: "#/components/responses/InternalNotFound" }
        "409": { $ref: "#/components/responses/InternalConflict" }
        "422": { $ref: "#/components/responses/InternalValidationFailed" }
        "503": { $ref: "#/components/responses/InternalAuthenticationUnavailable" }
  /internal/v1/workflow-plans/{planId}/steps/{stepId}/task:
    post:
      operationId: activateWorkflowStepTask
      summary: Atomically allocate plan funding and materialize the authorized PREPARE TaskDraft.
      description: >-
        This is also the durable wait-for-task boundary. It never accepts a browser confirmation
        token, price, Provider, model, user or role. A successful activation fences the current
        workflow execution while the existing paid-task control plane owns execution and settlement.
      security: [{ InternalHmac: [] }]
      parameters:
        - { name: planId, in: path, required: true, schema: { $ref: "#/components/schemas/BusinessId" } }
        - { name: stepId, in: path, required: true, schema: { type: string, pattern: "^step-[1-9][0-9]?$" } }
        - { $ref: "#/components/parameters/InternalKeyId" }
        - { $ref: "#/components/parameters/InternalTimestamp" }
        - { $ref: "#/components/parameters/InternalNonce" }
        - { $ref: "#/components/parameters/ContentSha256" }
        - { $ref: "#/components/parameters/InternalSignature" }
        - { $ref: "#/components/parameters/Traceparent" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowTaskActivationRequest" } } } }
      responses:
        "200": { description: Existing or newly materialized Task and durable wait disposition., content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowTaskActivationResponse" } } } }
        "401": { $ref: "#/components/responses/InternalUnauthorized" }
        "404": { $ref: "#/components/responses/InternalNotFound" }
        "409": { $ref: "#/components/responses/InternalConflict" }
        "422": { $ref: "#/components/responses/InternalValidationFailed" }
        "503": { $ref: "#/components/responses/InternalAuthenticationUnavailable" }
  /internal/v1/workflow-plans/{planId}/replans:
    post:
      operationId: replanWorkflowExecution
      summary: Revise pending steps once without changing tool, risk or price authorization.
      security: [{ InternalHmac: [] }]
      parameters:
        - { name: planId, in: path, required: true, schema: { $ref: "#/components/schemas/BusinessId" } }
        - { $ref: "#/components/parameters/InternalKeyId" }
        - { $ref: "#/components/parameters/InternalTimestamp" }
        - { $ref: "#/components/parameters/InternalNonce" }
        - { $ref: "#/components/parameters/ContentSha256" }
        - { $ref: "#/components/parameters/InternalSignature" }
        - { $ref: "#/components/parameters/Traceparent" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowReplanRequest" } } } }
      responses:
        "200": { description: Replan disposition returned., content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowExecutionAccepted" } } } }
        "401": { $ref: "#/components/responses/InternalUnauthorized" }
        "409": { $ref: "#/components/responses/InternalConflict" }
        "422": { $ref: "#/components/responses/InternalValidationFailed" }
        "503": { $ref: "#/components/responses/InternalAuthenticationUnavailable" }
  /internal/v1/workflow-plans/{planId}/completion:
    post:
      operationId: completeWorkflowExecution
      summary: Report workflow completion, failure or a durable wait-for-user boundary.
      security: [{ InternalHmac: [] }]
      parameters:

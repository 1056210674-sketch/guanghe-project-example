      operationId: handleFeedback
      summary: Acknowledge, resolve or close a feedback item. Status only moves forward.
      description: |
        The reply is mandatory and is shown to the author, because there is no private-note channel.
        `reply` is what the author reads, so an empty one would move the ticket without answering it.
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/HandleFeedbackRequest" } } } }
      responses:

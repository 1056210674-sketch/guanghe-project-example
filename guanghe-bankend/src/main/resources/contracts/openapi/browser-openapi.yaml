      - { name: snapshotId, in: path, required: true, schema: { $ref: "#/components/schemas/BusinessId" } }
    get:
      operationId: getArticleSubmissionSnapshot
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Immutable snapshot returned., content: { application/json: { schema: { $ref: "#/components/schemas/ArticleSnapshotApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/media/resources:
    get:
      operationId: listMediaResources
      summary: Search synchronized media resources and their current user-facing prices.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: search, in: query, required: false, schema: { type: string, maxLength: 200 } }
        - { name: modelId, in: query, required: false, schema: { type: string, maxLength: 32, pattern: "^[A-Za-z0-9._:-]+$" } }
        - { name: type, in: query, required: false, schema: { type: string, maxLength: 64, pattern: "^[A-Za-z0-9._:-]+$" } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [ACTIVE, INACTIVE], default: ACTIVE } }
        - { name: minSaleAmountCents, in: query, required: false, schema: { type: integer, minimum: 0 } }
        - { name: maxSaleAmountCents, in: query, required: false, schema: { type: integer, minimum: 0 } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200": { description: Media resource page returned., content: { application/json: { schema: { $ref: "#/components/schemas/MediaResourcePageApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/media/resources/{resourceId}:
    parameters:
      - { name: resourceId, in: path, required: true, schema: { $ref: "#/components/schemas/BusinessId" } }
    get:
      operationId: getMediaResource
      summary: Get one synchronized media resource and its latest indicative user-facing price.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Media resource returned., content: { application/json: { schema: { $ref: "#/components/schemas/MediaResourceApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/media/recommendations:
    get:
      operationId: listArticleMediaRecommendations
      summary: Return deterministic ACTIVE media recommendations for a user-confirmed article body.
      description: >-
        Java ranks the bounded complete synchronized ACTIVE resource pool using the confirmed article version,
        product/category evidence and persisted submission preferences. It never invents authority, acceptance
        rate or delivery-time data. Prices and points are indicative; submission still uses snapshot -> quote ->
        confirm, where Java revalidates the authoritative price twice. Manual selection remains available.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: articleId, in: query, required: true, schema: { $ref: "#/components/schemas/BusinessId" } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 5, default: 5 } }
      responses:
        "200": { description: Recommendation set returned., content: { application/json: { schema: { $ref: "#/components/schemas/MediaRecommendationSetApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/media/quotes:
    post:
      operationId: createMediaQuote
      summary: Revalidate resources and create one Java-priced MEDIA confirmation draft.
      description: >-
        The article snapshot and selected resources are immutable inputs. Confirmation continues through
        /api/v1/task-drafts/{draftId}/confirm; the browser never supplies upstream prices or points.
        Image articles require enabled delivery, authorized immutable image assets and an explicit
        included, per-image or per-article fee rule. Missing or ambiguous image pricing is rejected;
        no image is silently removed. The article version, image manifest, supplier base price and
        image fee rule/amounts are frozen in the private quote snapshot and revalidated before final
        confirmation. User-safe per-media pricing is returned in parameters.items[].pricing.
        Articles containing external
        links are rejected for resources whose link policy does not explicitly allow links. These
        validation failures return 422 and neither reserve points nor submit to the provider.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateMediaQuoteRequest" } } }
      responses:
        "201": { description: MEDIA draft created or idempotently replayed., content: { application/json: { schema: { $ref: "#/components/schemas/TaskDraftApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/media/submissions:
    get:
      operationId: listMediaSubmissions
      summary: List the current USER's outbound media submission items newest first.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/MediaSubmissionStatus" }
        - name: taskId
          in: query
          required: false
          schema: { $ref: "#/components/schemas/BusinessId" }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200": { description: Media submission page returned., content: { application/json: { schema: { $ref: "#/components/schemas/MediaSubmissionPageApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/media/submissions/{submissionId}:
    parameters:
      - { name: submissionId, in: path, required: true, schema: { $ref: "#/components/schemas/BusinessId" } }
    get:
      operationId: getMediaSubmission
      summary: Get one owned submission, its safe status timeline, points and published links.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Media submission returned., content: { application/json: { schema: { $ref: "#/components/schemas/MediaSubmissionApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/tasks:
    get:
      operationId: listPaidTasks
      summary: List the current USER's tasks newest first with optional owned-resource filters.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: taskType
          in: query
          schema: { type: string, enum: [IMAGE, VIDEO, GEO, ARTICLE, MEDIA] }
        - name: status
          in: query
          schema: { type: string, enum: [QUEUED, RUNNING, RETRY_WAIT, SUCCEEDED, PARTIAL, FAILED, SKIPPED, SYSTEM_TERMINATED] }
        - name: conversationId
          in: query
          description: >-
            Restrict results to tasks durably linked to this owned conversation. When present,
            active tasks are returned before terminal history so a client can page until it has
            reconciled every active background task without scanning the whole conversation.
          schema: { $ref: "#/components/schemas/BusinessId" }
        - name: spaceId
          in: query
          schema: { $ref: "#/components/schemas/BusinessId" }
        - name: productId
          in: query
          schema: { $ref: "#/components/schemas/BusinessId" }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200": { description: Task page returned, content: { application/json: { schema: { $ref: "#/components/schemas/PaidTaskPageApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/tasks/{taskId}:
    parameters:
      - name: taskId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/BusinessId" }
    get:
      operationId: getPaidTask
      summary: Get one user-owned IMAGE, VIDEO, GEO, ARTICLE, or MEDIA task with safe progress and result data.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Task returned, content: { application/json: { schema: { $ref: "#/components/schemas/PaidTaskApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/tasks/{taskId}/events:
    parameters:
      - name: taskId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/BusinessId" }
    get:
      operationId: listPaidTaskEvents
      summary: Return the owned task's browser-safe event timeline in ascending conversation sequence.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Safe event timeline returned, content: { application/json: { schema: { $ref: "#/components/schemas/PaidTaskEventsApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/assets:
    get:
      operationId: listAssets
      summary: List the current USER's permanent assets.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - name: type
          in: query
          required: false
          schema: { type: string, enum: [IMAGE, VIDEO, ARTICLE, GEO_REPORT] }
        - name: spaceId
          in: query
          required: false
          schema: { $ref: "#/components/schemas/BusinessId" }
        - name: productId
          in: query
          required: false
          schema: { $ref: "#/components/schemas/BusinessId" }
        - name: sourceType
          in: query
          required: false
          schema: { type: string, enum: [GENERATED, UPLOADED, IMPORTED] }
      responses:
        "200": { description: Asset page returned., content: { application/json: { schema: { $ref: "#/components/schemas/AssetPageApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/assets/images:
    post:
      operationId: uploadImageAsset
      summary: Upload one owned PNG or JPEG reference image and persist it only after validation and safety approval.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [spaceId, file]
              properties:
                spaceId: { $ref: "#/components/schemas/BusinessId" }
                name: { type: string, minLength: 1, maxLength: 255 }
                file:
                  type: string
                  format: binary
                  description: PNG or JPEG, up to the server-configured image limit (20 MiB by default).
      responses:
        "201": { description: Validated READY image asset created or idempotently replayed., content: { application/json: { schema: { $ref: "#/components/schemas/UploadedImageAssetApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/assets/{assetId}:
    parameters:
      - name: assetId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/BusinessId" }
    get:
      operationId: getAsset
      summary: Get one permanent asset owned by the current USER.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Asset returned without an OSS object key or permanent public URL., content: { application/json: { schema: { $ref: "#/components/schemas/AssetApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/assets/{assetId}/download-url:
    parameters:
      - name: assetId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/BusinessId" }
    get:
      operationId: createAssetDownloadUrl
      summary: Sign a short-lived HTTPS GET URL for an authorized READY asset.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Short-lived download URL returned., content: { application/json: { schema: { $ref: "#/components/schemas/AssetDownloadUrlApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/billing/point-account:
    get:
      operationId: getPointAccount
      summary: Get the current user's authoritative available and frozen point balances.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Point account returned, content: { application/json: { schema: { $ref: "#/components/schemas/PointAccountApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/billing/point-ledger:
    get:
      operationId: listPointLedger
      summary: List the current user's point movements in reverse chronological order.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: ledgerId
          in: query
          description: Optional exact ledger entry for a notification deep link. Other users' entries return an empty page.
          schema: { $ref: "#/components/schemas/BusinessId" }
        - name: entryType
          in: query
          required: false
          schema:
            type: string
            enum: [TASK_FREEZE, TASK_SETTLE, TASK_RELEASE, WORKFLOW_FREEZE, WORKFLOW_ALLOCATE, WORKFLOW_TASK_SETTLE, WORKFLOW_TASK_RELEASE, WORKFLOW_SETTLE, WORKFLOW_RELEASE, ADMIN_INITIAL_GRANT, RECHARGE, ADMIN_ADJUSTMENT]
        - name: businessType
          in: query
          required: false
          schema: { type: string, enum: [TASK, WORKFLOW, ACCOUNT_PROVISIONING, RECHARGE, ADMIN_ADJUSTMENT] }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Size" }
      responses:
        "200": { description: Point ledger page returned., content: { application/json: { schema: { $ref: "#/components/schemas/PointLedgerPageApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/billing/recharge-capability:
    get:
      operationId: getRechargeCapability
      summary: Report whether recharge is available, and which prerequisite is missing when it is not.
      description: |
        The client renders this verbatim. A false `payable` is an unavailable capability — never a
        disabled button implying the feature is merely unfinished, and never an order presented as
        waiting for a payment that cannot happen.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Recharge capability returned., content: { application/json: { schema: { $ref: "#/components/schemas/RechargeCapabilityApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/billing/recharge-orders:
    get:
      operationId: listRechargeOrders
      summary: List the current account's recharge orders in reverse chronological order.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [CREATED, PAYING, SUCCEEDED, CLOSED, EXPIRED, FAILED]
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Size" }
      responses:
        "200": { description: Recharge order page returned., content: { application/json: { schema: { $ref: "#/components/schemas/RechargeOrderPageApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    post:
      operationId: createRechargeOrder
      summary: Create a recharge order, refusing outright unless the payment provider reports itself payable.
      description: |
        Fail closed: with no payable provider this refuses before any row is written, so a user can
        never be handed an order that could never become payable. The amount is the only input — the
        points granted and the rate are resolved server-side and snapshotted onto the order.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateRechargeOrderRequest" } } } }
      responses:
        "201": { description: Recharge order created and accepted by the provider., content: { application/json: { schema: { $ref: "#/components/schemas/RechargeOrderApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/billing/recharge-orders/{orderId}:
    parameters: [{ name: orderId, in: path, required: true, schema: { $ref: "#/components/schemas/BusinessId" } }]
    get:
      operationId: getRechargeOrder
      summary: Read one of the current account's recharge orders.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Recharge order returned., content: { application/json: { schema: { $ref: "#/components/schemas/RechargeOrderApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/billing/recharge-orders/{orderId}/query:
    parameters: [{ name: orderId, in: path, required: true, schema: { $ref: "#/components/schemas/BusinessId" } }]
    post:
      operationId: queryRechargeOrder
      summary: Poll the provider for the authoritative state and reconcile the order against it.
      description: |
        Never marks an order paid on its own: only a provider-confirmed settlement credits points. A
        provider amount that disagrees with the order is recorded for reconciliation and reported as
        a conflict rather than credited.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Order returned as the provider reports it., content: { application/json: { schema: { $ref: "#/components/schemas/RechargeOrderApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/billing/recharge-orders/{orderId}/close:
    parameters: [{ name: orderId, in: path, required: true, schema: { $ref: "#/components/schemas/BusinessId" } }]
    post:
      operationId: closeRechargeOrder
      summary: Close an unpaid recharge order so it can no longer be paid.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Recharge order closed., content: { application/json: { schema: { $ref: "#/components/schemas/RechargeOrderApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/billing/pricing/active:
    get:
      operationId: getActiveRateCard
      summary: Read the rate card currently in force for this payer.
      description: |
        `productionRate: false` means no version has been published and orders are priced by the
        deployment's placeholder rate. The client renders that flag instead of presenting a
        placeholder as an agreed price.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Active rate card returned., content: { application/json: { schema: { $ref: "#/components/schemas/RateCardApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/billing/invoice-capability:
    get:
      operationId: getInvoiceCapability
      summary: Report whether invoice applications are open and whether delivery is possible.
      description: |
        Deliberately ungated by the billing module switch, so the browser always receives an honest
        answer rather than an error it would have to interpret. `deliverable: false` is an
        unavailable capability: the client must not promise an issue date, and must not present a
        disabled control as a finished feature.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Invoice capability returned., content: { application/json: { schema: { $ref: "#/components/schemas/InvoiceCapabilityApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/billing/invoices:
    get:
      operationId: listInvoiceApplications
      summary: List the current account's own invoice applications.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Size" }
      responses:
        "200": { description: Invoice application page returned., content: { application/json: { schema: { $ref: "#/components/schemas/InvoiceApplicationPageApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    post:
      operationId: createInvoiceApplication
      summary: Submit an invoice application. Nothing is issued by this call.
      description: |
        Recording an application is not issuing an invoice. The response reports the application's
        own state, and `deliveredAt` stays null until an administrator confirms external manual
        email sending. Feishu acceptance is separately reported and never completes the invoice.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateInvoiceApplicationRequest" } } } }
      responses:
        "201": { description: Invoice application recorded., content: { application/json: { schema: { $ref: "#/components/schemas/InvoiceApplicationApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/billing/invoices/{applicationId}:
    parameters: [{ name: applicationId, in: path, required: true, schema: { $ref: "#/components/schemas/BusinessId" } }]
    get:
      operationId: getInvoiceApplication
      summary: Read one of the current account's own invoice applications.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Invoice application returned., content: { application/json: { schema: { $ref: "#/components/schemas/InvoiceApplicationApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/billing/invoices/{applicationId}/cancel:
    parameters: [{ name: applicationId, in: path, required: true, schema: { $ref: "#/components/schemas/BusinessId" } }]
    post:
      operationId: cancelInvoiceApplication
      summary: Withdraw an application no operator has decided on yet.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Invoice application cancelled., content: { application/json: { schema: { $ref: "#/components/schemas/InvoiceApplicationApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/billing/notification-capability:
    get:
      operationId: getNotificationCapability
      summary: Report whether in-app notifications and mail are available in this deployment.
      description: |
        Deliberately ungated by the billing module switch, so the browser always receives an honest
        answer rather than an error it would have to interpret.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Notification capability returned., content: { application/json: { schema: { $ref: "#/components/schemas/NotificationCapabilityApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/billing/notifications:
    get:
      operationId: listNotifications
      summary: List the current account's in-app notifications in reverse chronological order.
      description: In-app notifications remain available when billing is disabled. Filters apply before pagination and to the total count.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Size" }
        - name: category
          in: query
          description: Optional exact notification category; omit for all categories.
          schema: { type: string, enum: [RECHARGE, POINTS, INVOICE, FEEDBACK, SYSTEM] }
        - name: unreadOnly
          in: query
          description: Return only unread notifications when true. The unread badge is always account-wide.
          schema: { type: boolean, default: false }
      responses:
        "200": { description: Notification page returned., content: { application/json: { schema: { $ref: "#/components/schemas/NotificationPageApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/billing/notifications/unread-count:
    get:
      operationId: getUnreadNotificationCount
      summary: Read the unread badge count.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Unread count returned., content: { application/json: { schema: { $ref: "#/components/schemas/UnreadNotificationCountApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/billing/notifications/{notificationId}/read:
    parameters: [{ name: notificationId, in: path, required: true, schema: { $ref: "#/components/schemas/BusinessId" } }]
    post:
      operationId: markNotificationRead
      summary: Mark one notification read. Repeating the call is a no-op rather than an error.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Notification returned in its read state., content: { application/json: { schema: { $ref: "#/components/schemas/NotificationApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/billing/notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      summary: Mark every unread notification read and report the resulting unread count.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Unread count returned after the sweep., content: { application/json: { schema: { $ref: "#/components/schemas/UnreadNotificationCountApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/billing/feedback:
    get:
      operationId: listMyFeedback
      summary: List the current account's own feedback in reverse chronological order.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Size" }
      responses:
        "200": { description: Feedback page returned., content: { application/json: { schema: { $ref: "#/components/schemas/FeedbackPageApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    post:
      operationId: createFeedback
      summary: Submit a feedback item.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateFeedbackRequest" } } } }
      responses:
        "201": { description: Feedback recorded., content: { application/json: { schema: { $ref: "#/components/schemas/FeedbackApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/billing/feedback/{feedbackId}:
    parameters: [{ name: feedbackId, in: path, required: true, schema: { $ref: "#/components/schemas/BusinessId" } }]
    get:
      operationId: getMyFeedback
      summary: Read one of the current account's own feedback items.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Feedback returned., content: { application/json: { schema: { $ref: "#/components/schemas/FeedbackApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/admin/billing/recharge-orders:
    get:
      operationId: listAdminRechargeOrders
      summary: List recharge orders across all accounts for operator reconciliation.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: userId, in: query, required: false, schema: { $ref: "#/components/schemas/BusinessId" } }
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [CREATED, PAYING, SUCCEEDED, CLOSED, EXPIRED, FAILED]
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Size" }
      responses:
        "200": { description: Recharge order page returned., content: { application/json: { schema: { $ref: "#/components/schemas/RechargeOrderPageApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/admin/billing/recharge-orders/{orderId}:
    parameters: [{ name: orderId, in: path, required: true, schema: { $ref: "#/components/schemas/BusinessId" } }]
    get:
      operationId: getAdminRechargeOrder
      summary: Read any account's recharge order.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Recharge order returned., content: { application/json: { schema: { $ref: "#/components/schemas/RechargeOrderApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/admin/billing/recharge-orders/{orderId}/reconcile:
    parameters: [{ name: orderId, in: path, required: true, schema: { $ref: "#/components/schemas/BusinessId" } }]
    post:
      operationId: reconcileAdminRechargeOrder
      summary: Ask the provider for the authoritative state of an order under investigation.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Order returned as the provider reports it., content: { application/json: { schema: { $ref: "#/components/schemas/RechargeOrderApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/admin/billing/point-adjustments:
    get:
      operationId: listPointAdjustments
      summary: List operator point adjustments, including those still awaiting confirmation.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: userId, in: query, required: false, schema: { $ref: "#/components/schemas/BusinessId" } }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [PENDING_CONFIRMATION, APPLIED, CANCELLED] }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Size" }
      responses:
        "200": { description: Adjustment page returned., content: { application/json: { schema: { $ref: "#/components/schemas/PointAdjustmentPageApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    post:
      operationId: requestPointAdjustment
      summary: Request an operator point credit. Nothing is credited until the returned token is confirmed.
      description: |
        The response carries a single-use confirmation token exactly once; only its hash is stored, so
        the server cannot reproduce it. A replayed request returns the pending record without a token.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreatePointAdjustmentRequest" } } } }
      responses:
        "201": { description: Adjustment requested and awaiting confirmation., content: { application/json: { schema: { $ref: "#/components/schemas/PointAdjustmentApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/admin/billing/point-adjustments/{adjustmentId}/confirm:
    parameters: [{ name: adjustmentId, in: path, required: true, schema: { $ref: "#/components/schemas/BusinessId" } }]
    post:
      operationId: confirmPointAdjustment
      summary: Apply a previously requested point credit. This is the step that moves the balance.
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ConfirmPointAdjustmentRequest" } } } }
      responses:
        "200": { description: Adjustment applied and the ledger row written., content: { application/json: { schema: { $ref: "#/components/schemas/PointAdjustmentApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/admin/billing/audit-events:
    get:
      operationId: listOperationalAuditEvents
      summary: Read the append-only operational audit trail. Rows are never modified or deleted.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: actorType
          in: query
          required: false
          schema: { type: string, enum: [USER, ADMIN, SYSTEM, PAYMENT_PROVIDER, MAIL_PROVIDER] }
        - { name: targetType, in: query, required: false, schema: { type: string, maxLength: 64, pattern: "^[A-Z][A-Z0-9_]{0,63}$" } }
        - { name: targetId, in: query, required: false, schema: { $ref: "#/components/schemas/BusinessId" } }
        - { name: eventType, in: query, required: false, schema: { type: string, maxLength: 64, pattern: "^[A-Z][A-Z0-9_]{0,63}$" } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Size" }
      responses:
        "200": { description: Audit event page returned., content: { application/json: { schema: { $ref: "#/components/schemas/OperationalAuditEventPageApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/admin/billing/pricing-versions:
    get:
      operationId: listPricingVersions
      summary: List pricing versions, newest first, optionally filtered by lifecycle state.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [DRAFT, ACTIVE, RETIRED] }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Size" }
      responses:
        "200": { description: Pricing version page returned., content: { application/json: { schema: { $ref: "#/components/schemas/PricingVersionPageApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    post:
      operationId: createPricingVersion
      summary: Create a new DRAFT pricing version. Publishing is a separate, confirmed step.
      description: |
        A draft changes nothing for payers. Only publishing puts a rate in force, and publishing
        retires the version it replaces in the same transaction.
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreatePricingVersionRequest" } } } }
      responses:
        "201": { description: Draft created., content: { application/json: { schema: { $ref: "#/components/schemas/PricingVersionApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/admin/billing/pricing-versions/{versionId}:
    parameters: [{ name: versionId, in: path, required: true, schema: { $ref: "#/components/schemas/BusinessId" } }]
    get:
      operationId: getPricingVersion
      summary: Read one pricing version together with its tiers.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Pricing version returned., content: { application/json: { schema: { $ref: "#/components/schemas/PricingVersionApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updatePricingVersion
      summary: Replace a draft's rate, bounds and tiers. Refused once the version is published.
      description: |
        Carries the `expectedVersion` the client last read, so an edit made against a stale draft is
        refused instead of silently overwriting a colleague's change.
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UpdatePricingVersionRequest" } } } }
      responses:
        "200": { description: Draft updated., content: { application/json: { schema: { $ref: "#/components/schemas/PricingVersionApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/admin/billing/pricing-versions/{versionId}/publish:
    parameters: [{ name: versionId, in: path, required: true, schema: { $ref: "#/components/schemas/BusinessId" } }]
    post:
      operationId: publishPricingVersion
      summary: Publish a draft and retire the version it replaces, in one transaction.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Version published and its predecessor retired., content: { application/json: { schema: { $ref: "#/components/schemas/PricingVersionApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/admin/billing/pricing-versions/{versionId}/retire:
    parameters: [{ name: versionId, in: path, required: true, schema: { $ref: "#/components/schemas/BusinessId" } }]
    post:
      operationId: retirePricingVersion
      summary: Retire the active version, leaving the deployment on the placeholder rate.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Version retired., content: { application/json: { schema: { $ref: "#/components/schemas/PricingVersionApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/admin/billing/rate-limits:
    get:
      operationId: listRateLimits
      summary: List every commercial rate-limit rule, including the built-in defaults.
      description: |
        A rule that has never been configured is returned with `configured: false` and its effective
        default values, so the operator sees what is actually in force rather than an empty list.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Rate-limit rules returned., content: { application/json: { schema: { $ref: "#/components/schemas/RateLimitRuleListApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/admin/billing/rate-limits/{action}:
    parameters:
      - name: action
        in: path
        required: true
        schema: { type: string, pattern: "^[A-Z][A-Z0-9_]{0,47}$" }
    put:
      operationId: updateRateLimit
      summary: Create or update the rule for one action.
      description: |
        `expectedVersion: 0` means "there is no stored rule yet", so the first write creates it.
        Any other value must match the stored version, which makes two operators editing the same
        rule a conflict rather than a silent overwrite.
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UpdateRateLimitRequest" } } } }
      responses:
        "200": { description: Rule stored and returned as it now stands., content: { application/json: { schema: { $ref: "#/components/schemas/RateLimitRuleApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/admin/billing/invoices:
    get:
      operationId: listAdminInvoiceApplications
      summary: List invoice applications across all accounts for operator review.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: userId, in: query, required: false, schema: { $ref: "#/components/schemas/BusinessId" } }
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [SUBMITTED, UNDER_REVIEW, APPROVED, DELIVERED, REJECTED, CANCELLED]
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Size" }
      responses:
        "200": { description: Invoice application page returned., content: { application/json: { schema: { $ref: "#/components/schemas/InvoiceApplicationPageApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/admin/billing/invoices/{applicationId}:
    parameters: [{ name: applicationId, in: path, required: true, schema: { $ref: "#/components/schemas/BusinessId" } }]
    get:
      operationId: getAdminInvoiceApplication
      summary: Read any account's invoice application for operator review.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Invoice application returned., content: { application/json: { schema: { $ref: "#/components/schemas/InvoiceApplicationApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/admin/billing/invoices/{applicationId}/accept:
    parameters: [{ name: applicationId, in: path, required: true, schema: { $ref: "#/components/schemas/BusinessId" } }]
    post:
      operationId: acceptInvoiceApplication
      summary: Take a submitted application into review.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Application moved into review., content: { application/json: { schema: { $ref: "#/components/schemas/InvoiceApplicationApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/admin/billing/invoices/{applicationId}/approve:
    parameters: [{ name: applicationId, in: path, required: true, schema: { $ref: "#/components/schemas/BusinessId" } }]
    post:
      operationId: approveInvoiceApplication
      summary: Record that internal review passed. Does not mean the invoice was issued.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Application approved for delivery., content: { application/json: { schema: { $ref: "#/components/schemas/InvoiceApplicationApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/admin/billing/invoices/{applicationId}/reject:
    parameters: [{ name: applicationId, in: path, required: true, schema: { $ref: "#/components/schemas/BusinessId" } }]
    post:
      operationId: rejectInvoiceApplication
      summary: Refuse a submitted or under-review application, with a mandatory reason.
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RejectInvoiceApplicationRequest" } } } }
      responses:
        "200": { description: Application rejected and the reason recorded for its author., content: { application/json: { schema: { $ref: "#/components/schemas/InvoiceApplicationApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/admin/billing/invoices/{applicationId}/deliver:
    parameters: [{ name: applicationId, in: path, required: true, schema: { $ref: "#/components/schemas/BusinessId" } }]
    post:
      operationId: deliverInvoiceApplication
      summary: Record that an administrator issued and manually emailed the invoice.
      description: |
        The administrator performs the mail send outside this system, then enters the invoice number
        as an explicit attestation. This endpoint does not send mail. DELIVERED records the operator's
        confirmation, not proof that the recipient opened or received the message.
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ConfirmManualInvoiceDeliveryRequest" } } } }
      responses:
        "200": { description: Manual email confirmation recorded., content: { application/json: { schema: { $ref: "#/components/schemas/InvoiceApplicationApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/admin/billing/invoices/{applicationId}/webhook/retry:
    parameters: [{ name: applicationId, in: path, required: true, schema: { $ref: "#/components/schemas/BusinessId" } }]
    post:
      operationId: retryInvoiceWebhook
      summary: Make a pending Feishu intake notification immediately eligible for retry.
      description: Does not mark the webhook sent or change the invoice lifecycle.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Retry queued., content: { application/json: { schema: { $ref: "#/components/schemas/InvoiceApplicationApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/admin/billing/feedback:
    get:
      operationId: listAdminFeedback
      summary: List feedback across all accounts as an operator queue.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: userId, in: query, required: false, schema: { $ref: "#/components/schemas/BusinessId" } }

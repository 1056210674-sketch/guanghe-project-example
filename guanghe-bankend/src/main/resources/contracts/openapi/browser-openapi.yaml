        title: { type: string, minLength: 1 }
        businessType: { type: string, enum: [TASK, WORKFLOW, ACCOUNT_PROVISIONING, RECHARGE, ADMIN_ADJUSTMENT] }
        businessId: { $ref: "#/components/schemas/BusinessId" }
        amountPoints: { type: integer, minimum: 0 }
        availableDelta: { type: integer }
        frozenDelta: { type: integer }
        availableAfter: { type: integer, minimum: 0 }
        frozenAfter: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
    PointLedgerPage:
      type: object
      additionalProperties: false
      required: [items, page, size, total, hasNext]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PointLedgerEntry" }
        page: { type: integer, minimum: 1 }
        size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }
        hasNext: { type: boolean }
    RechargeCapability:
      type: object
      additionalProperties: false
      required: [provider, configured, payable, callbackVerifiable, status, missingRequirements, minRechargeAmountCents, maxRechargeAmountCents, pointsPerYuan, rechargeOrderTtlSeconds, currency]
      properties:
        provider: { type: string, pattern: "^[A-Z][A-Z0-9_]{0,31}$" }
        configured: { type: boolean }
        payable: { type: boolean }
        callbackVerifiable: { type: boolean }
        status:
          type: string
          description: Machine-readable readiness. Rendered verbatim by the client.
          enum: [PAYMENT_PROVIDER_NOT_CONFIGURED, PAYMENT_PROVIDER_NOT_IMPLEMENTED, PAYMENT_PROVIDER_READY]
        missingRequirements:
          type: array
          description: Names of absent prerequisites. Never values, never secret material.
          items: { type: string, maxLength: 64 }
        minRechargeAmountCents: { type: integer, format: int64, minimum: 1 }
        maxRechargeAmountCents: { type: integer, format: int64, minimum: 1 }
        pointsPerYuan: { type: integer, minimum: 1 }
        rechargeOrderTtlSeconds: { type: integer, format: int64, minimum: 60 }
        currency: { type: string, const: CNY }
    RechargeOrder:
      type: object
      additionalProperties: false
      required: [id, orderNo, status, provider, amountCents, points, providerOrderNo, codeUrl, returnContext, expiresAt, paidAt, closedAt, failedAt, failureCode, createdAt, updatedAt]
      properties:
        id: { $ref: "#/components/schemas/BusinessId" }
        orderNo: { type: string, pattern: "^R[1-9][0-9]{0,18}$" }
        status: { type: string, enum: [CREATED, PAYING, SUCCEEDED, CLOSED, EXPIRED, FAILED] }
        provider: { type: string, pattern: "^[A-Z][A-Z0-9_]{0,31}$" }
        amountCents: { type: integer, format: int64, minimum: 1 }
        points:
          type: integer
          minimum: 1
          description: Snapshot of the points this order promises, fixed at creation.
        providerOrderNo: { type: [string, "null"], maxLength: 64 }
        codeUrl:
          type: [string, "null"]
          maxLength: 512
          description: Only ever set from a real provider response. Never synthesised locally.
        returnContext:
          type: [string, "null"]
          maxLength: 200
          description: Opaque caller-supplied context, e.g. TASK_DRAFT:123, returned unmodified.
        expiresAt: { type: string, format: date-time }
        paidAt: { type: [string, "null"], format: date-time }
        closedAt: { type: [string, "null"], format: date-time }
        failedAt: { type: [string, "null"], format: date-time }
        failureCode: { type: [string, "null"], maxLength: 64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RechargeOrderPage:
      type: object
      additionalProperties: false
      required: [items, page, size, total, hasNext]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RechargeOrder" }
        page: { type: integer, minimum: 1 }
        size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }
        hasNext: { type: boolean }
    CreateRechargeOrderRequest:
      type: object
      additionalProperties: false
      required: [amountCents]
      description: |
        Deliberately carries no user id, no point count and no price: the amount is the only input,
        and the points and rate are resolved server-side.
      properties:
        amountCents: { type: integer, format: int64, minimum: 1 }
        returnContext:
          type: [string, "null"]
          maxLength: 200
          pattern: "^(TASK_DRAFT|WORKFLOW_PLAN|ARTICLE|GEO_PLAN):[1-9][0-9]{0,18}$"
    PointAdjustment:
      type: object
      additionalProperties: false
      required: [id, userId, points, direction, reason, status, operatorId, confirmationToken, confirmationExpiresAt, ledgerId, appliedAt, createdAt]
      properties:
        id: { $ref: "#/components/schemas/BusinessId" }
        userId: { $ref: "#/components/schemas/BusinessId" }
        points: { type: integer, minimum: 1 }
        direction: { type: string, const: CREDIT }
        reason: { type: string, maxLength: 500 }
        status: { type: string, enum: [PENDING_CONFIRMATION, APPLIED, CANCELLED] }
        operatorId:
          type: string
          pattern: "^[1-9][0-9]{0,18}$"
          description: Who performed the operation. Not a business-type discriminator.
        confirmationToken:
          type: [string, "null"]
          pattern: "^[A-Za-z0-9_-]{43}$"
          description: |
            Returned exactly once, on creation. Only its hash is stored, so neither a replay nor the
            server itself can reproduce it.
        confirmationExpiresAt: { type: string, format: date-time }
        ledgerId: { type: [string, "null"], maxLength: 19 }
        appliedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    PointAdjustmentPage:
      type: object
      additionalProperties: false
      required: [items, page, size, total, hasNext]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PointAdjustment" }
        page: { type: integer, minimum: 1 }
        size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }
        hasNext: { type: boolean }
    CreatePointAdjustmentRequest:
      type: object
      additionalProperties: false
      required: [userId, points, reason]
      properties:
        userId: { $ref: "#/components/schemas/BusinessId" }
        points: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 500 }
    ConfirmPointAdjustmentRequest:
      type: object
      additionalProperties: false
      required: [confirmationToken]
      properties:
        confirmationToken: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
    OperationalAuditEvent:
      type: object
      additionalProperties: false
      required: [id, actorType, actorUserId, actorRef, targetType, targetId, eventType, outcome, traceId, details, createdAt]
      description: |
        One append-only operational audit row, separate from account security audit. Readable but
        never modifiable or deletable through this API. Details are bounded summaries, hashes and
        state changes only — never secrets, tokens, raw callback bodies or prompts.
      properties:
        id: { $ref: "#/components/schemas/BusinessId" }
        actorType: { type: string, enum: [USER, ADMIN, SYSTEM, PAYMENT_PROVIDER, MAIL_PROVIDER] }
        actorUserId: { type: [string, "null"], maxLength: 19 }
        actorRef:
          type: [string, "null"]
          maxLength: 64
          description: Non-sensitive reference for a non-user actor. Null for user and admin actors.
        targetType: { type: string, pattern: "^[A-Z][A-Z0-9_]{0,63}$" }
        targetId: { type: [string, "null"], maxLength: 19 }
        eventType: { type: string, pattern: "^[A-Z][A-Z0-9_]{0,63}$" }
        outcome: { type: string, enum: [SUCCESS, FAILURE, PENDING] }
        traceId: { type: string, maxLength: 64 }
        details:
          type: string
          maxLength: 16384
          description: Bounded JSON object. Never contains credentials, tokens or a raw payload.
        createdAt: { type: string, format: date-time }
    OperationalAuditEventPage:
      type: object
      additionalProperties: false
      required: [items, page, size, total, hasNext]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/OperationalAuditEvent" }
        page: { type: integer, minimum: 1 }
        size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }
        hasNext: { type: boolean }
    PaymentCallbackAck:
      type: object
      additionalProperties: false
      required: [code, message]
      description: Provider-vocabulary acknowledgement. Not this service's ApiResponse envelope.
      properties:
        code: { type: string, const: SUCCESS }
        message: { type: string }
    PaymentCallbackFailure:
      type: object
      additionalProperties: false
      required: [code, message]
      description: |
        Provider-vocabulary refusal. The message is a stable error code, never a payload excerpt:
        an unauthenticated body is never echoed back or logged.
      properties:
        code: { type: string, const: FAIL }
        message: { type: string, maxLength: 64 }
    RechargeCapabilityApiResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties: { data: { $ref: "#/components/schemas/RechargeCapability" } }
    RechargeOrderApiResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties: { data: { $ref: "#/components/schemas/RechargeOrder" } }
    RechargeOrderPageApiResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties: { data: { $ref: "#/components/schemas/RechargeOrderPage" } }
    PointAdjustmentApiResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties: { data: { $ref: "#/components/schemas/PointAdjustment" } }
    PointAdjustmentPageApiResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties: { data: { $ref: "#/components/schemas/PointAdjustmentPage" } }
    OperationalAuditEventPageApiResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties: { data: { $ref: "#/components/schemas/OperationalAuditEventPage" } }
    RechargeTier:
      type: object
      additionalProperties: false
      required: [tierId, amountCents, basePoints, giftPoints, points, label, sortOrder]
      description: |
        One rung of a rate card. `points` is what a single ledger entry credits; the base/gift split
        is display only, so rendering `points` alone is still accurate.
      properties:
        tierId:
          type: string
          pattern: "^TIER-[1-9][0-9]{0,18}$"
          description: Derived from the amount rather than allocated, so it is not a business id.
        amountCents:
          type: integer
          format: int64
          minimum: 100
          multipleOf: 100
          description: Whole yuan, because the rate prices whole yuan.
        basePoints: { type: integer, minimum: 1 }
        giftPoints: { type: integer, minimum: 0 }
        points:
          type: integer
          minimum: 1
          description: basePoints + giftPoints, credited as one ledger entry.
        label: { type: string, minLength: 1, maxLength: 64 }
        sortOrder: { type: integer, minimum: 0 }
    RateCard:
      type: object
      additionalProperties: false
      required: [productionRate, versionId, versionNo, pointsPerYuan, minRechargeAmountCents,
                 maxRechargeAmountCents, note, publishedAt, tiers, currency]
      description: |
        The rate a payer is quoted from. `productionRate: false` is the placeholder — no version has
        been published, `versionId` is null and `tiers` is empty. The client renders that flag
        instead of presenting the placeholder as an agreed price.
      properties:
        productionRate: { type: boolean }
        versionId: { type: [string, "null"], maxLength: 19 }
        versionNo: { type: [integer, "null"], minimum: 1 }
        pointsPerYuan: { type: integer, minimum: 1 }
        minRechargeAmountCents: { type: integer, format: int64, minimum: 100, multipleOf: 100 }
        maxRechargeAmountCents: { type: integer, format: int64, minimum: 100, multipleOf: 100 }
        note: { type: [string, "null"], maxLength: 500 }
        publishedAt: { type: [string, "null"], format: date-time }
        tiers:
          type: array
          items: { $ref: "#/components/schemas/RechargeTier" }
        currency: { type: string, const: CNY }
    PricingVersion:
      type: object
      additionalProperties: false
      required: [id, versionNo, status, pointsPerYuan, minRechargeAmountCents,
                 maxRechargeAmountCents, note, createdBy, publishedBy, publishedAt, retiredAt,
                 tiers, createdAt, updatedAt]
      description: |
        A rate card in one of three lifecycle states. A published version is immutable, because
        orders cite it and editing it afterwards would silently re-price settled decisions.
      properties:
        id: { $ref: "#/components/schemas/BusinessId" }
        versionNo: { type: integer, minimum: 1 }
        status: { type: string, enum: [DRAFT, ACTIVE, RETIRED] }
        pointsPerYuan: { type: integer, minimum: 1 }
        minRechargeAmountCents:
          type: integer
          format: int64
          minimum: 100
          multipleOf: 100
          description: Whole yuan, because the rate prices whole yuan.
        maxRechargeAmountCents:
          type: integer
          format: int64
          minimum: 100
          multipleOf: 100
          description: Whole yuan, and never below the minimum.
        note: { type: [string, "null"], maxLength: 500 }
        createdBy: { $ref: "#/components/schemas/BusinessId" }
        publishedBy: { type: [string, "null"], maxLength: 19 }
        publishedAt: { type: [string, "null"], format: date-time }
        retiredAt: { type: [string, "null"], format: date-time }
        tiers:
          type: array
          description: Refused at publish time if empty, because the payer page could not render it.
          items: { $ref: "#/components/schemas/RechargeTier" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PricingVersionPage:
      type: object
      additionalProperties: false
      required: [items, page, size, total, hasNext]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PricingVersion" }
        page: { type: integer, minimum: 1 }
        size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }
        hasNext: { type: boolean }
    PricingTierRequest:
      type: object
      additionalProperties: false
      required: [amountCents, label]
      properties:
        amountCents:
          type: integer
          format: int64
          minimum: 100
          multipleOf: 100
          description: |
            Whole yuan, inside the version's bounds, and unique within the version: the gift is
            looked up by exact amount, so a duplicate would make "the gift for this amount" ambiguous.
        giftPoints: { type: [integer, "null"], minimum: 0 }
        label: { type: string, minLength: 1, maxLength: 64 }
        sortOrder:
          type: [integer, "null"]
          minimum: 0
          description: Defaults to the tier's position in the submitted list.
    CreatePricingVersionRequest:
      type: object
      additionalProperties: false
      required: [pointsPerYuan, minRechargeAmountCents, maxRechargeAmountCents, tiers]
      description: Creates a DRAFT. Nothing a payer sees changes until it is published.
      properties:
        pointsPerYuan: { type: integer, minimum: 1 }
        minRechargeAmountCents: { type: integer, format: int64, minimum: 100, multipleOf: 100 }
        maxRechargeAmountCents:
          type: integer
          format: int64
          minimum: 100
          multipleOf: 100
          description: Must be at least the minimum and a whole number of yuan.
        note: { type: [string, "null"], maxLength: 500 }
        tiers:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/PricingTierRequest" }
    UpdatePricingVersionRequest:
      type: object
      additionalProperties: false
      required: [pointsPerYuan, minRechargeAmountCents, maxRechargeAmountCents, tiers,
                 expectedVersion]
      description: Replaces a draft wholesale. Refused once the version is published.
      properties:
        pointsPerYuan: { type: integer, minimum: 1 }
        minRechargeAmountCents: { type: integer, format: int64, minimum: 100, multipleOf: 100 }
        maxRechargeAmountCents: { type: integer, format: int64, minimum: 100, multipleOf: 100 }
        note: { type: [string, "null"], maxLength: 500 }
        tiers:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/PricingTierRequest" }
        expectedVersion:
          type: integer
          minimum: 1
          description: The optimistic version last read, so a stale edit is refused rather than applied.
    RateLimitRule:
      type: object
      additionalProperties: false
      required: [id, action, windowSeconds, maxAttempts, enabled, configured, version, updatedBy,
                 updatedAt]
      description: |
        One throttle as it applies right now. A rule that was never configured is still returned,
        with `configured: false` and its effective default values, so the operator sees what is in
        force rather than an empty list.
      properties:
        id:
          type: [string, "null"]
          maxLength: 19
          description: Null while the built-in default is in force.
        action: { type: string, enum: [RECHARGE_ORDER_CREATE, INVOICE_APPLICATION_SUBMIT, FEEDBACK_SUBMIT] }
        windowSeconds: { type: integer, minimum: 1, maximum: 86400 }
        maxAttempts: { type: integer, minimum: 1, maximum: 100000 }
        enabled:
          type: boolean
          description: A disabled rule counts nothing and refuses nothing.
        configured:
          type: boolean
          description: False when no operator has stored a rule and the built-in default applies.
        version:
          type: integer
          minimum: 0
          description: 0 for the built-in default; otherwise the stored optimistic version.
        updatedBy: { type: [string, "null"], maxLength: 19 }
        updatedAt: { type: [string, "null"], format: date-time }
    UpdateRateLimitRequest:
      type: object
      additionalProperties: false
      required: [windowSeconds, maxAttempts, enabled, expectedVersion]
      properties:
        windowSeconds: { type: integer, minimum: 1, maximum: 86400 }
        maxAttempts: { type: integer, minimum: 1, maximum: 100000 }
        enabled: { type: boolean }
        expectedVersion:
          type: integer
          minimum: 0
          description: 0 to create the rule for the first time; otherwise the version last read.
    InvoiceApplication:
      type: object
      additionalProperties: false
      required: [id, applicationNo, status, invoiceType, titleType, title, taxNumber, amountCents,
                 deliveryEmail, remark, rejectReason, deliveryProvider, invoiceNumber, manualSentBy,
                 webhookStatus, webhookErrorCode, submittedAt, reviewedAt,
                 approvedAt, deliveredAt, rejectedAt, cancelledAt, createdAt, updatedAt]
      description: |
        One invoice application and its own state. `approvedAt` means internal review passed and is
        not an issue date. `deliveredAt` records an administrator's confirmation that the issued
        invoice was manually emailed to the application address. It is not proof of inbox receipt.
        The Feishu webhook state is independent and never moves the invoice to DELIVERED.
      properties:
        id: { $ref: "#/components/schemas/BusinessId" }
        applicationNo: { type: string, maxLength: 40, pattern: "^I[1-9][0-9]{0,18}$" }
        status:
          type: string
          enum: [SUBMITTED, UNDER_REVIEW, APPROVED, DELIVERED, REJECTED, CANCELLED]
        invoiceType: { type: string, enum: [VAT_NORMAL, VAT_SPECIAL] }
        titleType: { type: string, enum: [PERSONAL, COMPANY] }
        title: { type: string, minLength: 1, maxLength: 200 }
        taxNumber: { type: [string, "null"], maxLength: 64 }
        amountCents:
          type: integer
          format: int64
          minimum: 1
          description: The amount the applicant stated. No order is attached to an application.
        deliveryEmail: { type: string, minLength: 1, maxLength: 255 }
        remark: { type: [string, "null"], maxLength: 500 }
        rejectReason: { type: [string, "null"], maxLength: 500 }
        deliveryProvider: { type: [string, "null"], maxLength: 32 }
        invoiceNumber: { type: [string, "null"], maxLength: 64 }
        manualSentBy: { type: [string, "null"], maxLength: 19 }
        webhookStatus: { type: string, enum: [PENDING, WAITING_CONFIG, WAITING_MANUAL, SENT, SKIPPED] }
        webhookErrorCode: { type: [string, "null"], maxLength: 64 }
        submittedAt: { type: string, format: date-time }
        reviewedAt: { type: [string, "null"], format: date-time }
        approvedAt:
          type: [string, "null"]
          format: date-time
          description: Internal review passed. Not an issue date, and never presented as one.
        deliveredAt:
          type: [string, "null"]
          format: date-time
          description: |
            Time when an administrator confirmed manual email sending. No recipient receipt is known.
        rejectedAt: { type: [string, "null"], format: date-time }
        cancelledAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    InvoiceApplicationPage:
      type: object
      additionalProperties: false
      required: [items, page, size, total, hasNext]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/InvoiceApplication" }
        page: { type: integer, minimum: 1 }
        size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }
        hasNext: { type: boolean }
    CreateInvoiceApplicationRequest:
      type: object
      additionalProperties: false
      required: [invoiceType, titleType, title, amountCents, deliveryEmail]
      properties:
        invoiceType: { type: string, enum: [VAT_NORMAL, VAT_SPECIAL] }
        titleType: { type: string, enum: [PERSONAL, COMPANY] }
        title: { type: string, minLength: 1, maxLength: 200 }
        taxNumber:
          type: [string, "null"]
          maxLength: 64
          pattern: "^[0-9A-Z]{15,20}$"
          description: Required for a company title and refused for a personal one.
        amountCents:
          type: integer
          format: int64
          minimum: 1
          description: The amount the applicant states. No order is attached, so this is not derived.
        deliveryEmail:
          type: string
          minLength: 3
          maxLength: 255
          pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
        remark: { type: [string, "null"], maxLength: 500 }
    RejectInvoiceApplicationRequest:
      type: object
      additionalProperties: false
      required: [reason]
      description: The reason is mandatory, because it is what the applicant will read.
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
    ConfirmManualInvoiceDeliveryRequest:
      type: object
      additionalProperties: false
      required: [invoiceNumber]
      properties:
        invoiceNumber: { type: string, minLength: 1, maxLength: 64 }
    InvoiceCapability:
      type: object
      additionalProperties: false
      required: [applicationsOpen, applicationsStatus, deliveryProvider, deliveryConfigured,
                 deliverable, deliveryStatus, deliveryMissing, webhookConfigured, webhookStatus,
                 currency]
      description: |
        The invoice is issued and emailed manually after review. Feishu routes submitted details to
        operators independently; a webhook success never means the invoice was mailed.
      properties:
        applicationsOpen: { type: boolean }
        applicationsStatus: { type: string, enum: [INVOICE_APPLICATIONS_OPEN, INVOICE_MODULE_DISABLED] }
        deliveryProvider: { type: string, pattern: "^[A-Z][A-Z0-9_]{0,31}$" }
        deliveryConfigured: { type: boolean }
        deliverable: { type: boolean }
        deliveryStatus:
          type: string
          description: Manual email attestation is the only completion route.
          enum: [INVOICE_MANUAL_EMAIL]
        deliveryMissing:
          type: array
          description: Names of absent prerequisites. Never values, never secret material.
          items: { type: string, maxLength: 64 }
        webhookConfigured: { type: boolean }
        webhookStatus: { type: string, enum: [INVOICE_WEBHOOK_READY, INVOICE_WEBHOOK_NOT_CONFIGURED] }
        currency: { type: string, const: CNY }
    Notification:
      type: object
      additionalProperties: false
      required: [id, category, title, body, targetType, targetId, read, readAt, createdAt]
      description: One in-app notification. Created inside the transaction of the event it announces.
      properties:
        id: { $ref: "#/components/schemas/BusinessId" }
        category: { type: string, enum: [RECHARGE, POINTS, INVOICE, FEEDBACK, SYSTEM] }
        title: { type: string, minLength: 1, maxLength: 120 }
        body: { type: string, minLength: 1, maxLength: 1000 }
        targetType:
          type: [string, "null"]
          maxLength: 32
          pattern: "^[A-Z][A-Z0-9_]{0,31}$"
          description: A resource kind, never a URL. The client builds the route from it.
        targetId: { type: [string, "null"], maxLength: 19 }
        read: { type: boolean }
        readAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    NotificationPage:
      type: object
      additionalProperties: false
      required: [items, page, size, total, hasNext]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Notification" }
        page: { type: integer, minimum: 1 }
        size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }
        hasNext: { type: boolean }
    UnreadNotificationCount:
      type: object
      additionalProperties: false
      required: [unread]
      properties:
        unread: { type: integer, format: int64, minimum: 0 }
    NotificationCapability:
      type: object
      additionalProperties: false
      required: [inApp, inAppStatus, mailProvider, mailConfigured, mailStatus, mailMissing]
      description: |
        Whether the in-app inbox and mail are available in this deployment. Rendered verbatim,
        because a false capability is not the same thing as a disabled control.
      properties:
        inApp: { type: boolean }
        inAppStatus: { type: string, enum: [NOTIFICATION_IN_APP_AVAILABLE, NOTIFICATION_MODULE_DISABLED] }
        mailProvider: { type: string, pattern: "^[A-Z][A-Z0-9_]{0,31}$" }
        mailConfigured: { type: boolean }
        mailStatus:
          type: string
          enum: [MAIL_DELIVERY_READY, MAIL_DELIVERY_NOT_CONFIGURED, MAIL_DELIVERY_NOT_IMPLEMENTED]
        mailMissing:
          type: array
          description: Names of absent prerequisites. Never values, never secret material.
          items: { type: string, maxLength: 64 }
    Feedback:
      type: object
      additionalProperties: false
      required: [id, category, content, contact, status, reply, handledAt, createdAt, updatedAt]
      description: |
        `reply` is null until an operator has answered. The client shows that as unanswered rather
        than as "in progress", because there is no private-note channel: the reply is what the
        author reads.
      properties:
        id: { $ref: "#/components/schemas/BusinessId" }
        category: { type: string, enum: [PRODUCT, BILLING, BUG, CONTENT, OTHER] }
        content: { type: string, minLength: 1, maxLength: 2000 }
        contact: { type: [string, "null"], maxLength: 128 }
        status: { type: string, enum: [SUBMITTED, ACKNOWLEDGED, RESOLVED, CLOSED] }
        reply: { type: [string, "null"], maxLength: 2000 }
        handledAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    FeedbackPage:
      type: object
      additionalProperties: false
      required: [items, page, size, total, hasNext]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Feedback" }
        page: { type: integer, minimum: 1 }
        size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }
        hasNext: { type: boolean }
    CreateFeedbackRequest:
      type: object
      additionalProperties: false
      required: [category, content]
      properties:
        category: { type: string, enum: [PRODUCT, BILLING, BUG, CONTENT, OTHER] }
        content: { type: string, minLength: 1, maxLength: 2000 }
        contact: { type: [string, "null"], maxLength: 128 }
    HandleFeedbackRequest:
      type: object
      additionalProperties: false
      required: [status, reply]
      description: The reply is mandatory whenever the status moves off SUBMITTED.
      properties:
        status: { type: string, enum: [ACKNOWLEDGED, RESOLVED, CLOSED] }
        reply: { type: string, minLength: 1, maxLength: 2000 }
    AdminPointLedgerEntry:
      type: object
      additionalProperties: false
      required: [id, userId, availableDelta, frozenDelta, availableAfter, frozenAfter, entryType,
                 businessType, businessId, operatorId, reason, createdAt]

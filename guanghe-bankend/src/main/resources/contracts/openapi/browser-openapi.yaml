  /api/v1/admin/media/submissions:
    get:
      operationId: listAdminMediaSubmissions
      summary: List media submissions across every account, including upstream order identifiers.
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/MediaSubmissionStatus" }
          description: One exact local status. Mutually exclusive with group.
        - name: group
          in: query
          required: false
          schema: { type: string, enum: [PENDING, EXCEPTION] }
          description: |
            PENDING covers submissions still moving (QUEUED, SUBMITTING, ACCEPTED, RECONCILING);
            EXCEPTION covers the ones that need a human (SUBMIT_UNKNOWN, FAILED). Sending status and
            group together is rejected rather than silently resolved, because the two filters can
            disagree and guessing which one the operator meant would hide submissions.
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      security: [{ bearerAuth: [] }]
      responses:

      required: ["items","page","size","total","hasNext"]
      properties: {"items":{"type":"array","maxItems":100,"items":{"$ref":"#/components/schemas/GeoCompetitorCandidate"}},"page":{"type":"integer","minimum":1},"size":{"type":"integer","minimum":1,"maximum":100},"total":{"type":"integer","minimum":0},"hasNext":{"type":"boolean"}}
    GeoCompetitorConfirmRequest:
      type: "object"
      additionalProperties: false
      required: ["version","topicVersion","type","addToTopic"]
      properties: {"version":{"type":"integer","minimum":1},"topicVersion":{"type":"integer","minimum":1},"existingCompetitorId":{"type":["string","null"],"pattern":"^[1-9][0-9]{0,18}$"},"type":{"type":"string","enum":["DIRECT","INDIRECT","SUBSTITUTE"]},"addToTopic":{"type":"boolean"}}
    GeoCompetitorIgnoreRequest:
      type: "object"
      additionalProperties: false
      required: ["version"]
      properties: {"version":{"type":"integer","minimum":1}}
    GeoCompetitorConfirmation:

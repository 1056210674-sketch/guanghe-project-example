      properties: {"candidateId":{"type":["string","null"]},"competitorId":{"type":["string","null"]},"name":{"type":"string"},"entityKind":{"type":"string","enum":["BRAND","PRODUCT","UNKNOWN"]},"role":{"type":"string","enum":["OWN","CONFIGURED","DISCOVERED"]},"recognitionStatus":{"type":["string","null"],"enum":["PENDING","CONFIRMED","IGNORED",null]},"mentionedUnits":{"type":["integer","null"],"minimum":0},"mentionRate":{"type":["number","null"],"minimum":0,"maximum":100},"evidence":{"type":"array","maxItems":2,"items":{"$ref":"#/components/schemas/GeoCompetitiveEvidence"}}}
    GeoCompetitivePlatform:
      type: "object"
      additionalProperties: false
      required: ["platformCode","expectedUnits","validUnits","failedUnits","missingUnits","entities"]
      properties: {"platformCode":{"type":"string"},"expectedUnits":{"type":"integer","minimum":0},"validUnits":{"type":"integer","minimum":0},"failedUnits":{"type":"integer","minimum":0},"missingUnits":{"type":"integer","minimum":0},"entities":{"type":"array","maxItems":27,"items":{"$ref":"#/components/schemas/GeoCompetitiveEntity"}}}
    GeoCompetitiveInsights:
      type: "object"
      additionalProperties: false
      required: ["reportId","topicId","status","retryAllowed","attempts","maxAttempts","reasonCode","questionScope","methodVersion","evidenceTruncated","platforms","candidates"]
      properties: {"reportId":{"$ref":"#/components/schemas/BusinessId"},"topicId":{"$ref":"#/components/schemas/BusinessId"},"status":{"type":"string","enum":["NOT_ANALYZED","QUEUED","RUNNING","SUCCEEDED","FAILED"]},"retryAllowed":{"type":"boolean"},"attempts":{"type":"integer","minimum":0},"maxAttempts":{"type":"integer","const":2},"reasonCode":{"type":["string","null"]},"questionScope":{"type":"string","enum":["DISCOVERY","BRAND_VALIDATION"]},"methodVersion":{"type":"string","const":"geo-competitive-insight-v2"},"evidenceTruncated":{"type":"boolean"},"platforms":{"type":"array","maxItems":7,"items":{"$ref":"#/components/schemas/GeoCompetitivePlatform"}},"candidates":{"type":"array","maxItems":6,"items":{"$ref":"#/components/schemas/GeoCompetitorCandidate"}}}
      description: "Saved same-batch explicit-name mentions, not recommendations, market share or cross-period comparison. V2 deterministically projects strictly evidenced Han(ASCII-word) BRAND pairs to a Chinese display name and two visible-name match terms, including previously saved snapshots; PRODUCT names and descriptive qualifiers are never split. These are answer-evidenced parallel names, not independently verified catalog aliases. Confirmation creates the stable Chinese name with no automatic aliases. Percent rates use identical valid samples; failed/missing answers are never zero. A question naming the frozen self/configured competitor names or aliases, or an entity discovered in this report, is BRAND_VALIDATION. Later ignoring a candidate hides it from comparison but does not change that frozen question classification. Evidence truncation concerns discovery only; counts use full saved answers. Frozen report identities never follow later catalog edits. GET never triggers analysis."
    GeoCompetitorCandidatePage:

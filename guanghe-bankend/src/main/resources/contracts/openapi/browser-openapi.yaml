        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/conversations/{conversationId}/stream-actions/stop:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    post:
      operationId: stopConversationStream
      summary: Stop only the specified owned free answer; this never cancels a paid task.
      description: expectedRunId is mandatory. Stale tabs cannot stop a newer Run; a terminal target returns its existing status without forwarding another stop.
      security:
        - bearerAuth: []
      requestBody:
        required: true

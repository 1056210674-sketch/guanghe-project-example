      properties:
        workflowId: { $ref: "#/components/schemas/BusinessId" }
        reportId: { $ref: "#/components/schemas/BusinessId" }
        suggestionId: { type: [string, "null"] }
        conversationId: { $ref: "#/components/schemas/BusinessId" }
        articleId: { $ref: "#/components/schemas/BusinessId" }
        draftId: { $ref: "#/components/schemas/BusinessId" }
        reused: { type: boolean }

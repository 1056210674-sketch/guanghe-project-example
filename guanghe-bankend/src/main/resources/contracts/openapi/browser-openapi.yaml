        articleId: { $ref: "#/components/schemas/BusinessId" }
        articleVersion: { type: integer, minimum: 1 }
        titleCandidates: { type: array, maxItems: 5, items: { type: string, minLength: 1, maxLength: 300 } }
        title: { type: [string, "null"], maxLength: 300 }
        outline: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/ArticleOutlineItem" } }
        plan:
          oneOf:
            - $ref: "#/components/schemas/ArticleCreativePlan"
            - type: "null"

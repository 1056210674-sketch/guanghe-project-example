  /api/v1/callbacks/payment/notify:
    post:
      operationId: receivePaymentCallback
      summary: Provider payment callback. Authenticated by provider signature, not by a bearer token.
      description: |
        The only unauthenticated entry point into the commercial control plane. The raw body is
        verified against the provider's platform certificate before anything is parsed from it, and it
        is never logged or persisted. Answers in the provider's own vocabulary, because the caller
        decides whether to retry from the status code: acknowledged once the message's effect —
        including "nothing to do", "already applied" and "stale" — is durably recorded, refused when
        the message could not be authenticated or could not be accounted for.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Provider callback envelope. Opaque to this contract; verified before it is read.
              additionalProperties: true
      responses:
        "200": { description: Callback authenticated and its effect recorded., content: { application/json: { schema: { $ref: "#/components/schemas/PaymentCallbackAck" } } } }
        "401": { description: The callback could not be authenticated., content: { application/json: { schema: { $ref: "#/components/schemas/PaymentCallbackFailure" } } } }
        "409": { description: The provider amount disagrees with the order. Recorded for operators and never credited., content: { application/json: { schema: { $ref: "#/components/schemas/PaymentCallbackFailure" } } } }
        "422": { description: The callback names an order this system does not have. Recorded for reconciliation., content: { application/json: { schema: { $ref: "#/components/schemas/PaymentCallbackFailure" } } } }
        "503": { description: Callback verification is not configured., content: { application/json: { schema: { $ref: "#/components/schemas/PaymentCallbackFailure" } } } }

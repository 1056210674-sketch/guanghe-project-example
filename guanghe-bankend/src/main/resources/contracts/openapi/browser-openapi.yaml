        sequence: { type: integer, format: int64, minimum: 1 }
        stableErrorCode: { type: [string, "null"], pattern: "^[A-Z][A-Z0-9_]{0,63}$" }
        occurredAt: { type: string, format: date-time }
    RunDiagnostic:
      type: object
      additionalProperties: false
      required: [runId, conversationId, status, lastPythonSequence, decision, createdAt, updatedAt, usage, contextBudget, timeline, dataGaps]
      properties:
        runId: { $ref: "#/components/schemas/AgentRunId" }
        conversationId: { $ref: "#/components/schemas/BusinessId" }
        status: { type: string, enum: [QUEUED, STARTING, RUNNING, COMPLETED, FAILED, STOP_REQUESTED, STOPPED] }
        lastPythonSequence: { type: integer, format: int64, minimum: 0 }
        stableErrorCode: { type: [string, "null"], pattern: "^[A-Z][A-Z0-9_]{0,63}$" }
        decision: { $ref: "#/components/schemas/TaskDiagnosticDecision" }
        traceId: { type: [string, "null"], pattern: "^[0-9a-f]{32}$" }
        stopRequestedAt: { type: [string, "null"], format: date-time }
        startedAt: { type: [string, "null"], format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        usage: { $ref: "#/components/schemas/RunDiagnosticUsage" }
        contextBudget: { $ref: "#/components/schemas/RunDiagnosticContextBudget" }
        linkedTaskId: { oneOf: [{ $ref: "#/components/schemas/BusinessId" }, { type: "null" }] }
        timeline: { type: array, items: { $ref: "#/components/schemas/RunDiagnosticTimelineEntry" } }
        dataGaps: { type: array, items: { type: string, enum: [TRACE_ID_NOT_PERSISTED, USAGE_NOT_REPORTED] } }
    RunDiagnosticPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties: { items: { type: array, items: { $ref: "#/components/schemas/RunDiagnosticSummary" } } }
    RunDiagnosticPageApiResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties: { data: { $ref: "#/components/schemas/RunDiagnosticPage" } }
    RunDiagnosticApiResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties: { data: { $ref: "#/components/schemas/RunDiagnostic" } }
    WorkflowPlanStatus:
      type: string
      enum: [DRAFT, WAITING_CONFIRMATION, CONFIRMED, QUEUED, RUNNING, WAITING_INPUT,
             SUCCEEDED, FAILED, RECONFIRMATION_REQUIRED, ABANDONED]
    WorkflowPlanBudget:
      type: object
      additionalProperties: false
      required: [maxSteps, maxReplans, maxModelCalls, maxToolCalls, maxProviderCalls, maxPointCost, deadlineAt]
      properties:
        maxSteps: { type: integer, minimum: 2, maximum: 12 }
        maxReplans: { type: integer, minimum: 0, maximum: 2 }
        maxModelCalls: { type: integer, minimum: 1, maximum: 32 }
        maxToolCalls: { type: integer, minimum: 2, maximum: 32 }
        maxProviderCalls: { type: integer, minimum: 0, maximum: 12 }
        maxPointCost: { type: integer, minimum: 1, maximum: 1000000 }
        deadlineAt: { type: string, format: date-time }
    WorkflowDraftReference:
      type: object
      additionalProperties: false
      required: [draftId, taskType, pricingVersionId, quotedPoints]
      properties:
        draftId: { $ref: "#/components/schemas/BusinessId" }
        taskType: { type: string, enum: [IMAGE, VIDEO, GEO, ARTICLE] }
        pricingVersionId: { $ref: "#/components/schemas/BusinessId" }
        quotedPoints: { type: integer, minimum: 1 }
    WorkflowPlanStep:
      type: object
      additionalProperties: false
      required: [stepId, ordinal, type, toolName, toolVersion, risk, dependsOn,
                 successCriteria, inputRefs, status, taskId, taskStatus, taskResultRef]
      properties:
        stepId: { type: string, pattern: "^step-[1-9][0-9]?$" }
        ordinal: { type: integer, minimum: 1, maximum: 12 }
        type: { type: string, enum: [QUERY, ANALYZE, PREPARE, SYNTHESIZE] }
        toolName:
          type: string
          enum: [context.catalog.inspect, context.memory.search, context.task_workspace.inspect,
                 analysis.competitor.compare, analysis.evidence.aggregate, task_draft.propose]
        toolVersion: { type: string, const: "1" }
        risk: { type: string, enum: [QUERY, ANALYZE, PREPARE] }
        dependsOn: { type: array, maxItems: 11, uniqueItems: true, items: { type: string, pattern: "^step-[1-9][0-9]?$" } }
        successCriteria: { type: array, minItems: 1, maxItems: 5, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 200 } }
        inputRefs: { type: array, maxItems: 8, items: { type: string, maxLength: 128 } }
        outputRef: { type: [string, "null"], pattern: "^(observation|draft):[A-Za-z0-9._-]{1,100}$" }
        taskDraft: { oneOf: [{ $ref: "#/components/schemas/WorkflowDraftReference" }, { type: "null" }] }
        status: { type: string, enum: [PENDING, READY, RUNNING, WAITING, SUCCEEDED, FAILED, SKIPPED] }
        taskId: { oneOf: [{ $ref: "#/components/schemas/BusinessId" }, { type: "null" }] }
        taskStatus:
          oneOf:
            - type: string
              enum: [QUEUED, RUNNING, RETRY_WAIT, SUCCEEDED, PARTIAL, FAILED, SKIPPED, SYSTEM_TERMINATED]
            - type: "null"
        taskResultRef:
          type: [string, "null"]
          pattern: "^(task|asset|geo-report|article):[1-9][0-9]{0,18}$"
          description: Safe Java-owned delivery reference; never a Provider or object-storage identifier.
    WorkflowConfirmationPreview:
      type: object
      additionalProperties: false
      required: [planVersion, quotedPoints, maxPointCost, expiresAt, consumptionEnabled]
      properties:
        planVersion: { type: integer, minimum: 1 }
        quotedPoints: { type: integer, minimum: 1 }
        maxPointCost: { type: integer, minimum: 1 }
        expiresAt: { type: string, format: date-time }
        consumptionEnabled:
          type: boolean
          const: false
          description: Safe plan reads never expose a confirmation credential.
    WorkflowEvent:
      type: object
      additionalProperties: false
      required: [sequence, eventType, toStatus, occurredAt]
      properties:
        sequence: { type: integer, format: int64, minimum: 1 }
        eventType: { type: string, enum: [PLAN_PROPOSED, PLAN_WAITING_CONFIRMATION, PLAN_CONFIRMED,
          PLAN_QUEUED, PLAN_STARTED, STEP_STATE_CHANGED, OBSERVATION_RECORDED, PLAN_REPLANNED,
          PLAN_WAITING_INPUT, PLAN_RETRY_QUEUED, PLAN_SUCCEEDED, PLAN_FAILED, PLAN_ABANDONED] }
        fromStatus: { oneOf: [{ $ref: "#/components/schemas/WorkflowPlanStatus" }, { type: "null" }] }
        toStatus: { $ref: "#/components/schemas/WorkflowPlanStatus" }
        stableErrorCode: { type: [string, "null"], pattern: "^[A-Z][A-Z0-9_]{0,63}$" }
        occurredAt: { type: string, format: date-time }
    WorkflowPlanSummary:
      type: object
      additionalProperties: false
      required: [id, conversationId, goalSummary, status, version, stepCount,
                 totalQuotedPoints, maxPointCost, confirmationExpiresAt, createdAt, updatedAt]
      properties:
        id: { $ref: "#/components/schemas/BusinessId" }
        conversationId: { $ref: "#/components/schemas/BusinessId" }
        goalSummary: { type: string, minLength: 1, maxLength: 500 }
        status: { $ref: "#/components/schemas/WorkflowPlanStatus" }
        version: { type: integer, minimum: 1 }
        stepCount: { type: integer, minimum: 2, maximum: 12 }
        totalQuotedPoints: { type: integer, minimum: 1 }
        maxPointCost: { type: integer, minimum: 1 }
        confirmationExpiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WorkflowPlan:
      allOf:
        - $ref: "#/components/schemas/WorkflowPlanSummary"
        - type: object
          additionalProperties: false
          required: [spaceId, budget, steps, confirmation, events, executionEnabled,
                     executionStarted, lastStableError]
          properties:
            spaceId: { $ref: "#/components/schemas/BusinessId" }
            productId: { oneOf: [{ $ref: "#/components/schemas/BusinessId" }, { type: "null" }] }
            budget: { $ref: "#/components/schemas/WorkflowPlanBudget" }
            steps: { type: array, minItems: 2, maxItems: 12, items: { $ref: "#/components/schemas/WorkflowPlanStep" } }
            confirmation: { $ref: "#/components/schemas/WorkflowConfirmationPreview" }
            events: { type: array, items: { $ref: "#/components/schemas/WorkflowEvent" } }
            abandonedAt: { type: [string, "null"], format: date-time }
            executionEnabled: { type: boolean }
            executionStarted: { type: boolean }
            lastStableError: { type: [string, "null"], pattern: "^[A-Z][A-Z0-9_]{0,63}$" }
    WorkflowPlanAbandonRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties: { version: { type: integer, minimum: 1 } }
    WorkflowConfirmationPreviewRequest:
      type: object
      additionalProperties: false
      required: [planVersion]
      properties:
        planVersion: { type: integer, minimum: 1 }
    WorkflowConfirmationAuthorization:
      type: object
      additionalProperties: false
      required: [planId, planVersion, totalQuotedPoints, maxPointCost, expiresAt,
                 executionEnabled, confirmationToken]
      properties:
        planId: { $ref: "#/components/schemas/BusinessId" }
        planVersion: { type: integer, minimum: 1 }
        totalQuotedPoints: { type: integer, minimum: 1 }
        maxPointCost: { type: integer, minimum: 1 }
        expiresAt: { type: string, format: date-time }
        executionEnabled: { type: boolean, const: false }
        confirmationToken: { type: string, minLength: 1, maxLength: 512, writeOnly: true }
    WorkflowPlanConfirmRequest:
      type: object
      additionalProperties: false
      required: [planVersion, authorizedMaxPoints, confirmationToken]
      properties:
        planVersion: { type: integer, minimum: 1 }
        authorizedMaxPoints: { type: integer, minimum: 1, maximum: 1000000 }
        confirmationToken: { type: string, minLength: 1, maxLength: 512, writeOnly: true }
    WorkflowPlanConfirmResponse:
      type: object
      additionalProperties: false
      required: [planId, planVersion, status, totalQuotedPoints, authorizedMaxPoints,
                 confirmedAt, executionEnabled, executionStarted]
      properties:
        planId: { $ref: "#/components/schemas/BusinessId" }
        planVersion: { type: integer, minimum: 1 }
        status: { type: string, const: CONFIRMED }
        totalQuotedPoints: { type: integer, minimum: 1 }
        authorizedMaxPoints: { type: integer, minimum: 1 }
        confirmedAt: { type: string, format: date-time }
        executionEnabled: { type: boolean, const: false }
        executionStarted: { type: boolean, const: false }
    WorkflowPlanPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties: { items: { type: array, items: { $ref: "#/components/schemas/WorkflowPlanSummary" } } }
    WorkflowPlanPageApiResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties: { data: { $ref: "#/components/schemas/WorkflowPlanPage" } }
    WorkflowPlanApiResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties: { data: { $ref: "#/components/schemas/WorkflowPlan" } }
    WorkflowConfirmationAuthorizationApiResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties: { data: { $ref: "#/components/schemas/WorkflowConfirmationAuthorization" } }
    WorkflowPlanConfirmApiResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties: { data: { $ref: "#/components/schemas/WorkflowPlanConfirmResponse" } }
    WorkflowStartRequest:
      type: object
      additionalProperties: false
      required: [planVersion]
      properties:
        planVersion: { type: integer, minimum: 1 }
    WorkflowStartResponse:
      type: object
      additionalProperties: false
      required: [planId, planVersion, status, executionEnabled, executionStarted]
      properties:
        planId: { $ref: "#/components/schemas/BusinessId" }
        planVersion: { type: integer, minimum: 1 }
        status: { $ref: "#/components/schemas/WorkflowPlanStatus" }
        executionEnabled: { type: boolean }
        executionStarted: { type: boolean }
        executionNo: { type: [integer, "null"], minimum: 1 }
    WorkflowStartApiResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties: { data: { $ref: "#/components/schemas/WorkflowStartResponse" } }

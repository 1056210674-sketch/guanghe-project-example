  /api/v1/agents:
    get:
      operationId: listAgents
      summary: List the released catalogue visible to the current user; no package or code imports.
      description: >-
        Returns the latest visible definition per agentKey and, when different, the current user's
        exact installed version. Definitions are grouped by agentKey, newest publication first;
        uninstalled historical versions are omitted. WITHDRAWN definitions appear only for their
        exact existing installation. installedInstallationId belongs only to the matching
        agentKey and version, never to a newer release. Consumers must match installations by
        agentKey plus agentVersion for status/capabilities, and use the installation list to prevent
        duplicate installation of an already installed agentKey. Listing never upgrades an installation.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Catalogue returned., content: { application/json: { schema: { $ref: "#/components/schemas/AgentCatalogueApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/agent-installations:
    get:
      operationId: listAgentInstallations
      summary: List owned installations that have not been removed.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Installations returned., content: { application/json: { schema: { $ref: "#/components/schemas/AgentInstallationListApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      operationId: addAgentInstallation
      summary: Add a published catalogue agent, or return the existing installation without enabling or upgrading it.
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AddAgentInstallationRequest" } } } }
      responses:
        "200": { description: New or existing installation returned., content: { application/json: { schema: { $ref: "#/components/schemas/AgentInstallationApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/agent-installations/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: "#/components/schemas/BusinessId" } }
    patch:
      operationId: updateAgentInstallation
      summary: Enable or disable an owned installation using its exact current version.
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UpdateAgentInstallationRequest" } } } }
      responses:
        "200": { description: Installation returned., content: { application/json: { schema: { $ref: "#/components/schemas/AgentInstallationApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      operationId: removeAgentInstallation
      summary: Tombstone an owned installation; retain historical conversation identities and results.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "Removed, including an already removed owned installation.", content: { application/json: { schema: { $ref: "#/components/schemas/EmptyAgentPlatformApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

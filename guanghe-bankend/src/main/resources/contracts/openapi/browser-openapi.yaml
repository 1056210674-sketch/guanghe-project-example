        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/conversations/{conversationId}/messages:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      operationId: listConversationMessages
      summary: Read persisted messages after a cursor, or an earlier page before beforeSequence.
      description: With beforeSequence, returns the nearest older messages in ascending order and nextCursor points to the next earlier page. Do not combine cursor and beforeSequence.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MessageCursor"
        - { name: beforeSequence, in: query, required: false, schema: { type: integer, format: int64, minimum: 1 } }
        - $ref: "#/components/parameters/MessageLimit"
      responses:
        "200":
          description: Messages returned in ascending sequence order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationMessagePageApiResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    post:
      operationId: sendConversationMessage
      summary: Persist a user message and enqueue one bounded free Chat Run.
      description: >-
        Replaying the same Idempotency-Key and clientMessageId with the same
        request returns the original messageId and runId without another Python call.
        READY image attachments may be used as the current Run source without changing the
        conversation's persisted sidebar selection. Paid draft/task continuation is unavailable here.
        Admission is serialized per account. Default free limits are 2 active Runs, 10 accepted
        turns per rolling 60 seconds, and 200 per Asia/Shanghai calendar day including 40 image
        turns. Accepted failed/stopped Runs count once; replay and deletion do not reset limits.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendConversationMessageRequest" }
      responses:
        "202":
          description: The user message and Run were persisted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageAcceptedApiResponse" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/conversations/{conversationId}/snapshot:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      operationId: getConversationSnapshot
      summary: Restore recent persisted messages and an event high-water mark from one database snapshot.
      description: Read this snapshot before connecting SSE with Last-Event-ID equal to highWatermark. Neither reads nor reconnection start a Run. Partial failed/stopped answers remain visible.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/MessageLimit"
      responses:
        "200": { description: Consistent latest message page and event cursor., content: { application/json: { schema: { $ref: "#/components/schemas/ConversationSnapshotApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/conversations/{conversationId}/message-operations/{clientMessageId}:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
      - { name: clientMessageId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getConversationMessageOperation
      summary: Look up an accepted message by its original clientMessageId without starting a Run.
      description: A 404 means no committed operation is visible, not proof that an in-flight submit cannot commit. Retry submission only with the original frozen request, clientMessageId and Idempotency-Key.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Original accepted message and current Run status., content: { application/json: { schema: { $ref: "#/components/schemas/MessageAcceptedApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/conversations/{conversationId}/events:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      operationId: streamConversationEvents
      summary: Replay persisted events and continue as a fetch-SSE stream.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LastEventId"
      responses:
        "200":
          description: Conversation event stream. The SSE id is the conversation-local sequence.
          headers:
            Cache-Control:
              schema: { type: string }
          content:
            text/event-stream:
              schema:
                type: string

openapi: 3.1.0
info:
  title: Zhixiaohe Browser API
  version: 1.20.0-geo-diagnostic-delivery
  description: >-
    Browser contract for authentication, user-owned catalog management, and
    persisted conversations, Java-authoritative paid-task flows, articles,
    media procurement resources and auditable outbound submissions.
    Catalog resources are internal operating spaces rather than external shops.
servers:
  - url: https://{host}
    variables:
      host:
        default: test.example.invalid
paths:
  /api/v1/geo/diagnostics/{id}/submit: {"parameters":[{"name":"id","in":"path","required":true,"schema":{"$ref":"#/components/schemas/BusinessId"}}],"post":{"operationId":"submitGeoDiagnostic","summary":"Explicit confirmed card quote admission; one existing GEO task, no chat Run. Same requestId/hash replays; policies and real frozen price remain enforced.","security":[{"bearerAuth":[]}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/GeoDiagnosticSubmitRequest"}}}},"responses":{"202":{"description":"One accepted sampling task plus fenced report delivery","content":{"application/json":{"schema":{"$ref":"#/components/schemas/GeoDiagnosticDetailApiResponse"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"},"409":{"$ref":"#/components/responses/Conflict"},"422":{"$ref":"#/components/responses/ValidationFailed"},"503":{"description":"Submission feature, sampling platform or private PDF storage unavailable"}}}}
  /api/v1/geo/diagnostics/{id}/report: {"parameters":[{"name":"id","in":"path","required":true,"schema":{"$ref":"#/components/schemas/BusinessId"}}],"get":{"operationId":"getGeoDiagnosticReport","security":[{"bearerAuth":[]}],"responses":{"200":{"description":"Owned immutable report projection; no monitoring or billing","content":{"application/json":{"schema":{"$ref":"#/components/schemas/GeoDiagnosticReportApiResponse"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"},"409":{"$ref":"#/components/responses/Conflict"},"422":{"$ref":"#/components/responses/ValidationFailed"}}}}
  /api/v1/geo/diagnostics/{id}/report/retry: {"parameters":[{"name":"id","in":"path","required":true,"schema":{"$ref":"#/components/schemas/BusinessId"}}],"post":{"operationId":"retryGeoDiagnosticReport","summary":"Explicit nonce/version-fenced analysis or PDF recovery using frozen evidence. No new sampling, paid-task admission, quote or wallet movement.","security":[{"bearerAuth":[]}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/GeoDiagnosticReportRetryRequest"}}}},"responses":{"200":{"description":"Owned immutable report projection; no monitoring or billing","content":{"application/json":{"schema":{"$ref":"#/components/schemas/GeoDiagnosticReportApiResponse"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"},"409":{"$ref":"#/components/responses/Conflict"},"422":{"$ref":"#/components/responses/ValidationFailed"},"429":{"description":"Analysis (2) or PDF (3) attempt limit reached"}}}}
  /api/v1/geo/diagnostics/{id}/report/download-url: {"parameters":[{"name":"id","in":"path","required":true,"schema":{"$ref":"#/components/schemas/BusinessId"}}],"get":{"operationId":"downloadGeoDiagnosticReport","summary":"Owner checked READY report only; exact immutable reportVersion. HTTPS private OSS URL; no-store and never send Java Authorization to OSS.","security":[{"bearerAuth":[]}],"parameters":[{"name":"version","in":"query","required":true,"schema":{"type":"integer","const":1}}],"responses":{"200":{"description":"Owned immutable report projection; no monitoring or billing","content":{"application/json":{"schema":{"$ref":"#/components/schemas/GeoDiagnosticDownloadApiResponse"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"},"409":{"$ref":"#/components/responses/Conflict"},"422":{"$ref":"#/components/responses/ValidationFailed"}}}}
  /api/v1/geo/diagnostics/{id}/report/observations: {"parameters":[{"name":"id","in":"path","required":true,"schema":{"$ref":"#/components/schemas/BusinessId"}}],"get":{"operationId":"getGeoDiagnosticObservations","summary":"All stored sampling answers and citations, untruncated and owner scoped; analysis samples are only excerpts.","security":[{"bearerAuth":[]}],"parameters":[{"name":"page","in":"query","schema":{"type":"integer","minimum":1,"default":1}},{"name":"size","in":"query","schema":{"type":"integer","minimum":1,"maximum":20,"default":10}}],"responses":{"200":{"description":"Owned immutable report projection; no monitoring or billing","content":{"application/json":{"schema":{"$ref":"#/components/schemas/GeoDiagnosticObservationsApiResponse"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"},"409":{"$ref":"#/components/responses/Conflict"},"422":{"$ref":"#/components/responses/ValidationFailed"}}}}
  /api/v1/geo/diagnostics:
    post:
      operationId: createGeoDiagnostic
      summary: Create an owned GEO project preparation and a completed card message; no Agent Run or paid task.
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GeoDiagnosticCreateRequest'}}}}
      responses:
        '201': {description: Saved preparation, content: {application/json: {schema: {$ref: '#/components/schemas/GeoDiagnosticDetailApiResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {description: Preparation limit reached}
    get:
      operationId: listGeoDiagnostics
      summary: List only owned project or conversation preparations; at least one scope filter is required.
      security: [{bearerAuth: []}]
      parameters:
        - {name: conversationId, in: query, schema: {$ref: '#/components/schemas/BusinessId'}}
        - {name: projectId, in: query, schema: {$ref: '#/components/schemas/BusinessId'}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 20, default: 20}}
        - {name: submittedOnly, in: query, schema: {type: boolean, default: false}, description: Filter in SQL before pagination and counts; only formally submitted diagnostic reports.}
      responses:
        '200': {description: Owned preparations, content: {application/json: {schema: {$ref: '#/components/schemas/GeoDiagnosticListApiResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /api/v1/geo/diagnostics/{id}:
    parameters: [{name: id, in: path, required: true, schema: {$ref: '#/components/schemas/BusinessId'}}]
    get:
      operationId: getGeoDiagnostic
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Preparation snapshot, content: {application/json: {schema: {$ref: '#/components/schemas/GeoDiagnosticDetailApiResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: updateGeoDiagnostic
      summary: Versioned edit; upstream changes invalidate downstream fields and quotes. Advancing queues the next preparation phase.
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GeoDiagnosticPatchRequest'}}}}
      responses:
        '200': {description: Updated preparation, content: {application/json: {schema: {$ref: '#/components/schemas/GeoDiagnosticDetailApiResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {description: One preparation generation active per user or session limit reached}
  /api/v1/geo/diagnostics/{id}/generate:
    parameters: [{name: id, in: path, required: true, schema: {$ref: '#/components/schemas/BusinessId'}}]
    post:
      operationId: generateGeoDiagnosticPreparation
      summary: Queue one explicit preparation phase; retain user-added or edited entries on regeneration.
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GeoDiagnosticGenerateRequest'}}}}
      responses:
        '202': {description: Persisted generation reference, content: {application/json: {schema: {$ref: '#/components/schemas/GeoDiagnosticDetailApiResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {description: Generation limit reached}
  /api/v1/geo/diagnostics/{id}/quote:
    parameters: [{name: id, in: path, required: true, schema: {$ref: '#/components/schemas/BusinessId'}}]
    post:
      operationId: quoteGeoDiagnostic
      summary: Price actual frozen question/platform samples and expose unchanged account limits; quote never funds a task.
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GeoDiagnosticQuoteRequest'}}}}
      responses:
        '200': {description: Preparation with actual quote and submission feature status, content: {application/json: {schema: {$ref: '#/components/schemas/GeoDiagnosticDetailApiResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '503': {description: Sampling platform or pricing unavailable}
  /api/v1/geo/period-reports: {"post":{"operationId":"createGeoPeriodReport","summary":"Freeze project/date facts and enqueue a bounded summary. Same requestId replays saved state; no Agent, paid task or new monitoring.","security":[{"bearerAuth":[]}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/GeoPeriodReportCreate"}}}},"responses":{"202":{"description":"Saved owner/project scoped period report","content":{"application/json":{"schema":{"$ref":"#/components/schemas/GeoPeriodReportDetailApiResponse"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"},"409":{"$ref":"#/components/responses/Conflict"},"422":{"$ref":"#/components/responses/ValidationFailed"},"429":{"description":"One active report per user or summary attempt limit reached."}}},"get":{"operationId":"listGeoPeriodReports","security":[{"bearerAuth":[]}],"parameters":[{"name":"projectId","in":"query","required":true,"schema":{"$ref":"#/components/schemas/BusinessId"}},{"name":"page","in":"query","schema":{"type":"integer","minimum":1,"default":1}},{"name":"size","in":"query","schema":{"type":"integer","minimum":1,"maximum":100,"default":20}}],"responses":{"200":{"description":"Saved owner/project scoped period report","content":{"application/json":{"schema":{"$ref":"#/components/schemas/GeoPeriodReportPageApiResponse"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"},"409":{"$ref":"#/components/responses/Conflict"},"422":{"$ref":"#/components/responses/ValidationFailed"},"429":{"description":"One active report per user or summary attempt limit reached."}}}}
  /api/v1/geo/period-reports/{reportId}: {"parameters":[{"name":"reportId","in":"path","required":true,"schema":{"$ref":"#/components/schemas/BusinessId"}}],"get":{"operationId":"getGeoPeriodReport","security":[{"bearerAuth":[]}],"responses":{"200":{"description":"Saved owner/project scoped period report","content":{"application/json":{"schema":{"$ref":"#/components/schemas/GeoPeriodReportDetailApiResponse"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"},"409":{"$ref":"#/components/responses/Conflict"},"422":{"$ref":"#/components/responses/ValidationFailed"},"429":{"description":"One active report per user or summary attempt limit reached."}}}}
  /api/v1/geo/period-reports/{reportId}/retry-summary: {"parameters":[{"name":"reportId","in":"path","required":true,"schema":{"$ref":"#/components/schemas/BusinessId"}}],"post":{"operationId":"retryGeoPeriodReportSummary","summary":"Explicit retry of the same immutable facts; at most two model attempts. Never refetch business data or rerun monitoring.","security":[{"bearerAuth":[]}],"responses":{"202":{"description":"Saved owner/project scoped period report","content":{"application/json":{"schema":{"$ref":"#/components/schemas/GeoPeriodReportDetailApiResponse"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"},"409":{"$ref":"#/components/responses/Conflict"},"422":{"$ref":"#/components/responses/ValidationFailed"},"429":{"description":"One active report per user or summary attempt limit reached."}}}}
  /api/v1/geo/period-reports/{reportId}/export: {"parameters":[{"name":"reportId","in":"path","required":true,"schema":{"$ref":"#/components/schemas/BusinessId"}}],"get":{"operationId":"exportGeoPeriodReport","summary":"PDF for the exact preview version; no model or arbitrary URL fetch.","security":[{"bearerAuth":[]}],"parameters":[{"name":"version","in":"query","required":true,"schema":{"type":"integer","minimum":1}}],"responses":{"200":{"description":"Saved report PDF. No-store download.","content":{"application/pdf":{"schema":{"type":"string","format":"binary"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"},"409":{"$ref":"#/components/responses/Conflict"},"422":{"$ref":"#/components/responses/ValidationFailed"},"429":{"description":"One active report per user or summary attempt limit reached."}}}}
  /api/v1/memory/entries:
    get:
      operationId: listMemoryEntries
      summary: List only the selected scope; project scope requires an owned active project.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: scope, in: query, required: true, schema: { type: string, enum: [PROJECT, ACCOUNT] } }
        - { name: projectId, in: query, required: false, schema: { $ref: '#/components/schemas/BusinessId' } }
        - { name: includeDeleted, in: query, required: false, schema: { type: boolean, default: false } }
      responses:
        '200': { description: Scoped entries, content: { application/json: { schema: { $ref: '#/components/schemas/MemoryEntryListApiResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      operationId: createMemoryEntry
      summary: Explicit user-created scoped memory; existing keys including tombstones conflict.
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateMemoryEntryRequest' } } } }
      responses:
        '201': { description: Memory saved, content: { application/json: { schema: { $ref: '#/components/schemas/MemoryEntryApiResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /api/v1/memory/entries/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { $ref: '#/components/schemas/BusinessId' } }]
    put:
      operationId: updateMemoryEntry
      summary: Replace current value with optimistic version; a tombstone requires explicit restore=true and newly entered content. Scope, key and kind cannot change.
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateMemoryEntryRequest' } } } }
      responses:
        '200': { description: Memory updated, content: { application/json: { schema: { $ref: '#/components/schemas/MemoryEntryApiResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      operationId: deleteMemoryEntry
      summary: Remove value and retain versioned tombstone, without deleting chat UI history.
      security: [{ bearerAuth: [] }]
      parameters: [{ name: version, in: query, required: true, schema: { type: integer, minimum: 1 } }]
      responses:
        '200': { description: Memory forgotten, content: { application/json: { schema: { $ref: '#/components/schemas/EmptyAgentPlatformApiResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/projects/{projectId}/geo-target:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/BusinessId" }
    get:
      operationId: getProjectGeoTarget
      summary: Read the user's explicitly configured public monitoring name, not the project's display name.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Owned target settings returned., content: { application/json: { schema: { $ref: "#/components/schemas/ProjectGeoTargetApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateProjectGeoTarget
      summary: Explicitly replace an active project's public name and aliases with an optimistic project version. No sampling or history changes.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProjectGeoTargetRequest" }
      responses:
        "200": { description: Owned target settings saved., content: { application/json: { schema: { $ref: "#/components/schemas/ProjectGeoTargetApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/admin/agent-definitions: {"get":{"operationId":"adminListAgentDefinitions","security":[{"bearerAuth":[]}],"parameters":[],"responses":{"200":{"description":"ADMIN-only metadata. User contents and private source references are excluded.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/AdminAgentDefinitionListApiResponse"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"},"409":{"$ref":"#/components/responses/Conflict"},"422":{"$ref":"#/components/responses/ValidationFailed"},"503":{"$ref":"#/components/responses/ServiceUnavailable"}}}}
  /api/v1/admin/agent-definitions/{agentKey}/versions/{version}: {"patch":{"operationId":"adminUpdateAgentDefinition","security":[{"bearerAuth":[]}],"parameters":[{"name":"agentKey","in":"path","required":true,"schema":{"type":"string","pattern":"^[a-z][a-z0-9-]{0,63}$"}},{"name":"version","in":"path","required":true,"schema":{"type":"string","maxLength":32,"pattern":"^[0-9]+\\.[0-9]+\\.[0-9]+$"}}],"responses":{"200":{"description":"ADMIN-only metadata. User contents and private source references are excluded.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/AdminAgentDefinitionViewApiResponse"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"},"409":{"$ref":"#/components/responses/Conflict"},"422":{"$ref":"#/components/responses/ValidationFailed"},"503":{"$ref":"#/components/responses/ServiceUnavailable"}},"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/AdminUpdateAgentDefinitionRequest"}}}}}}
  /api/v1/admin/geo-plans: {"get":{"operationId":"adminListGeoPlans","security":[{"bearerAuth":[]}],"parameters":[{"name":"userId","in":"query","required":false,"schema":{"$ref":"#/components/schemas/BusinessId"}},{"name":"projectId","in":"query","required":false,"schema":{"$ref":"#/components/schemas/BusinessId"}},{"name":"status","in":"query","required":false,"schema":{"type":"string","enum":["ACTIVE","PAUSED"]}},{"$ref":"#/components/parameters/Page"},{"$ref":"#/components/parameters/Size"}],"responses":{"200":{"description":"ADMIN-only metadata. User contents and private source references are excluded.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/AdminGeoPlanPageApiResponse"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"},"409":{"$ref":"#/components/responses/Conflict"},"422":{"$ref":"#/components/responses/ValidationFailed"},"503":{"$ref":"#/components/responses/ServiceUnavailable"}}}}
  /api/v1/admin/geo-plans/{id}/slots: {"get":{"operationId":"adminListGeoPlanSlots","security":[{"bearerAuth":[]}],"parameters":[{"name":"id","in":"path","required":true,"schema":{"$ref":"#/components/schemas/BusinessId"}},{"$ref":"#/components/parameters/Page"},{"$ref":"#/components/parameters/Size"}],"responses":{"200":{"description":"ADMIN-only metadata. User contents and private source references are excluded.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/AdminGeoPlanSlotPageApiResponse"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"},"409":{"$ref":"#/components/responses/Conflict"},"422":{"$ref":"#/components/responses/ValidationFailed"},"503":{"$ref":"#/components/responses/ServiceUnavailable"}}}}
  /api/v1/admin/geo-plans/{id}/pause: {"post":{"operationId":"adminPauseGeoPlan","security":[{"bearerAuth":[]}],"parameters":[{"name":"id","in":"path","required":true,"schema":{"$ref":"#/components/schemas/BusinessId"}}],"responses":{"200":{"description":"ADMIN-only metadata. User contents and private source references are excluded.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/AdminGeoPlanViewApiResponse"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"},"409":{"$ref":"#/components/responses/Conflict"},"422":{"$ref":"#/components/responses/ValidationFailed"},"503":{"$ref":"#/components/responses/ServiceUnavailable"}},"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/AdminPauseGeoPlanRequest"}}}}}}
  /api/v1/admin/geo-plans/{id}/resume: {"post":{"operationId":"adminResumeGeoPlan","security":[{"bearerAuth":[]}],"parameters":[{"name":"id","in":"path","required":true,"schema":{"$ref":"#/components/schemas/BusinessId"}}],"responses":{"200":{"description":"ADMIN-only metadata. User contents and private source references are excluded.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/AdminGeoPlanViewApiResponse"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"},"409":{"$ref":"#/components/responses/Conflict"},"422":{"$ref":"#/components/responses/ValidationFailed"},"503":{"$ref":"#/components/responses/ServiceUnavailable"}},"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/AdminResumeGeoPlanRequest"}}}}}}
  /api/v1/admin/knowledge-documents: {"get":{"operationId":"adminListKnowledgeDocuments","security":[{"bearerAuth":[]}],"parameters":[{"name":"userId","in":"query","required":false,"schema":{"$ref":"#/components/schemas/BusinessId"}},{"name":"projectId","in":"query","required":false,"schema":{"$ref":"#/components/schemas/BusinessId"}},{"$ref":"#/components/parameters/Page"},{"$ref":"#/components/parameters/Size"}],"responses":{"200":{"description":"ADMIN-only metadata. User contents and private source references are excluded.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/AdminKnowledgeDocumentMetadataPageApiResponse"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"},"409":{"$ref":"#/components/responses/Conflict"},"422":{"$ref":"#/components/responses/ValidationFailed"},"503":{"$ref":"#/components/responses/ServiceUnavailable"}}}}

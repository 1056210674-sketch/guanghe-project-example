        requestedAt: { type: [string, "null"], format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }
        failureCode:
          type: [string, "null"]
          enum: [GEO_INTERPRETATION_TIMEOUT, GEO_INTERPRETATION_PROVIDER_UNAVAILABLE, GEO_INTERPRETATION_INVALID_RESULT, GEO_INTERPRETATION_INPUT_CHANGED, GEO_INTERPRETATION_REPORT_UNAVAILABLE, GEO_INTERPRETATION_LEASE_EXPIRED, GEO_INTERPRETATION_CAPACITY_FULL, null]
        retryAfter: { type: [string, "null"], format: date-time }
        unavailableReason:
          type: [string, "null"]
          enum: [ARCHIVED, NOT_TERMINAL, NO_VALID_ANSWERS, UNSUPPORTED_REPORT, ATTEMPT_LIMIT_REACHED, SERVICE_UNAVAILABLE, null]

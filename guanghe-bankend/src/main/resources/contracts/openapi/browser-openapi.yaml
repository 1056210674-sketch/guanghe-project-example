    GeoArticleWorkflowApiResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          required: [data]
          properties: { data: { $ref: "#/components/schemas/GeoArticleWorkflow" } }
    ReviseTaskDraftRequest:
      type: object
      additionalProperties: false
      required: [spaceId, parameterSchemaVersion, parameters]
      properties:
        spaceId: { $ref: "#/components/schemas/BusinessId" }
        productId: { $ref: "#/components/schemas/NullableBusinessId" }
        sourceMessageId:
          $ref: "#/components/schemas/NullableBusinessId"
          description: Required only for CURRENT_ATTACHMENTS to prove current-message provenance.
        parameterSchemaVersion:
          type: integer
          enum: [1, 2]
          description: ARTICLE requires version 2; IMAGE, VIDEO, and GEO require version 1.

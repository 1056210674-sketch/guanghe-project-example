    CreateMediaQuoteRequest:
      type: object
      additionalProperties: false
      required: [articleId, articleSnapshotId, items]
      properties:
        articleId: { $ref: "#/components/schemas/BusinessId" }
        articleSnapshotId: { $ref: "#/components/schemas/BusinessId" }
        items:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items:
            type: object
            additionalProperties: false
            required: [mediaResourceId]
            properties:
              mediaResourceId: { $ref: "#/components/schemas/BusinessId" }
              remark: { type: [string, "null"], maxLength: 1500 }
    CreateTaskDraftRequest:
      type: object
      additionalProperties: false
      required: [conversationId, taskType, spaceId, parameterSchemaVersion, parameters]
      properties:
        conversationId: { $ref: "#/components/schemas/BusinessId" }
        taskType: { type: string, enum: [IMAGE, VIDEO, GEO, ARTICLE] }
        spaceId: { $ref: "#/components/schemas/BusinessId" }
        productId: { $ref: "#/components/schemas/NullableBusinessId" }
        sourceMessageId:

          properties: { data: { $ref: "#/components/schemas/MediaSubmissionDetail" } }
    MediaSubmissionPageApiResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties: { data: { $ref: "#/components/schemas/MediaSubmissionPage" } }
    AdminMediaOverview:
      type: object
      additionalProperties: false
      required: [activeResources, pendingSubmissions, exceptionSubmissions, walletBalanceCents]
      properties:
        activeResources: { type: integer, format: int64, minimum: 0 }
        pendingSubmissions: { type: integer, format: int64, minimum: 0 }
        exceptionSubmissions: { type: integer, format: int64, minimum: 0 }
        walletBalanceCents:
          type: [integer, "null"]
          format: int64
          minimum: 0
          description: |
            Always null in this version. The upstream wallet balance is a live provider call, and this
            read-only surface does not make one; the field is declared so the browser contract does not
            have to change when a provider sync starts reporting it.
    AdminMediaResource:
      type: object
      additionalProperties: false
      required: [id, providerCode, upstreamModelId, upstreamResourceId, name, status, capabilities,
                 upstreamPrice, markupRate, referenceSaleAmountCents, referenceChargedPoints,
                 lastSeenAt, syncedAt, version]
      properties:
        id: { $ref: "#/components/schemas/BusinessId" }
        providerCode: { type: string, pattern: "^[A-Z][A-Z0-9_]{0,63}$" }
        upstreamModelId: { type: string, maxLength: 32, description: Upstream media resource type; not an AI model. }
        upstreamResourceId: { type: string, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 255 }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        resourceType: { type: [string, "null"], maxLength: 64 }
        channelCategory: { type: [string, "null"], maxLength: 120 }
        region: { type: [string, "null"], maxLength: 120 }
        estimatedDays: { type: [integer, "null"], minimum: 0, maximum: 365 }
        capabilities: { type: object, additionalProperties: true, maxProperties: 20 }
        upstreamPrice:
          type: string
          pattern: "^[0-9]{1,8}(\\.[0-9]{1,4})?$"
          description: Exact purchase price in CNY yuan as stored, so a numeric(12,4) value is never rounded into a float.
        markupRate:
          type: string
          pattern: "^[0-9]{1,2}(\\.[0-9]{1,4})?$"
          description: The pricing policy's markup over the purchase price, applied as (1 + markupRate) rounded up.
        referenceSaleAmountCents: { type: integer, minimum: 1 }
        referenceChargedPoints: { type: integer, minimum: 1 }
        lastSeenAt: { type: string, format: date-time }
        syncedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
      description: |
        Operator view of a catalogued resource. Unlike MediaResource it carries the purchase price and
        the markup, and unlike any raw row it never carries the provider app key, the outbound request
        body or media_resource.raw_json. referenceSaleAmountCents and referenceChargedPoints are what
        the current pricing policy produces, not a stored quotation: a price is persisted only when a
        tenant requests a quote, and what a submission actually paid is recorded on that submission.
    AdminMediaSubmissionSummary:
      type: object
      additionalProperties: false
      required: [id, batchId, taskId, userId, mediaResourceId, mediaName, providerCode,
                 upstreamModelId, upstreamResourceId, customerOrderId, status, submissionState,
                 publishedUrls, upstreamPrice, markupRate, saleAmountCents, chargedPoints, createdAt, updatedAt]
      properties:
        id: { $ref: "#/components/schemas/BusinessId" }
        batchId: { $ref: "#/components/schemas/BusinessId" }
        taskId: { $ref: "#/components/schemas/BusinessId" }
        userId: { $ref: "#/components/schemas/BusinessId" }
        mediaResourceId: { $ref: "#/components/schemas/BusinessId" }
        mediaName: { type: string, minLength: 1, maxLength: 255 }
        providerCode: { type: string, pattern: "^[A-Z][A-Z0-9_]{0,63}$" }
        upstreamModelId: { type: string, maxLength: 32 }
        upstreamResourceId: { type: string, maxLength: 64 }
        customerOrderId: { type: string, maxLength: 30, description: Our own order id, the key the upstream callback names. }
        upstreamOrderId: { type: [string, "null"], maxLength: 128 }
        upstreamOrderNo: { type: [string, "null"], maxLength: 128 }
        upstreamStatus: { type: [string, "null"], maxLength: 64 }
        status: { $ref: "#/components/schemas/MediaSubmissionStatus" }
        submissionState: { type: string, enum: [NOT_SUBMITTED, CONFIRMED, UNKNOWN] }
        publishedUrl: { type: [string, "null"], format: uri, pattern: "^https?://[^\\s/@?#]+([/?#][^\\s]*)?$" }
        publishedUrls:
          type: array
          maxItems: 20
          items: { type: string, format: uri, pattern: "^https?://[^\\s/@?#]+([/?#][^\\s]*)?$" }
        stableErrorCode: { type: [string, "null"], pattern: "^[A-Z][A-Z0-9_]{0,63}$" }
        upstreamPrice:
          type: string
          pattern: "^[0-9]{1,8}(\\.[0-9]{1,4})?$"
          description: The purchase price this submission was priced against, in CNY yuan, frozen at quote time.
        markupRate: { type: string, pattern: "^[0-9]{1,2}(\\.[0-9]{1,4})?$" }
        saleAmountCents: { type: integer, minimum: 1 }
        chargedPoints: { type: integer, minimum: 1 }
        remark: { type: [string, "null"], maxLength: 1500 }
        submitAttemptedAt: { type: [string, "null"], format: date-time }
        nextPollAt: { type: [string, "null"], format: date-time }
        publishedAt: { type: [string, "null"], format: date-time }
        rejectedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      description: |
        Operator view of a submission. It adds the account, the provider identifiers, the upstream order
        numbers and the frozen price — the fields an operator needs to reconcile against the upstream —
        and still carries no request or callback payload.
    AdminMediaSubmission:
      allOf:
        - $ref: "#/components/schemas/AdminMediaSubmissionSummary"
        - type: object
          required: [events]
          properties:
            events:
              type: array
              items: { $ref: "#/components/schemas/MediaSubmissionEvent" }
    AdminMediaCallback:
      type: object
      additionalProperties: false
      required: [id, providerCode, eventType, status, attempts, receivedAt, updatedAt]
      properties:
        id: { $ref: "#/components/schemas/BusinessId" }
        providerCode: { type: string, pattern: "^[A-Z][A-Z0-9_]{0,63}$" }
        customerOrderId: { type: [string, "null"], maxLength: 30 }
        upstreamModelId: { type: [string, "null"], maxLength: 32 }
        upstreamResourceId: { type: [string, "null"], maxLength: 64 }
        eventType: { type: string, pattern: "^[A-Z][A-Z0-9_]{0,63}$" }
        status: { type: string, enum: [RECEIVED, PROCESSED, FAILED] }
        attempts: { type: integer, minimum: 0 }
        stableErrorCode: { type: [string, "null"], pattern: "^[A-Z][A-Z0-9_]{0,63}$" }
        receivedAt: { type: string, format: date-time }
        processedAt: { type: [string, "null"], format: date-time }
        updatedAt: { type: string, format: date-time }
      description: |
        A received upstream callback. The body digest is deliberately absent: it is derived from an
        unredacted payload, and publishing it would invite re-identification attempts against a value
        this surface does not otherwise expose. The receipt id is the operator's handle instead.
    AdminMediaSyncState:
      type: object
      additionalProperties: false
      required: [providerCode, upstreamModelId, status, lastResourceCount, version, updatedAt]
      properties:
        providerCode: { type: string, pattern: "^[A-Z][A-Z0-9_]{0,63}$" }
        upstreamModelId: { type: string, maxLength: 32 }
        status: { type: string, enum: [IDLE, RUNNING, SUCCEEDED, FAILED] }
        lastAttemptedAt: { type: [string, "null"], format: date-time }
        lastSucceededAt: { type: [string, "null"], format: date-time }
        lastErrorCode: { type: [string, "null"], pattern: "^[A-Z][A-Z0-9_]{0,63}$" }
        lastResourceCount: { type: integer, minimum: 0 }
        version: { type: integer, minimum: 1 }
        updatedAt: { type: string, format: date-time }
      description: |
        The last known catalogue sync outcome for one upstream model. There is no batch, operator or
        per-run counter because nothing records them; the console shows this row as it stands.
    AdminMediaResourcePage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties: { items: { type: array, items: { $ref: "#/components/schemas/AdminMediaResource" } } }
    AdminMediaSubmissionPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties: { items: { type: array, items: { $ref: "#/components/schemas/AdminMediaSubmissionSummary" } } }
    AdminMediaCallbackPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties: { items: { type: array, items: { $ref: "#/components/schemas/AdminMediaCallback" } } }
    AdminMediaOverviewApiResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties: { data: { $ref: "#/components/schemas/AdminMediaOverview" } }
    AdminMediaResourceApiResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties: { data: { $ref: "#/components/schemas/AdminMediaResource" } }
    AdminMediaResourcePageApiResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties: { data: { $ref: "#/components/schemas/AdminMediaResourcePage" } }
    AdminMediaSubmissionApiResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties: { data: { $ref: "#/components/schemas/AdminMediaSubmission" } }
    AdminMediaSubmissionPageApiResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties: { data: { $ref: "#/components/schemas/AdminMediaSubmissionPage" } }
    AdminMediaCallbackApiResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties: { data: { $ref: "#/components/schemas/AdminMediaCallback" } }
    AdminMediaCallbackPageApiResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties: { data: { $ref: "#/components/schemas/AdminMediaCallbackPage" } }
    AdminMediaSyncStateListApiResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties: { data: { type: array, items: { $ref: "#/components/schemas/AdminMediaSyncState" } } }
    AgentBundleVersion:
      type: string
      minLength: 1
      maxLength: 128
      pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
    AgentRuntimeAvailability:
      type: string
      enum: [AVAILABLE, UNAVAILABLE, NOT_CONFIGURED]
    AgentVersionStatus:
      type: string
      enum: [CURRENT, OBSERVED]
    AgentEvaluationAvailability:
      type: string
      enum: [NOT_REGISTERED]
    AdminAgentModelGateway:
      type: object
      additionalProperties: false
      required: [mode, provider, model, status, reasonCode]
      properties:
        mode: { type: string, enum: [MOCK, REAL, UNAVAILABLE] }
        provider: { type: [string, "null"], pattern: "^[A-Z][A-Z0-9_]{0,63}$" }
        model: { type: [string, "null"], pattern: "^[A-Za-z0-9._:/-]{1,128}$" }
        status: { type: string, enum: [AVAILABLE, CONFIGURED, UNAVAILABLE, NOT_CONFIGURED, MODEL_NOT_CONFIGURED, DISABLED] }
        reasonCode: { type: [string, "null"], pattern: "^[A-Z][A-Z0-9_]{0,63}$" }
    AdminAgentProfile:
      type: object
      additionalProperties: false
      required: [profileCode, profileVersion, taskTypes]
      properties:
        profileCode: { type: string, minLength: 1, maxLength: 128 }
        profileVersion: { type: string, minLength: 1, maxLength: 128 }
        taskTypes:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { type: string, pattern: "^[A-Z][A-Z0-9_]{0,63}$" }
    AdminAgentProvider:
      type: object
      additionalProperties: false
      required: [code, status, model]
      properties:
        code: { type: string, pattern: "^[A-Z][A-Z0-9_]{0,63}$" }
        status: { type: string, enum: [AVAILABLE, CONFIGURED, UNAVAILABLE, NOT_CONFIGURED, MODEL_NOT_CONFIGURED, DISABLED] }
        model: { type: [string, "null"], pattern: "^[A-Za-z0-9._:/-]{1,128}$" }
    AdminAgentRuntimeSnapshot:
      type: object
      additionalProperties: false
      required: [availability, reasonCode, serviceVersion, bundleVersion, bundleHash, promptHash,
                 gitCommit, modelGateway, profiles, providers]
      properties:
        availability: { $ref: "#/components/schemas/AgentRuntimeAvailability" }
        reasonCode: { type: [string, "null"], pattern: "^[A-Z][A-Z0-9_]{0,63}$" }
        serviceVersion: { type: [string, "null"], minLength: 1, maxLength: 128 }
        bundleVersion:
          oneOf:
            - $ref: "#/components/schemas/AgentBundleVersion"
            - type: "null"
        bundleHash: { type: [string, "null"], pattern: "^[0-9a-f]{64}$" }
        promptHash: { type: [string, "null"], pattern: "^[0-9a-f]{64}$" }
        gitCommit: { type: [string, "null"], pattern: "^[0-9a-f]{7,64}$" }
        modelGateway:
          oneOf:
            - $ref: "#/components/schemas/AdminAgentModelGateway"
            - type: "null"
        profiles:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/AdminAgentProfile" }
        providers:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/AdminAgentProvider" }
      description: |
        Signed evidence from the currently running Python service. Version fields are null when the
        service is unavailable or internal communication is disabled; clients must not infer them.
    AdminAgentVersionSummary:
      type: object
      additionalProperties: false
      required: [bundleVersion, status, firstObservedAt, lastObservedAt, runCount]
      properties:
        bundleVersion: { $ref: "#/components/schemas/AgentBundleVersion" }
        status: { $ref: "#/components/schemas/AgentVersionStatus" }
        firstObservedAt: { type: [string, "null"], format: date-time }
        lastObservedAt: { type: [string, "null"], format: date-time }
        runCount: { type: integer, format: int64, minimum: 0 }
    AdminAgentVersionSummaryPage:
      allOf:
        - $ref: "#/components/schemas/Page"

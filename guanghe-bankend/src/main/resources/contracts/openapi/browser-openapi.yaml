        region: { type: [string, "null"], maxLength: 100 }
        keywords:
          type: array
          items: { $ref: "#/components/schemas/GeoKeyword" }
        questions:
          type: array
          items: { $ref: "#/components/schemas/GeoQuestion" }
        competitorIds:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { $ref: "#/components/schemas/BusinessId" }
        competitorSetVersion:
          type: [integer, "null"]
          format: int32
          minimum: 1
          description: Null until the first immutable formal competitor set is saved.
        version: { $ref: "#/components/schemas/ResourceVersion" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    GeoTopicPage:
      type: object
      additionalProperties: false
      required: [items, page, size, total, hasNext]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/GeoTopicSummary" } }
        page: { type: integer, format: int32, minimum: 1 }
        size: { type: integer, format: int32, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }
        hasNext: { type: boolean }
    GeoTopicApiResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          required: [data]
          properties: { data: { $ref: "#/components/schemas/GeoTopic" } }
    GeoTopicPageApiResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          required: [data]
          properties: { data: { $ref: "#/components/schemas/GeoTopicPage" } }
    ConversationPageApiResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          required: [data]
          properties:
            data: { $ref: "#/components/schemas/ConversationPage" }
    ConversationApiResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          required: [data]
          properties:
            data: { $ref: "#/components/schemas/Conversation" }
    ConversationMessagePageApiResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          required: [data]
          properties:
            data: { $ref: "#/components/schemas/ConversationMessagePage" }
    MessageAcceptedApiResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          required: [data]
          properties:
            data: { $ref: "#/components/schemas/MessageAccepted" }
    ConversationSnapshotApiResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          required: [data]
          properties:
            data: { $ref: "#/components/schemas/ConversationSnapshot" }
    StopAcceptedApiResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          required: [data]
          properties:
            data: { $ref: "#/components/schemas/StopAccepted" }
    CreateConversationRequest:
      type: object
      additionalProperties: false
      properties:
        installationId:
          $ref: "#/components/schemas/BusinessId"
          description: Owned enabled agent installation. Omission preserves the legacy GEO default.
        projectId:
          $ref: "#/components/schemas/BusinessId"
          description: Immutable owning project; independent of temporary message resource selection.
        title:
          type: [string, "null"]
          minLength: 1
          maxLength: 200
          pattern: ".*\\S.*"
          description: Omit or use null to create the default title.
    UpdateConversationRequest:
      type: object
      additionalProperties: false
      required: [version, title]
      properties:
        version: { $ref: "#/components/schemas/ResourceVersion" }
        title:
          type: string
          minLength: 1
          maxLength: 200
          pattern: ".*\\S.*"
    Conversation:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - selectedSpaceId
        - selectedProductId
        - activeConfirmationDraftId
        - version
        - lastMessageAt
        - createdAt
        - updatedAt
      properties:
        agentIdentity:
          $ref: "#/components/schemas/AgentIdentity"
          description: Frozen agent installation/version and owning project. Omitted when the platform feature is disabled.
        id: { $ref: "#/components/schemas/BusinessId" }
        title: { type: string, minLength: 1, maxLength: 200 }
        selectedSpaceId:
          oneOf:
            - $ref: "#/components/schemas/BusinessId"
            - type: "null"
        selectedProductId:
          oneOf:
            - $ref: "#/components/schemas/BusinessId"
            - type: "null"
        activeConfirmationDraftId:
          description: The draft id when exactly one unexpired Java task draft is waiting for confirmation in this conversation.
          oneOf:
            - $ref: "#/components/schemas/BusinessId"
            - type: "null"
        version: { $ref: "#/components/schemas/ResourceVersion" }
        lastMessageAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ConversationPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Conversation" }
    AttachmentReference:
      type: object
      additionalProperties: false
      required: [assetId]
      properties:
        assetId: { $ref: "#/components/schemas/BusinessId" }
    SendConversationMessageRequest:
      type: object
      additionalProperties: false
      required: [clientMessageId, content]
      properties:
        articlePreparationMode:
          type: string
          const: ARTICLE_FULL_V1
          description: Explicit current USER complete-article mode; only receives the requirement in this Run, creates no old title draft and carries no execution or publication authority.
        executionIntent:
          oneOf:
            - $ref: "#/components/schemas/MonitorExecutionIntent"
            - type: "null"
          description: Current USER single MONITOR_RUN selection. Not permission; no automatic admission without a valid grant, frozen scope and budget.
        resourceSelection:
          $ref: "#/components/schemas/ConversationResourceSelectionRequest"
        geoReportId:
          oneOf:
            - $ref: "#/components/schemas/BusinessId"
            - type: "null"
          description: >-
            Optional GEO report explicitly selected for this message only; never inherited from past text.
            Supports both new and existing conversations. Requires an unarchived terminal owned report in
            the selected active business space and, when selected, the same product; a bound conversation
            project must equal that space. Freezes that exact report, never substitutes the topic's latest
            report in later resource or answer-evidence reads during this Run.
            Cannot be combined with attachments. Reading existing evidence never starts monitoring or analysis.
        clientMessageId: { type: string, format: uuid }
        content:
          type: string
          minLength: 1
          maxLength: 16000
          pattern: ".*\\S.*"
        replyToMessageId:
          oneOf:
            - $ref: "#/components/schemas/BusinessId"
            - type: "null"
        draftId:
          type: "null"
          description: Paid draft continuation is not available in M2B-1.
        taskId:
          type: "null"
          description: Paid task continuation is not available in M2B-1.
        selectedSpaceId:
          oneOf:
            - $ref: "#/components/schemas/BusinessId"
            - type: "null"
          description: Business space used when contextSelectionMode is REPLACE. Omit for INHERIT or CLEAR.
        selectedProductId:
          oneOf:
            - $ref: "#/components/schemas/BusinessId"
            - type: "null"
          description: Optional product used when contextSelectionMode is REPLACE. Omit for INHERIT or CLEAR.
        contextSelectionMode:
          type: string
          enum: [INHERIT, REPLACE, CLEAR]
          description: >-
            Controls the conversation's persisted sidebar context. INHERIT keeps the current selection;
            when none exists, an already authorized fixed conversation project is inherited.
            REPLACE requires selectedSpaceId and stores the supplied selection, and CLEAR explicitly removes it.
            For backward compatibility, omission means REPLACE when either selected id is supplied and INHERIT otherwise.
        attachments:
          type: array
          maxItems: 8
          uniqueItems: true
          items: { $ref: "#/components/schemas/AttachmentReference" }
          default: []
          description: >-
            Owned READY IMAGE assets attached only to this current user message. Attachments are the source for this
            Run and do not replace or clear the conversation's persisted sidebar product selection.
    ConversationResourceSelectionRequest:
      type: object
      additionalProperties: false
      required: [candidateSetId, choiceId]
      properties:
        candidateSetId: { $ref: "#/components/schemas/BusinessId" }
        choiceId: { type: string, minLength: 1, maxLength: 128 }
      description: >-
        A server-issued choice for a one-turn authorized read. It cannot be combined with
        attachments, geoReportId or CLEAR, and never changes the persisted sidebar.
    ConversationResourceCandidate:
      type: object
      additionalProperties: false
      required: [choiceId, kind, resourceId, name, hasReport, exact]
      properties:
        choiceId: { type: string, minLength: 1, maxLength: 128 }
        kind: { type: string, enum: [SPACE, PRODUCT, GEO_TOPIC] }
        resourceId: { $ref: "#/components/schemas/BusinessId" }
        name: { type: string, minLength: 1, maxLength: 200 }
        spaceId: { $ref: "#/components/schemas/BusinessId" }
        spaceName: { type: string, minLength: 1, maxLength: 200 }
        hasReport: { type: boolean }
        exact: { type: boolean }
    ConversationResourceInteraction:
      type: object
      additionalProperties: false
      required: [interactionType, intent, question, missingFields, choices, candidateSetId, candidates, available]
      properties:
        interactionType: { type: string, const: RESOURCE_SELECTION }
        intent: { type: string, const: GENERAL }
        question: { type: string, minLength: 1, maxLength: 4000 }
        missingFields: { type: array, maxItems: 0, items: { type: string } }
        choices: { type: array, maxItems: 6, items: { type: string, maxLength: 200 } }
        candidateSetId: { $ref: "#/components/schemas/BusinessId" }
        candidates:
          type: array
          minItems: 1
          maxItems: 6
          items: { $ref: "#/components/schemas/ConversationResourceCandidate" }
        available: { type: boolean }
      description: Server-projected candidates. Successful READ alone consumes a selection; Run completion does not.
    ConversationClarificationInteraction:
      type: object
      additionalProperties: false
      required: [interactionType, intent, question, missingFields, choices]
      properties:
        interactionType: { type: string, const: CLARIFICATION }
        intent: { type: string, enum: [GENERAL, GEO, IMAGE, VIDEO, ARTICLE, AMBIGUOUS_CONFIRMATION] }
        question: { type: string, minLength: 1, maxLength: 4000 }
        missingFields: { type: array, maxItems: 50, items: { type: string, maxLength: 128 } }
        choices: { type: array, maxItems: 50, items: { type: string, maxLength: 500 } }
    ConversationArticlePreparationReference:
      type: object
      additionalProperties: false
      required: [preparationId, articleId]
      properties:
        preparationId: { $ref: "#/components/schemas/BusinessId" }
        articleId: { $ref: "#/components/schemas/BusinessId" }
      description: Server-owned full-article progress/result reference. Poll getArticleFullPreparation; never infer completion from the existence of this reference.
    MessageAccepted:
      type: object
      additionalProperties: false
      required: [messageId, runId, status]
      properties:
        messageId: { $ref: "#/components/schemas/BusinessId" }
        runId: { type: string, format: uuid }
        status:
          type: string
          enum: [QUEUED, STARTING, RUNNING, COMPLETED, FAILED, STOP_REQUESTED, STOPPED]
    ConversationMessage:
      type: object
      additionalProperties: false
      required:
        - id
        - conversationId
        - role
        - contentType
        - content
        - replyToMessageId
        - runId
        - attachmentAssetIds
        - sequence
        - status
        - createdAt
        - updatedAt
      properties:
        id: { $ref: "#/components/schemas/BusinessId" }
        conversationId: { $ref: "#/components/schemas/BusinessId" }
        role: { type: string, enum: [USER, ASSISTANT, SYSTEM_EVENT] }
        contentType: { type: string, enum: [TEXT, INTERACTION, SYSTEM_EVENT] }
        content:
          type: object
          additionalProperties: true
          properties:
            interaction:
              oneOf:
                - $ref: "#/components/schemas/ConversationClarificationInteraction"
                - $ref: "#/components/schemas/ConversationResourceInteraction"
            geoContext:
              $ref: "#/components/schemas/ConversationMessageGeoContext"
            businessOutcome:
              $ref: "#/components/schemas/ConversationBusinessOutcome"
            articlePreparation:
              $ref: "#/components/schemas/ConversationArticlePreparationReference"
          description: Optional Java-verified businessOutcome describes this chat reply, independently of technical Run completion. Missing historical values remain unknown. geoContext is frozen evidence and does not authorize execution. articlePreparation is persisted only from an owned admitted full-article record; it is a progress/result reference, not a publication authorization.
        replyToMessageId:
          oneOf:
            - $ref: "#/components/schemas/BusinessId"
            - type: "null"
        runId: { type: [string, "null"], format: uuid }
        attachmentAssetIds:
          type: array
          maxItems: 8
          uniqueItems: true
          items: { $ref: "#/components/schemas/BusinessId" }
        sequence: { type: integer, format: int64, minimum: 1 }
        status: { type: string, enum: [STREAMING, COMPLETED, FAILED, STOPPED] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ConversationBusinessOutcome:
      type: object
      additionalProperties: false
      required: [schemaVersion, status]
      properties:
        schemaVersion: { type: integer, const: 1 }
        status: { type: string, enum: [ANSWERED, NEEDS_INPUT, DRAFT_READY, PARTIAL, FAILED] }
        reasonCode:
          type: string
          enum: [INPUT_REQUIRED, TASK_DRAFT_PROPOSED, READONLY_PLANNER_UNAVAILABLE, READONLY_PLAN_INVALID,
                 READONLY_EVIDENCE_UNAVAILABLE, READONLY_PARTIAL_EVIDENCE, READONLY_SYNTHESIS_UNAVAILABLE, GEO_CONTEXT_UNAVAILABLE,
                 TASK_PARAMETERS_INVALID, TASK_PREPARATION_REJECTED, RESPONSE_PROTOCOL_INVALID, AGENT_RUN_FAILED]
        failureStage: { type: string, enum: [LOOKUP, PLAN, TOOL, SYNTHESIS, PROTOCOL] }
    ConversationMessageGeoContext:
      type: object
      additionalProperties: false
      required: [status, selectionSource, report, topicChoices, topicsTruncated]
      properties:
        status: { type: string, enum: [READY, NEEDS_SCOPE, NEEDS_TOPIC, NO_REPORT, UNAVAILABLE] }
        selectionSource: { type: [string, "null"], enum: [EXPLICIT_REPORT, AUTO_SINGLE_TOPIC, null] }
        report:
          oneOf:
            - $ref: "#/components/schemas/ConversationMessageGeoReport"
            - type: "null"
        topicChoices:
          type: array
          maxItems: 6
          items: { $ref: "#/components/schemas/ConversationMessageGeoTopicChoice" }
        topicsTruncated: { type: boolean }
    ConversationMessageGeoReport:
      type: object
      additionalProperties: false
      required: [reportId, topicId, title, spaceId, productId, generatedAt, canCreateArticle, articleUnavailableReason]
      properties:
        reportId: { $ref: "#/components/schemas/BusinessId" }
        topicId: { $ref: "#/components/schemas/BusinessId" }
        title: { type: string, maxLength: 100 }
        spaceId: { $ref: "#/components/schemas/BusinessId" }
        productId:
          oneOf:
            - $ref: "#/components/schemas/BusinessId"
            - type: "null"
        generatedAt: { type: [string, "null"], format: date-time }
        canCreateArticle:
          type: boolean
          description: Eligibility when this Run was created; clicking the existing article-workflow endpoint revalidates ownership, report state and current scope. This does not confirm a paid task or promise GEO impact.
        observationId:
          $ref: "#/components/schemas/BusinessId"
          description: Optional server-issued successful resource READ identity, frozen to this report and source. Never a model-generated reference.
        available:
          type: boolean
          description: Current action availability for a resource-backed report, recomputed on message reads without changing historical source metadata. Missing for legacy reports.
        articleUnavailableReason:
          type: [string, "null"]
          enum: [REPORT_NOT_TERMINAL, REPORT_ARCHIVED, REPORT_ANALYSIS_UNAVAILABLE, null]
    ConversationMessageGeoTopicChoice:
      type: object
      additionalProperties: false
      required: [topicId, spaceId, productId, name, href]
      properties:
        topicId: { $ref: "#/components/schemas/BusinessId" }
        spaceId: { $ref: "#/components/schemas/BusinessId" }
        productId:
          oneOf:
            - $ref: "#/components/schemas/BusinessId"
            - type: "null"
        name: { type: string, maxLength: 100 }
        href: { type: string, pattern: '^/app/geo\?topicId=[1-9][0-9]{0,18}$' }
    ConversationMessagePage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ConversationMessage" }
        nextCursor:
          type: [string, "null"]
          maxLength: 19
          pattern: "^[1-9][0-9]{0,18}$"
    ConversationSnapshot:
      type: object
      additionalProperties: false
      required: [messages, nextBeforeSequence, highWatermark, activeRun]
      properties:
        messages:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/ConversationMessage" }
          description: Latest page in ascending message sequence, including committed partial answers.
        nextBeforeSequence: { type: [string, "null"], maxLength: 19, pattern: "^[1-9][0-9]{0,18}$" }
        highWatermark: { type: integer, format: int64, minimum: 0 }
        activeRun:
          oneOf:
            - $ref: "#/components/schemas/MessageAccepted"
            - type: "null"
    StopConversationRequest:
      type: object
      additionalProperties: false
      required: [expectedRunId]
      properties:
        expectedRunId: { type: string, format: uuid }
    StopAccepted:
      type: object
      additionalProperties: false
      required: [runId, accepted, status]
      properties:
        runId: { type: string, format: uuid }
        accepted: { type: boolean }
        status:
          type: string
          enum: [RUNNING, STOP_REQUESTED, STOPPED, COMPLETED, FAILED]
    ConversationEvent:
      type: object
      additionalProperties: false
      required: [eventId, sequence, occurredAt, conversationId, messageId, taskId, payload]
      properties:
        eventId: { $ref: "#/components/schemas/BusinessId" }
        sequence: { type: integer, format: int64, minimum: 1 }
        occurredAt: { type: string, format: date-time }
        conversationId: { $ref: "#/components/schemas/BusinessId" }
        messageId:
          oneOf:
            - $ref: "#/components/schemas/BusinessId"
            - type: "null"
        taskId:
          oneOf:
            - $ref: "#/components/schemas/BusinessId"
            - type: "null"
        payload:
          type: object
          additionalProperties: true
          description: >-
            message.delta payloads use MessageDeltaPayload: append by default; replace=true
            replaces the entire current assistant text, including clearing it when delta is empty.
            Replacements are persisted and replayed in the same sequence as append events.
            task.* events always include taskId, status, and deliveryKind=BACKGROUND_TASK;
            GEO completion also includes its reportId and durable geo-report resultRef.
            message.completed may include articlePreparation (ConversationArticlePreparationReference),
            identical to the persisted assistant content reference even if the free chat Run failed or stopped.
      description: >-
        SSE event names are message.start, message.delta, message.completed,
        interaction.required, agent.progress, draft.created, paid-task lifecycle events, or heartbeat.
        A Python proposal remains non-authoritative until Java validates and prices it.
        agent.progress payloads use AgentProgressPayload and are persisted for sequence-based replay.
        Paid-task lifecycle events have messageId=null and a non-null taskId, so clients must update
        a background task card instead of treating completion as a reply to the latest chat message.
    MessageDeltaPayload:
      type: object
      additionalProperties: false
      required: [messageId, delta]
      properties:
        messageId: { $ref: "#/components/schemas/BusinessId" }
        delta: { type: string, maxLength: 16000 }
        replace:
          type: boolean
          default: false
          description: >-
            False or omitted appends delta. True replaces the entire current assistant text;
            an empty delta clears an obsolete preview before a tool call or protocol repair.
            Only the owning active Run may replace its response. This does not start a new Run.
      allOf:
        - if:
            required: [replace]
            properties:
              replace: { const: true }
          else:
            properties:
              delta: { minLength: 1 }
    AgentProgressPayload:
      type: object
      additionalProperties: false
      required: [runId, messageId, stageCode, status, ordinal, elapsedMs, current, total]
      properties:
        runId: { $ref: "#/components/schemas/AgentRunId" }
        messageId: { $ref: "#/components/schemas/BusinessId" }
        stageCode:
          type: string
          enum: [UNDERSTANDING_REQUEST, LOADING_BUSINESS_CONTEXT, LOADING_PRODUCT_CONTEXT,
                 LOADING_REFERENCE_ASSETS, ROUTING_INTENT, PLANNING_WORKFLOW,
                 RUNNING_SAFE_TOOL, SEARCHING_WEB, PREPARING_TASK_DRAFT, COMPOSING_RESPONSE]
        status: { type: string, enum: [RUNNING, SUCCEEDED, FAILED] }
        ordinal: { type: integer, format: int32, minimum: 1, maximum: 32 }
        elapsedMs: { type: integer, format: int64, minimum: 0 }
        current: { type: [integer, "null"], format: int64, minimum: 0 }
        total: { type: [integer, "null"], format: int64, minimum: 0 }
    Page:
      type: object
      additionalProperties: false
      required: [items, page, size, total, hasNext]
      properties:
        items: { type: array, items: {} }
        page: { type: integer, format: int32, minimum: 1 }
        size: { type: integer, format: int32, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }
        hasNext: { type: boolean }
    BusinessSpaceName:
      type: string
      minLength: 1
      maxLength: 100
      pattern: ".*\\S.*"
      description: Trimmed on write and compared by a shared normalized value within the current user.
    BrandName:
      type: string
      minLength: 1
      maxLength: 100
      pattern: ".*\\S.*"
    BrandAlias:
      type: string
      minLength: 1
      maxLength: 100
      pattern: ".*\\S.*"
    ProductName:
      type: string
      minLength: 1
      maxLength: 150
      pattern: ".*\\S.*"
      description: Trimmed and unique by normalized value within an operating space.
    ProductAliases:
      type: array
      maxItems: 50
      uniqueItems: true
      items:
        type: string
        minLength: 1
        maxLength: 150
        pattern: ".*\\S.*"
    NullableCategory:
      type: [string, "null"]
      minLength: 1
      maxLength: 100
    NullableModelSpec:
      type: [string, "null"]
      minLength: 1
      maxLength: 150
    ProductSellingPoints:
      type: array
      maxItems: 50
      uniqueItems: true
      items: { type: string, minLength: 1, maxLength: 500 }
    NullableProductSellingPoints:
      type: [array, "null"]
      maxItems: 50
      items: { type: string, minLength: 1, maxLength: 500 }
    ProductParameters:
      type: object
      maxProperties: 100
      propertyNames: { minLength: 1, maxLength: 100 }
      additionalProperties: { type: string, maxLength: 1000 }
    NullableProductParameters:
      type: [object, "null"]
      maxProperties: 100
      additionalProperties: { type: string, maxLength: 1000 }
    ProductAudience:
      type: array
      maxItems: 50
      uniqueItems: true
      items: { type: string, minLength: 1, maxLength: 200 }
    NullableProductAudience:
      type: [array, "null"]
      maxItems: 50
      items: { type: string, minLength: 1, maxLength: 200 }
    ProductUsageScenarios:
      type: array
      maxItems: 50
      uniqueItems: true
      items: { type: string, minLength: 1, maxLength: 200 }
    NullableProductUsageScenarios:
      type: [array, "null"]
      maxItems: 50
      items: { type: string, minLength: 1, maxLength: 200 }
    ProductProhibitedClaims:
      type: array
      maxItems: 50
      uniqueItems: true
      items: { type: string, minLength: 1, maxLength: 500 }
    NullableProductProhibitedClaims:
      type: [array, "null"]
      maxItems: 50
      items: { type: string, minLength: 1, maxLength: 500 }
    CompetitorName:
      type: string
      minLength: 1
      maxLength: 150
      pattern: ".*\\S.*"
      description: Trimmed and unique by normalized value within an operating space.
    CompetitorAliases:
      type: array
      maxItems: 50
      uniqueItems: true
      items:
        type: string
        minLength: 1
        maxLength: 150
        pattern: ".*\\S.*"
    CompetitorType:
      type: string
      enum: [DIRECT, INDIRECT, SUBSTITUTE]
    CompetitorStatus:
      type: string
      enum: [ACTIVE, INACTIVE]
    NullableCompetitorDescription:
      type: [string, "null"]
      minLength: 1
      maxLength: 1000
    ResourceVersion:
      type: integer
      format: int32
      minimum: 1
      maximum: 2147483647
    NullableBusinessId:
      type: [string, "null"]
      maxLength: 19
      pattern: "^[1-9][0-9]{0,18}$"
      description: Snowflake identifiers are serialized as strings; null means no asset is attached.
    BusinessId:
      type: string
      maxLength: 19
      pattern: "^[1-9][0-9]{0,18}$"
    AgentRunId:
      type: string
      format: uuid
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
      description: Canonical lowercase UUID used by an Agent Run.
    TraceId:
      type: string
      pattern: "^[0-9a-f]{32}$"
    ImageTaskParameters:
      type: object
      additionalProperties: false
      required: [requestText, mode, agentSummary, sourceMode, referenceAssetIds, aspectRatio, count]
      description: >-
        Current IMAGE proposal schema shared by Mock and real provider execution. Pricing is
        never accepted here; Java supplies the explicitly configured test quote. PREVIOUS_IMAGE_RESULT
        is emitted only after native chat admission: Java resolves and freezes the same-user,
        same-conversation previous READY image; clients and models never select its asset ID.
        PREVIOUS_USER_ATTACHMENT similarly freezes the immediately preceding USER message's sole
        READY image and its message provenance; it never skips an intervening attachment-free USER message.
      properties:
        requestText: { type: string, minLength: 1, maxLength: 16000 }
        mode: { type: string, const: AGENT_ASSISTED }
        agentSummary: { type: string, minLength: 1, maxLength: 1000 }
        sourceMode: { type: string, enum: [CATALOG_PRODUCT, CURRENT_ATTACHMENTS, TEXT_ONLY, SELECTED_ASSETS, REGION_EDIT, GEO_REPORT, PREVIOUS_IMAGE_RESULT, PREVIOUS_USER_ATTACHMENT] }
        referenceAssetIds: { type: array, minItems: 0, maxItems: 3, uniqueItems: true, items: { $ref: "#/components/schemas/BusinessId" }, description: Empty only for TEXT_ONLY; REGION_EDIT requires exactly one owned base image. }
        maskAssetId: { $ref: "#/components/schemas/BusinessId", description: REGION_EDIT only. Owned opaque binary black/white PNG, same dimensions as base; black pixels remain unchanged. }
        geoReportId: { $ref: "#/components/schemas/BusinessId", description: "GEO_REPORT only. Java validates owner, space, product, real synthesis and successful evidence." }
        geoRecommendationId: { type: string, pattern: "^[1-9][0-9]{0,18}:recommendation:[1-9][0-9]{0,2}$", description: "Optional GEO_REPORT recommendation from the same report, validated and frozen by Java." }
        creativePlan: { $ref: "#/components/schemas/GeoCreativePlan", description: "Required for GEO_REPORT; must match report, task type, recommendation, scene and successful evidence." }
        scene: { type: string, minLength: 1, maxLength: 1000 }
        style: { type: string, minLength: 1, maxLength: 256 }
        lighting: { type: string, minLength: 1, maxLength: 256 }
        aspectRatio: { type: string, enum: ["1:1", "3:4", "4:3", "9:16", "16:9"] }
        count: { type: integer, minimum: 1, maximum: 4, description: Candidate images requested; Java quotes per image and settles only permanently stored successes. }
        negativePrompt: { type: string, minLength: 1, maxLength: 1000 }
        visualBrief: { $ref: "#/components/schemas/CommerceImageVisualBrief", description: Optional art-direction plan frozen into this draft; never trusted as product facts or pricing. }
      allOf:
        - oneOf:
            - properties:
                sourceMode: { const: TEXT_ONLY }
                referenceAssetIds: { maxItems: 0 }
              not: { anyOf: [{ required: [maskAssetId] }, { required: [geoReportId] }, { required: [geoRecommendationId] }, { required: [creativePlan] }] }
            - properties:
                sourceMode: { enum: [CATALOG_PRODUCT, CURRENT_ATTACHMENTS, SELECTED_ASSETS] }
                referenceAssetIds: { minItems: 1, maxItems: 3 }
              not: { anyOf: [{ required: [maskAssetId] }, { required: [geoReportId] }, { required: [geoRecommendationId] }, { required: [creativePlan] }] }
            - properties:
                sourceMode: { const: PREVIOUS_IMAGE_RESULT }
                referenceAssetIds: { minItems: 1, maxItems: 1 }
              not: { anyOf: [{ required: [maskAssetId] }, { required: [geoReportId] }, { required: [geoRecommendationId] }, { required: [creativePlan] }] }
            - properties:
                sourceMode: { const: PREVIOUS_USER_ATTACHMENT }
                referenceAssetIds: { minItems: 1, maxItems: 1 }
              not: { anyOf: [{ required: [maskAssetId] }, { required: [geoReportId] }, { required: [geoRecommendationId] }, { required: [creativePlan] }] }
            - required: [geoReportId, creativePlan, scene]
              properties:
                sourceMode: { const: GEO_REPORT }
                referenceAssetIds: { minItems: 0, maxItems: 3 }
              not: { required: [maskAssetId] }
            - required: [maskAssetId]
              properties:
                sourceMode: { const: REGION_EDIT }
                referenceAssetIds: { minItems: 1, maxItems: 1 }
                requestText: { maxLength: 800 }
              not: { anyOf: [{ required: [geoReportId] }, { required: [geoRecommendationId] }, { required: [creativePlan] }] }
    ImageTaskRequestParameters:
      description: >-
        FORM create/revise input. PREVIOUS_IMAGE_RESULT and PREVIOUS_USER_ATTACHMENT are intentionally
        unavailable because only Java native-chat admission may authoritatively resolve and freeze them.
      allOf:
        - $ref: "#/components/schemas/ImageTaskParameters"
        - type: object
          properties:
            sourceMode: { type: string, enum: [CATALOG_PRODUCT, CURRENT_ATTACHMENTS, TEXT_ONLY, SELECTED_ASSETS, REGION_EDIT, GEO_REPORT] }
    CommerceImageVisualBrief:
      type: object
      additionalProperties: false
      required: [version, platform, placement, visualFocus, composition, background, lighting, textPolicy, copyLines]
      properties:
        version: { type: string, const: commerce-image-v1 }
        platform: { type: string, enum: [GENERAL, PINDUODUO, TAOBAO, JD, DOUYIN, XIAOHONGSHU] }
        placement: { type: string, enum: [MAIN_IMAGE, DETAIL_IMAGE, SOCIAL_COVER, POSTER] }
        visualFocus: { type: string, minLength: 1, maxLength: 160 }
        composition: { type: string, minLength: 1, maxLength: 240 }
        background: { type: string, minLength: 1, maxLength: 180 }
        lighting: { type: string, minLength: 1, maxLength: 160 }
        textPolicy: { type: string, enum: [NONE, USER_SUPPLIED] }
        copyLines: { type: array, minItems: 0, maxItems: 3, items: { type: string, minLength: 1, maxLength: 40 } }
      oneOf:
        - properties:
            textPolicy: { const: NONE }
            copyLines: { maxItems: 0 }
        - properties:
            textPolicy: { const: USER_SUPPLIED }
            copyLines: { minItems: 1 }
    VideoTaskParameters:
      type: object
      additionalProperties: false
      required: [requestText, mode, agentSummary, sourceMode, referenceAssetIds, scene, durationSeconds, aspectRatio,
                 resolution, audio, seed, promptExtend, watermark]
      description: >-
        Explicit creative source. TEXT_ONLY has no references; PRODUCT_MATERIALS uses 1-3 product
        reference images; other modes use one first frame. GEO_REPORT freezes an owned terminal
        report and product facts on Java. PREVIOUS_IMAGE_RESULT is emitted only after native chat
        admission: Java resolves and freezes the same-user, same-conversation previous READY image as
        the first frame; clients and models never select its asset ID. Provider, model, price, points,
        and identity are never accepted.
        PREVIOUS_USER_ATTACHMENT freezes the immediately preceding USER message's sole READY image;
        it never searches past an intervening attachment-free USER message.
      properties:
        requestText: { type: string, minLength: 1, maxLength: 16000 }
        mode: { type: string, const: AGENT_ASSISTED }
        agentSummary: { type: string, minLength: 1, maxLength: 1000 }
        sourceMode: { type: string, enum: [CATALOG_PRODUCT, CURRENT_ATTACHMENTS, TEXT_ONLY, SELECTED_ASSETS, PRODUCT_MATERIALS, GEO_REPORT, PREVIOUS_IMAGE_RESULT, PREVIOUS_USER_ATTACHMENT] }
        referenceAssetIds: { type: array, minItems: 0, maxItems: 3, uniqueItems: true, items: { $ref: "#/components/schemas/BusinessId" }, description: Source-dependent references validated by Java; never silently truncate or fall back. }
        geoReportId: { $ref: "#/components/schemas/BusinessId", description: Required only for GEO_REPORT; same user, space and product, completed report with actual successful samples. }
        geoRecommendationId: { type: string, pattern: "^[1-9][0-9]{0,18}:recommendation:[1-9][0-9]{0,2}$" }
        creativePlan: { $ref: "#/components/schemas/GeoCreativePlan", description: Required for GEO_REPORT and revalidated at confirmation. }
        scene: { type: string, minLength: 1, maxLength: 1000 }
        style: { type: string, minLength: 1, maxLength: 256 }
        durationSeconds: { type: integer, minimum: 2, maximum: 30, default: 5 }
        aspectRatio: { type: string, enum: [adaptive, "16:9", "4:3", "1:1", "3:4", "9:16"], default: adaptive }
        cameraMotion: { type: string, minLength: 1, maxLength: 256 }
        resolution: { type: string, enum: [480P, 720P, 1080P], default: 720P }
        audio: { type: boolean, default: false }
        seed: { type: integer, minimum: -1, maximum: 2147483647, default: -1 }
        promptExtend: { type: boolean, default: true }
        watermark: { type: boolean, default: false }
      allOf:
        - oneOf:
            - properties:
                sourceMode: { const: TEXT_ONLY }
                referenceAssetIds: { maxItems: 0 }
              not: { anyOf: [{ required: [geoReportId] }, { required: [geoRecommendationId] }, { required: [creativePlan] }] }
            - properties:
                sourceMode: { enum: [CATALOG_PRODUCT, CURRENT_ATTACHMENTS, SELECTED_ASSETS, PREVIOUS_IMAGE_RESULT, PREVIOUS_USER_ATTACHMENT] }
                referenceAssetIds: { minItems: 1, maxItems: 1 }
              not: { anyOf: [{ required: [geoReportId] }, { required: [geoRecommendationId] }, { required: [creativePlan] }] }
            - properties:
                sourceMode: { const: PRODUCT_MATERIALS }
                referenceAssetIds: { minItems: 1, maxItems: 3 }
              not: { anyOf: [{ required: [geoReportId] }, { required: [geoRecommendationId] }, { required: [creativePlan] }] }
            - required: [geoReportId, creativePlan]
              properties:
                sourceMode: { const: GEO_REPORT }
                referenceAssetIds: { minItems: 1, maxItems: 1 }
    VideoTaskRequestParameters:
      description: >-
        FORM create/revise input. PREVIOUS_IMAGE_RESULT and PREVIOUS_USER_ATTACHMENT are intentionally
        unavailable because only Java native-chat admission may authoritatively resolve and freeze them.
      allOf:
        - $ref: "#/components/schemas/VideoTaskParameters"
        - type: object
          properties:
            sourceMode: { type: string, enum: [CATALOG_PRODUCT, CURRENT_ATTACHMENTS, TEXT_ONLY, SELECTED_ASSETS, PRODUCT_MATERIALS, GEO_REPORT] }
    GeoCreativePlanRequest:
      type: object
      additionalProperties: false
      required: [taskType, productId]
      properties:
        taskType: { type: string, enum: [IMAGE, VIDEO] }
        productId: { $ref: "#/components/schemas/BusinessId" }
        recommendationId: { type: string, pattern: "^[1-9][0-9]{0,18}:recommendation:[1-9][0-9]{0,2}$" }
        userDirection: { type: string, maxLength: 500 }
    GeoCreativePlan:
      type: object
      additionalProperties: false
      required: [version, taskType, reportId, recommendationId, opportunity, audience, message,
                 evidenceKeys, scene, visualFocus, shotBeats, limitations, proof]
      description: >-
        Frozen user-reviewed plan. Java validates each evidence key against successful observations in the
        owned report and requires scene to equal the draft scene. The opaque server proof binds account,
        space, product facts and plan; changes require generating a new plan. This replaces raw GEO prompts.
      properties:
        version: { type: string, const: geo-visual-plan-v1 }
        taskType: { type: string, enum: [IMAGE, VIDEO] }
        reportId: { $ref: "#/components/schemas/BusinessId" }
        recommendationId: { type: [string, "null"], pattern: "^[1-9][0-9]{0,18}:recommendation:[1-9][0-9]{0,2}$" }
        opportunity: { type: string, minLength: 1, maxLength: 300 }
        audience: { type: string, minLength: 1, maxLength: 180 }
        message: { type: string, minLength: 1, maxLength: 300 }
        evidenceKeys: { type: array, minItems: 1, maxItems: 8, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 80 } }
        scene: { type: string, minLength: 1, maxLength: 800 }
        visualFocus: { type: string, minLength: 1, maxLength: 300 }
        shotBeats: { type: array, maxItems: 3, items: { type: string, minLength: 1, maxLength: 240 }, description: "Empty for IMAGE; 2–3 beats for VIDEO." }
        limitations: { type: array, minItems: 1, maxItems: 4, items: { type: string, minLength: 1, maxLength: 240 } }
        proof: { type: string, pattern: "^v1\\.[A-Za-z0-9_-]{43}$", description: "Opaque server-issued proof; return unchanged in GEO_REPORT draft." }
    GeoCreativePlanEvidence:
      type: object
      additionalProperties: false
      required: [key, questionText, platformCode, answerExcerpt]
      properties:
        key: { type: string, minLength: 1, maxLength: 80 }
        questionText: { type: string, maxLength: 300 }
        platformCode: { type: string, maxLength: 32 }
        answerExcerpt: { type: string, minLength: 1, maxLength: 500 }
    GeoCreativePlanResponse:
      type: object
      additionalProperties: false
      required: [reportId, recommendationId, plan, evidence]
      properties:
        reportId: { $ref: "#/components/schemas/BusinessId" }
        recommendationId: { type: [string, "null"], pattern: "^[1-9][0-9]{0,18}:recommendation:[1-9][0-9]{0,2}$" }
        plan: { $ref: "#/components/schemas/GeoCreativePlan" }
        evidence: { type: array, minItems: 1, maxItems: 8, items: { $ref: "#/components/schemas/GeoCreativePlanEvidence" } }
    GeoCreativePlanApiResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          required: [data]
          properties: { data: { $ref: "#/components/schemas/GeoCreativePlanResponse" } }
    GeoTaskParameters:
      type: object
      additionalProperties: false
      required: [mode, topicId, questionIds, platformCodes, sampleMode, region]
      description: Java validates ownership and computes the test quote from the frozen sampling matrix.
      properties:
        mode: { type: string, const: MONITOR_RUN }
        topicId: { $ref: "#/components/schemas/BusinessId" }
        questionIds:
          type: array
          minItems: 3
          maxItems: 10
          uniqueItems: true
          items: { $ref: "#/components/schemas/BusinessId" }
        platformCodes:
          type: array
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items: { type: string, enum: [DOUBAO, DEEPSEEK, QWEN, WENXIN, KIMI, YUANBAO, ZHIPU] }
        sampleMode: { type: string, enum: [STANDARD, DEEP] }
        region: { type: string, minLength: 1, maxLength: 100 }
    GeoDiscoveryTaskParameters:
      type: object
      additionalProperties: false
      required: [requestText, mode, agentSummary, topic, region, questions, platformCodes, sampleMode]
      description: >-
        Editable GEO discovery proposal. Java freezes configured platforms and pricing when the draft is
        accepted, then atomically creates the Topic and Questions and converts the proposal to a MONITOR_RUN
        task only after the user confirms it. Browser create/revise requests accept this shape and re-quote
        the selected questions and currently configured platforms; revisions invalidate the old confirmation.
      properties:
        requestText: { type: string, minLength: 1, maxLength: 16000 }
        mode: { type: string, const: QUESTION_DISCOVERY }
        agentSummary: { type: string, minLength: 1, maxLength: 1000 }
        topic: { type: string, minLength: 1, maxLength: 100 }
        audience: { type: string, minLength: 1, maxLength: 500 }
        region: { type: string, minLength: 1, maxLength: 100 }
        questions:
          type: array
          minItems: 3
          maxItems: 10
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 1000 }
        platformCodes:
          type: array
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items: { type: string, enum: [DOUBAO, DEEPSEEK, QWEN, WENXIN, KIMI, YUANBAO, ZHIPU] }
        sampleMode: { type: string, const: STANDARD }
    ArticleOutlineItem:
      type: object
      additionalProperties: false
      required: [key, sequence, level, heading, brief]
      properties:
        key: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,63}$" }
        sequence: { type: integer, minimum: 1, maximum: 100 }
        level: { type: integer, minimum: 1, maximum: 6 }
        heading: { type: string, minLength: 1, maxLength: 300 }
        brief: { type: [string, "null"], maxLength: 1000 }
    ArticleCreativePlanSection:
      type: object
      additionalProperties: false
      required: [key, sequence, level, heading, brief]
      properties:
        key: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,63}$" }
        sequence: { type: integer, minimum: 1, maximum: 12 }
        level: { type: integer, minimum: 1, maximum: 6 }
        heading: { type: string, minLength: 1, maxLength: 300 }
        brief: { type: string, minLength: 1, maxLength: 1000 }
    ArticleCreativePlan:
      type: object
      additionalProperties: false
      required: [summary, coreMessage, targetAudience, sections, tone, targetLength, targetPlatform, riskNotes]
      properties:
        summary: { type: string, minLength: 1, maxLength: 1000 }
        coreMessage: { type: string, minLength: 1, maxLength: 2000 }
        targetAudience: { type: string, minLength: 1, maxLength: 1000 }
        sections:
          type: array
          minItems: 2
          maxItems: 12
          items: { $ref: "#/components/schemas/ArticleCreativePlanSection" }
        tone: { type: string, pattern: "^[A-Z][A-Z0-9_]{0,63}$" }
        targetLength: { type: string, enum: [SHORT, MEDIUM, LONG] }
        targetPlatform: { type: [string, "null"], maxLength: 100 }
        riskNotes:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 500 }
    ArticleTaskParameters:
      type: object
      additionalProperties: false
      required: [mode, articleId, articleVersion, brief, selectedTitle, confirmedOutline, confirmedPlan,
                 rewriteInstruction, rewriteBlockIds, targetLength, tone, targetPlatform, sourceAssetIds, geoReportId]
      properties:
        mode: { type: string, enum: [TITLE, OUTLINE, BODY, REWRITE] }
        articleId: { $ref: "#/components/schemas/BusinessId" }
        articleVersion: { type: integer, minimum: 1 }
        brief: { type: string, minLength: 1, maxLength: 4000 }
        selectedTitle: { type: [string, "null"], maxLength: 300 }
        confirmedOutline: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/ArticleOutlineItem" } }
        confirmedPlan:
          oneOf:
            - $ref: "#/components/schemas/ArticleCreativePlan"
            - type: "null"
        rewriteInstruction: { type: [string, "null"], maxLength: 4000 }
        rewriteBlockIds:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,63}$" }
        targetLength: { type: string, enum: [SHORT, MEDIUM, LONG] }
        tone: { type: string, pattern: "^[A-Z][A-Z0-9_]{0,63}$" }
        targetPlatform: { type: [string, "null"], maxLength: 100 }
        sourceAssetIds: { type: array, maxItems: 10, uniqueItems: true, items: { $ref: "#/components/schemas/BusinessId" } }
        geoReportId: { $ref: "#/components/schemas/NullableBusinessId" }
        geoRecommendationId: { type: [string, "null"], maxLength: 128 }
      description: >-
        Java enforces stage dependencies: TITLE has no selected title, outline, or plan; OUTLINE requires the
        exact confirmed title; BODY requires the exact confirmed creative plan and a confirmedOutline identical
        to plan.sections; REWRITE additionally requires a non-empty instruction and authorized rewriteBlockIds.
        The quote and Provider are never supplied by the browser.
    MediaTaskParameters:

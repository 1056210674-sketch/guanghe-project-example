        entryType: { type: string, maxLength: 64 }
        businessType: { type: string, maxLength: 64 }
        businessId: { $ref: "#/components/schemas/BusinessId" }
        operatorId:
          type: [string, "null"]
          maxLength: 19
          description: Who performed the operation. Not a business-type discriminator.
        reason: { type: string, maxLength: 500 }
        createdAt: { type: string, format: date-time }
    AdminPointLedgerPage:
      type: object
      additionalProperties: false
      required: [items, page, size, total, hasNext]

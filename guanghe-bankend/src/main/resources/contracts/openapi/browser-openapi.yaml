      required: ["id","topicId","name","entityKind","status","version","competitorId","existingCompetitorId","firstReportId","lastReportId","firstSeenAt","lastSeenAt","evidence","learningSuggestions"]
      properties: {"id":{"$ref":"#/components/schemas/BusinessId"},"topicId":{"$ref":"#/components/schemas/BusinessId"},"name":{"type":"string"},"entityKind":{"type":"string","enum":["BRAND","PRODUCT"]},"status":{"type":"string","enum":["PENDING","CONFIRMED","IGNORED"]},"version":{"type":"integer","minimum":1},"competitorId":{"type":["string","null"]},"existingCompetitorId":{"type":["string","null"]},"firstReportId":{"$ref":"#/components/schemas/BusinessId"},"lastReportId":{"$ref":"#/components/schemas/BusinessId"},"firstSeenAt":{"type":"string","format":"date-time"},"lastSeenAt":{"type":"string","format":"date-time"},"evidence":{"type":"array","maxItems":2,"items":{"$ref":"#/components/schemas/GeoCompetitiveEvidence"}},"learningSuggestions":{"type":"array","maxItems":2,"items":{"type":"string"}}}
    GeoCompetitiveEntity:

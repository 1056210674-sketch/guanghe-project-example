        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/admin/agent-versions/{bundleVersion}/evaluations:
    parameters:
      - { name: bundleVersion, in: path, required: true, schema: { $ref: "#/components/schemas/AgentBundleVersion" } }
    get:
      operationId: listAdminAgentVersionEvaluations
      summary: Read registered evaluation evidence for one Agent bundle version.
      description: |
        No authoritative evaluation publication source exists yet. This version returns
        NOT_REGISTERED and an empty page rather than reading developer-local reports or inventing a
        score. The endpoint freezes that absence as explicit evidence for future compatible rollout.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200": { description: Evaluation evidence availability returned., content: { application/json: { schema: { $ref: "#/components/schemas/AdminAgentEvaluationPageApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/workflow-plans:
    get:
      operationId: listWorkflowPlans
      summary: List the current USER's persisted workflow plans.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [DRAFT, WAITING_CONFIRMATION, CONFIRMED, ABANDONED] }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Size" }
      responses:
        "200": { description: Workflow plan page returned., content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowPlanPageApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/workflow-plans/{planId}:
    parameters:
      - name: planId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/BusinessId" }
    get:
      operationId: getWorkflowPlan
      summary: Return one safe persisted workflow plan projection.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Workflow plan returned., content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowPlanApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/workflow-plans/{planId}/abandon:
    parameters:
      - name: planId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/BusinessId" }
    post:
      operationId: abandonWorkflowPlan
      summary: Idempotently abandon an unconfirmed workflow plan and invalidate its draft confirmations.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkflowPlanAbandonRequest" }
      responses:
        "200": { description: Workflow plan abandoned., content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowPlanApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/workflow-plans/{planId}/confirmation-preview:
    parameters:
      - name: planId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/BusinessId" }
    post:
      operationId: previewWorkflowPlanConfirmation
      summary: Issue a short-lived confirmation credential for the exact persisted plan version.
      description: The cleartext confirmation token is returned only by this endpoint and is never included in plan reads.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkflowConfirmationPreviewRequest" }
      responses:
        "200": { description: Authoritative quote and confirmation credential returned., content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowConfirmationAuthorizationApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410": { $ref: "#/components/responses/Gone" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/workflow-plans/{planId}/confirm:
    parameters:
      - name: planId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/BusinessId" }
      - { $ref: "#/components/parameters/IdempotencyKey" }
    post:
      operationId: confirmWorkflowPlan
      summary: Authorize the exact persisted workflow plan without starting execution.
      description: This P2B endpoint consumes the plan credential atomically. It does not freeze points, create tasks, publish messages or execute steps.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkflowPlanConfirmRequest" }
      responses:
        "200": { description: Plan authorization persisted; execution remains disabled., content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowPlanConfirmApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410": { $ref: "#/components/responses/Gone" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /api/v1/workflow-plans/{planId}/start:
    parameters:
      - name: planId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/BusinessId" }
      - { $ref: "#/components/parameters/IdempotencyKey" }
    post:
      operationId: startWorkflowPlan
      summary: Idempotently fund and enqueue one already-confirmed workflow plan.
      description: >-
        Java freezes the persisted total quote and writes the workflow Outbox in one transaction.
        When execution or a compatible Worker is unavailable, the endpoint returns 503 without
        changing points, reservations, events, executions, or Outbox rows.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkflowStartRequest" }
      responses:
        "200": { description: Existing or newly enqueued execution returned., content: { application/json: { schema: { $ref: "#/components/schemas/WorkflowStartApiResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    SpaceId:
      name: spaceId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/BusinessId"
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/BusinessId"
    CompetitorId:
      name: competitorId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/BusinessId"
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/BusinessId"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
    MessageCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: integer
        format: int64
        minimum: 0
        default: 0
    MessageLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 50
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      schema:
        type: string
        pattern: "^[0-9]+$"
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
  responses:
    Unauthorized:
      description: Credentials or the access token are invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The account is disabled or the operation is forbidden.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationFailed:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Too many authentication failures were recorded for this source and username.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: |
        A per-action commercial rate limit refused this request. The limit is operator-configurable
        and per account, so the client reports the refusal rather than retrying on its own.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: An authentication dependency is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The resource does not exist or is not owned by the current user.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: A normalized name or alias conflicts, a version is stale, or a resource is in use.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Gone:
      description: The draft or its one-time confirmation has expired.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

          oneOf:
            - $ref: "#/components/schemas/ImageTaskRequestParameters"
            - $ref: "#/components/schemas/VideoTaskRequestParameters"
            - $ref: "#/components/schemas/GeoTaskParameters"
            - $ref: "#/components/schemas/GeoDiscoveryTaskParameters"
            - $ref: "#/components/schemas/ArticleTaskParameters"
    TaskDraft:
      type: object
      additionalProperties: false
      required: [id, draftSource, taskType, parameterSchemaVersion, status, spaceId, sourceMode, referenceAssetIds, parameters, warnings, inputHash,
                  pricingVersionId, quotedPoints, expiresAt, createdAt]
      properties:
        id: { $ref: "#/components/schemas/BusinessId" }
        previousDraftId: { $ref: "#/components/schemas/NullableBusinessId" }

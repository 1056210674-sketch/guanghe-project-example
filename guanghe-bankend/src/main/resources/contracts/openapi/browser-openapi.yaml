        status: { type: [string, "null"], pattern: "^[A-Z][A-Z0-9_]{0,63}$" }
        stage: { type: [string, "null"], pattern: "^[A-Z][A-Z0-9_]{0,63}$" }
        provider: { type: [string, "null"], pattern: "^[A-Z][A-Z0-9_]{0,63}$" }
        model: { type: [string, "null"], pattern: "^[A-Za-z0-9._:/-]{1,128}$" }
        stableErrorCode: { type: [string, "null"], pattern: "^[A-Z][A-Z0-9_]{0,63}$" }
        startedAt: { type: [string, "null"], format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }
        durationMs: { type: [integer, "null"], format: int64, minimum: 0 }

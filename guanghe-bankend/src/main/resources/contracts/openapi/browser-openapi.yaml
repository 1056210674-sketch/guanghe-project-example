        spaceId: { $ref: "#/components/schemas/BusinessId" }
        productId: { $ref: "#/components/schemas/NullableBusinessId" }
        sourceMode:
          type: [string, "null"]
          enum: [CATALOG_PRODUCT, CURRENT_ATTACHMENTS, TEXT_ONLY, SELECTED_ASSETS, PRODUCT_MATERIALS, GEO_REPORT, REGION_EDIT, PREVIOUS_IMAGE_RESULT, PREVIOUS_USER_ATTACHMENT, null]
        referenceAssetIds:
          type: array
          maxItems: 3
          uniqueItems: true
          items: { $ref: "#/components/schemas/BusinessId" }
        parameters:
          oneOf:
            - $ref: "#/components/schemas/ImageTaskParameters"
            - $ref: "#/components/schemas/VideoTaskParameters"
            - $ref: "#/components/schemas/GeoTaskParameters"
            - $ref: "#/components/schemas/GeoDiscoveryTaskParameters"
            - $ref: "#/components/schemas/ArticleTaskParameters"
            - $ref: "#/components/schemas/MediaTaskParameters"
        warnings: { type: array, maxItems: 20, items: { type: string, minLength: 1, maxLength: 500 } }
        inputHash: { type: string, pattern: "^[0-9a-f]{64}$" }
        pricingVersionId: { $ref: "#/components/schemas/BusinessId" }
        quotedPoints: { type: integer, minimum: 1 }
        confirmationToken: { type: [string, "null"], maxLength: 512 }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    ConfirmTaskDraftRequest:
      type: object
      additionalProperties: false
      required: [confirmationToken, inputHash, pricingVersionId]
      properties:
        confirmationToken: { type: string, minLength: 1, maxLength: 512 }
        inputHash: { type: string, pattern: "^[0-9a-f]{64}$" }
        pricingVersionId: { $ref: "#/components/schemas/BusinessId" }
    ConfirmTaskResponse:
      type: object
      additionalProperties: false
      required: [taskId, status, quotedPoints, frozenPoints, createdAt]
      properties:
        taskId: { $ref: "#/components/schemas/BusinessId" }
        status: { type: string, const: QUEUED }
        quotedPoints: { type: integer, minimum: 1 }
        frozenPoints: { type: [integer, "null"], minimum: 0, description: Current stored reservation frozen points; zero after settlement, null when historical funding is unavailable. }
        createdAt: { type: string, format: date-time }
    PaidTaskResult:
      description: >-
        Empty until successful completion. Mock tasks retain their deterministic fixture shape;
        a real image or video Provider task succeeds only after Java has created one permanent READY asset.
      oneOf:
        - $ref: "#/components/schemas/PendingTaskResult"
        - $ref: "#/components/schemas/MockImageTaskResult"
        - $ref: "#/components/schemas/GeneratedImageAssetTaskResult"
        - $ref: "#/components/schemas/GeneratedVideoAssetTaskResult"
        - $ref: "#/components/schemas/GeoTaskResult"
        - $ref: "#/components/schemas/ArticleTaskResult"
        - $ref: "#/components/schemas/MediaTaskResult"
    MediaTaskResult:
      type: object
      additionalProperties: false
      required: [submissionBatchId, total, published, rejected]
      properties:
        submissionBatchId: { $ref: "#/components/schemas/BusinessId" }
        total: { type: integer, minimum: 1, maximum: 5 }
        published: { type: integer, minimum: 0, maximum: 5 }
        rejected: { type: integer, minimum: 0, maximum: 5 }
      description: Summary only; published links and per-resource status are read from the owned submission API.
    GeoTaskResult:
      type: object
      additionalProperties: false
      required: [runId, reportId, status, expectedUnits, succeededUnits, failedUnits,
                 missingUnits, settledPoints, releasedPoints]
      properties:
        runId: { $ref: "#/components/schemas/BusinessId" }
        reportId: { $ref: "#/components/schemas/BusinessId" }
        status: { type: string, enum: [SUCCEEDED, PARTIAL] }
        expectedUnits: { type: integer, minimum: 1, maximum: 210 }
        succeededUnits: { type: integer, minimum: 1, maximum: 210 }
        failedUnits: { type: integer, minimum: 0, maximum: 210 }
        missingUnits: { type: integer, minimum: 0, maximum: 210 }
        settledPoints: { type: integer, minimum: 1 }
        releasedPoints: { type: integer, minimum: 0 }
    PendingTaskResult:
      type: object
      additionalProperties: false
      maxProperties: 0
      description: No provider result is available for this task state.
    MockImageTaskResult:
      type: object
      additionalProperties: false
      required: [provider, model, mock, artifacts]
      properties:
        provider: { type: string, const: LOCAL_TASK_PROVIDER }
        model: { type: string, const: deterministic-provider-mock-v1 }
        mock: { type: boolean, const: true }
        artifacts:
          type: array
          minItems: 1
          maxItems: 4
          items:
            type: object
            additionalProperties: false
            required: [artifactType, schemaVersion, providerUrl, contentType, metadata]
            properties:
              artifactType: { type: string, const: IMAGE }
              unitKey: { type: [string, "null"], maxLength: 256 }
              schemaVersion: { type: integer, const: 1 }
              providerUrl: { type: string, format: uri, pattern: "^https://mock-provider\\.invalid/" }
              contentType: { type: string, const: image/png }
              sizeBytes: { type: [integer, "null"], minimum: 0 }
              sha256: { type: [string, "null"], pattern: "^[0-9a-f]{64}$" }
              expiresAt: { type: [string, "null"], format: date-time }
              inlineData: { type: "null" }
              metadata:
                type: object
                additionalProperties: false
                required: [width, height, mock]
                properties:
                  width: { type: integer, const: 1024 }
                  height: { type: integer, const: 1024 }
                  mock: { type: boolean, const: true }
    GeneratedImageAssetTaskResult:
      type: object
      additionalProperties: false
      required: [provider, model, providerCostReported]
      allOf:
        - anyOf:
            - type: object
              required: [asset]
              properties:
                asset: { $ref: "#/components/schemas/PaidTaskAssetReference" }
            - type: object
              required: [assets, requestedCount, succeededCount, failedCount]
              properties:
                assets:
                  type: array
                  minItems: 0
                  maxItems: 4
                  items: { $ref: "#/components/schemas/PaidTaskAssetReference" }
                requestedCount: { type: integer, minimum: 1, maximum: 4 }
                succeededCount: { type: integer, minimum: 0, maximum: 4 }
                failedCount: { type: integer, minimum: 0, maximum: 4 }
        - oneOf:
            - type: object
              properties:
                provider: { type: string, const: QWEN_IMAGE }
                model: { type: string, const: qwen-image-3.0 }
            - type: object
              properties:
                provider: { type: string, const: WAN_IMAGE_EDIT }
                model: { type: string, const: wanx2.1-imageedit }
      description: >-
        Only permanent READY assets are returned. New results use assets in candidate order,
        with counts including generation and ingestion failures. Historical results may contain
        only asset. If assets is present it is authoritative, even when empty.
      properties:
        provider: { type: string, enum: [QWEN_IMAGE, WAN_IMAGE_EDIT] }
        model: { type: string, enum: [qwen-image-3.0, wanx2.1-imageedit] }
        providerCostReported:
          type: boolean
          const: false
          description: Java points were settled; upstream Provider cost was not reported as authoritative money.
        asset: { $ref: "#/components/schemas/PaidTaskAssetReference" }
        assets:
          type: array
          minItems: 0
          maxItems: 4
          items: { $ref: "#/components/schemas/PaidTaskAssetReference" }
        requestedCount: { type: integer, minimum: 1, maximum: 4 }
        succeededCount: { type: integer, minimum: 0, maximum: 4 }
        failedCount: { type: integer, minimum: 0, maximum: 4 }
    GeneratedVideoAssetTaskResult:
      type: object
      additionalProperties: false
      required: [provider, model, providerCostReported, asset]
      properties:
        provider: { type: string, const: WAN_VIDEO }
        model: { type: string, const: wan3.0-video }
        providerCostReported: { type: boolean, const: false }
        asset: { $ref: "#/components/schemas/PaidVideoTaskAssetReference" }
    PaidTaskAssetReference:
      type: object
      additionalProperties: false
      required: [assetId, assetType, status, contentType, sizeBytes, sha256, width, height, safetyStatus]
      properties:
        index: { type: integer, minimum: 1, maximum: 4, description: "Candidate number within the task; absent on historical single-image results." }
        assetId: { $ref: "#/components/schemas/BusinessId" }
        assetType: { type: string, const: IMAGE }
        status: { type: string, const: READY }
        contentType: { type: string, const: image/png }
        sizeBytes: { type: integer, format: int64, minimum: 1 }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        width: { type: integer, minimum: 8, maximum: 8192 }
        height: { type: integer, minimum: 8, maximum: 8192 }
        safetyStatus: { type: string, enum: [APPROVED, TEST_BYPASS, NOT_REVIEWED] }
    PaidVideoTaskAssetReference:
      type: object
      additionalProperties: false
      required: [assetId, assetType, status, contentType, sizeBytes, sha256, width,
                 height, durationSeconds, safetyStatus]
      properties:
        assetId: { $ref: "#/components/schemas/BusinessId" }
        assetType: { type: string, const: VIDEO }
        status: { type: string, const: READY }
        contentType: { type: string, const: video/mp4 }
        sizeBytes: { type: integer, format: int64, minimum: 1 }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        width: { type: integer, minimum: 8, maximum: 8192 }
        height: { type: integer, minimum: 8, maximum: 8192 }
        durationSeconds: { type: string, pattern: "^[0-9]+(\\.[0-9]{1,3})?$" }
        safetyStatus: { type: string, enum: [APPROVED, TEST_BYPASS, NOT_REVIEWED] }
    PaidTask:
      type: object
      additionalProperties: false
      required: [id, taskType, status, stageCode, stageLabel, spaceId, quotedPoints,
                 settledPoints, frozenPoints, progress, result, createdAt, updatedAt]
      properties:
        id: { $ref: "#/components/schemas/BusinessId" }
        taskType: { type: string, enum: [IMAGE, VIDEO, GEO, ARTICLE, MEDIA] }
        articlePreparationId:
          $ref: "#/components/schemas/BusinessId"
          description: Present only for a child of an owned ARTICLE_FULL_V1 preparation. Its TITLE/OUTLINE stages advance automatically and must not display manual stage-confirmation controls.
        status: { type: string, enum: [QUEUED, RUNNING, RETRY_WAIT, SUCCEEDED, PARTIAL, FAILED, SKIPPED, SYSTEM_TERMINATED] }
        stageCode:
          type: string
          maxLength: 64
          description: >-
            Includes PROVIDER_RESULT_UNKNOWN while confirming an uncertain result,
            PROVIDER_RESULT_RECOVERY while polling the existing Provider task, and
            PROVIDER_RESULT_CONFIRMATION_FAILED after bounded recovery is exhausted.
            Real image or video output then moves through ASSET_INGESTION_PENDING or
            ASSET_INGESTION_RETRY before a permanent asset is ready.
            IMAGE_PARTIAL_COMPLETED means only some requested images became permanent assets;
            the remaining frozen points have been released.
        stageLabel:
          type: string
          description: User-facing progress, recovery, success, or terminal-failure label.
        spaceId: { $ref: "#/components/schemas/BusinessId" }
        productId: { $ref: "#/components/schemas/NullableBusinessId" }
        quotedPoints: { type: integer, minimum: 1 }
        settledPoints: { type: [integer, "null"], minimum: 0, description: Stored task reservation settlement; null when the historical reservation is unavailable. }
        frozenPoints: { type: [integer, "null"], minimum: 0, description: Stored task reservation frozen points; null when the historical reservation is unavailable. }
        releasedPoints: { type: [integer, "null"], minimum: 0, description: Stored task reservation released points; absent or null when historical funding is unavailable. }
        progress:
          oneOf:
            - $ref: "#/components/schemas/PaidTaskProgress"
            - type: "null"
        result: { $ref: "#/components/schemas/PaidTaskResult" }
        errorCode: { type: [string, "null"], maxLength: 64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PaidTaskProgress:
      type: object
      additionalProperties: false
      required: [percent, completedUnits, totalUnits]
      properties:
        percent: { type: integer, minimum: 0, maximum: 100 }
        completedUnits: { type: integer, minimum: 0, maximum: 210 }
        totalUnits: { type: integer, minimum: 1, maximum: 210 }
    PaidTaskPage:
      type: object
      additionalProperties: false
      required: [items, page, size, total, hasNext]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/PaidTask" } }
        page: { type: integer, format: int32, minimum: 1 }
        size: { type: integer, format: int32, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }
        hasNext: { type: boolean }
    PaidTaskEvent:
      type: object
      additionalProperties: false
      required: [id, sequence, eventType, occurredAt]
      properties:
        id: { $ref: "#/components/schemas/BusinessId" }
        sequence: { type: integer, format: int64, minimum: 1 }
        eventType: { type: string, enum: [task.queued, task.progress, task.completed, task.failed] }
        status: { type: [string, "null"], enum: [QUEUED, RUNNING, RETRY_WAIT, SUCCEEDED, PARTIAL, FAILED, SKIPPED, SYSTEM_TERMINATED, null] }
        stageCode: { type: [string, "null"], pattern: "^[A-Z][A-Z0-9_]{0,63}$" }
        errorCode: { type: [string, "null"], pattern: "^[A-Z][A-Z0-9_]{0,63}$" }
        occurredAt: { type: string, format: date-time }
    AssetSummary:
      type: object
      additionalProperties: false
      required: [id, assetType, sourceType, status, safetyStatus, name, spaceId,
                 contentType, sizeBytes, sha256, createdAt, updatedAt]
      properties:
        id: { $ref: "#/components/schemas/BusinessId" }
        assetType: { type: string, enum: [IMAGE, VIDEO, ARTICLE, GEO_REPORT] }
        sourceType: { type: string, enum: [GENERATED, UPLOADED, IMPORTED] }
        status: { type: string, enum: [UPLOADING, SCANNING, READY, SAFETY_REVIEW, HIDDEN, REJECTED, FAILED, DELETING] }
        safetyStatus: { type: string, enum: [PENDING, APPROVED, TEST_BYPASS, NOT_REVIEWED, REJECTED, UNAVAILABLE] }
        name: { type: string, minLength: 1, maxLength: 255 }
        spaceId: { $ref: "#/components/schemas/BusinessId" }
        primaryProductId: { $ref: "#/components/schemas/NullableBusinessId" }
        contentType: { type: string, minLength: 3, maxLength: 128 }
        sizeBytes: { type: integer, format: int64, minimum: 1 }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        width: { type: [integer, "null"], minimum: 8, maximum: 8192 }
        height: { type: [integer, "null"], minimum: 8, maximum: 8192 }
        sourceTaskId: { $ref: "#/components/schemas/NullableBusinessId" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    UploadedImageAsset:
      type: object
      additionalProperties: false
      required: [id, assetType, sourceType, status, safetyStatus, name, spaceId,
                 contentType, sizeBytes, sha256, width, height, createdAt]
      properties:
        id: { $ref: "#/components/schemas/BusinessId" }
        assetType: { type: string, const: IMAGE }
        sourceType: { type: string, const: UPLOADED }
        status: { type: string, const: READY }
        safetyStatus: { type: string, enum: [APPROVED, TEST_BYPASS, NOT_REVIEWED] }
        name: { type: string, minLength: 1, maxLength: 255 }
        spaceId: { $ref: "#/components/schemas/BusinessId" }
        contentType: { type: string, enum: [image/png, image/jpeg] }
        sizeBytes: { type: integer, format: int64, minimum: 1 }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        width: { type: integer, minimum: 8, maximum: 8192 }
        height: { type: integer, minimum: 8, maximum: 8192 }
        createdAt: { type: string, format: date-time }
    Asset:
      type: object
      additionalProperties: false
      required: [id, assetType, sourceType, status, safetyStatus, name, spaceId,
                 productIds, contentType, sizeBytes, sha256, createdAt, updatedAt]
      properties:
        id: { $ref: "#/components/schemas/BusinessId" }
        assetType: { type: string, enum: [IMAGE, VIDEO, ARTICLE, GEO_REPORT] }
        sourceType: { type: string, enum: [GENERATED, UPLOADED, IMPORTED] }
        status: { type: string, enum: [UPLOADING, SCANNING, READY, SAFETY_REVIEW, HIDDEN, REJECTED, FAILED, DELETING] }
        safetyStatus: { type: string, enum: [PENDING, APPROVED, TEST_BYPASS, NOT_REVIEWED, REJECTED, UNAVAILABLE] }
        name: { type: string, minLength: 1, maxLength: 255 }
        spaceId: { $ref: "#/components/schemas/BusinessId" }
        primaryProductId: { $ref: "#/components/schemas/NullableBusinessId" }
        productIds:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/BusinessId" }
        contentType: { type: string, minLength: 3, maxLength: 128 }
        sizeBytes: { type: integer, format: int64, minimum: 1 }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        width: { type: [integer, "null"], minimum: 8, maximum: 8192 }
        height: { type: [integer, "null"], minimum: 8, maximum: 8192 }
        durationSeconds: { type: [string, "null"], pattern: "^[0-9]+(\\.[0-9]{1,3})?$" }
        sourceTaskId: { $ref: "#/components/schemas/NullableBusinessId" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AssetPage:
      type: object
      additionalProperties: false
      required: [items, page, size, total, hasNext]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AssetSummary" } }
        page: { type: integer, format: int32, minimum: 1 }
        size: { type: integer, format: int32, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }
        hasNext: { type: boolean }
    AssetDownloadUrl:
      type: object
      additionalProperties: false
      required: [url, expiresAt]
      properties:
        url:
          type: string
          format: uri
          pattern: "^https://"
          description: Short-lived signed GET URL; it is not a permanent public asset URL.
        expiresAt: { type: string, format: date-time }
    AssetApiResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties: { data: { $ref: "#/components/schemas/Asset" } }
    UploadedImageAssetApiResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties: { data: { $ref: "#/components/schemas/UploadedImageAsset" } }
    AssetPageApiResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties: { data: { $ref: "#/components/schemas/AssetPage" } }
    AssetDownloadUrlApiResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties: { data: { $ref: "#/components/schemas/AssetDownloadUrl" } }
    GeoPlatform:
      type: object
      additionalProperties: false
      required: [code, name, configured, selectable, liveStatus]
      properties:
        code: { type: string, enum: [DOUBAO, DEEPSEEK, QWEN, WENXIN, KIMI, YUANBAO, ZHIPU] }
        name: { type: string, minLength: 1 }
        configured: { type: boolean }
        selectable: { type: boolean }
        liveStatus: { type: [string, "null"], description: Null means Java has no live Provider health evidence. }
    GeoPlanSchedule:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, timeZone, localTime]
          properties:
            type: { type: string, const: HOURLY }
            timeZone: { type: string, minLength: 1, maxLength: 80 }
            localTime: { type: string, pattern: "^00:[0-5][0-9]$", description: Minute anchor; the server normalizes any supplied hour to zero. }
        - type: object
          additionalProperties: false
          required: [type, timeZone, localTime]
          properties:
            type: { type: string, const: DAILY }
            timeZone: { type: string, minLength: 1, maxLength: 80, description: IANA time-zone identifier. }
            localTime: { type: string, format: time, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        - type: object
          additionalProperties: false
          required: [type, timeZone, localTime, daysOfWeek]
          properties:
            type: { type: string, const: WEEKLY }
            timeZone: { type: string, minLength: 1, maxLength: 80 }
            localTime: { type: string, format: time, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
            daysOfWeek: { type: array, minItems: 1, maxItems: 7, uniqueItems: true, items: { type: integer, minimum: 1, maximum: 7 } }
        - type: object
          additionalProperties: false
          required: [type, timeZone, localTime, intervalDays]
          properties:
            type: { type: string, const: INTERVAL_DAYS }
            timeZone: { type: string, minLength: 1, maxLength: 80 }
            localTime: { type: string, format: time, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
            intervalDays: { type: integer, minimum: 1, description: Server configuration may impose a stricter range. }
    CreateGeoPlanDraftRequest:
      type: object
      additionalProperties: false
      required: [topicId, name, schedule, questionIds, platformCodes, sampleMode, maxPointsPerRun]
      properties:
        topicId: { $ref: "#/components/schemas/BusinessId" }
        name: { type: string, minLength: 1, maxLength: 100, pattern: ".*\\S.*" }
        schedule: { $ref: "#/components/schemas/GeoPlanSchedule" }
        questionIds: { type: array, minItems: 3, maxItems: 10, uniqueItems: true, items: { $ref: "#/components/schemas/BusinessId" } }
        platformCodes: { type: array, minItems: 1, maxItems: 7, uniqueItems: true, items: { type: string, enum: [DOUBAO, DEEPSEEK, QWEN, WENXIN, KIMI, YUANBAO, ZHIPU] } }
        sampleMode: { type: string, enum: [STANDARD, DEEP] }
        maxPointsPerRun: { type: integer, minimum: 1 }
    GeoPlanDraft:
      type: object
      additionalProperties: false
      required: [draftId, inputHash, pricingVersionId, estimatedPointsPerRun, confirmationToken, expiresAt]
      properties:
        draftId: { $ref: "#/components/schemas/BusinessId" }
        inputHash: { type: string, pattern: "^[0-9a-f]{64}$" }
        pricingVersionId: { $ref: "#/components/schemas/BusinessId" }
        estimatedPointsPerRun: { type: integer, minimum: 1 }
        confirmationToken: { type: [string, "null"], minLength: 1, maxLength: 512, writeOnly: true }
        expiresAt: { type: string, format: date-time }
    ConfirmGeoPlanRequest:
      type: object
      additionalProperties: false
      required: [draftId, inputHash, pricingVersionId, confirmationToken]
      properties:
        draftId: { $ref: "#/components/schemas/BusinessId" }
        inputHash: { type: string, pattern: "^[0-9a-f]{64}$" }
        pricingVersionId: { $ref: "#/components/schemas/BusinessId" }
        confirmationToken:
          type: string
          minLength: 1
          maxLength: 512
          description: Short-lived credential returned only by this confirmation-preview response.
    GeoPlanVersionRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties: { version: { $ref: "#/components/schemas/ResourceVersion" } }
    UpdateGeoPlanRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [version, name]
          properties:
            version: { $ref: "#/components/schemas/ResourceVersion" }
            name: { type: string, minLength: 1, maxLength: 100, pattern: ".*\\S.*" }
        - type: object
          additionalProperties: false
          required: [version, draftId, inputHash, pricingVersionId, confirmationToken]
          properties:
            version: { $ref: "#/components/schemas/ResourceVersion" }
            draftId: { $ref: "#/components/schemas/BusinessId" }
            inputHash: { type: string, pattern: "^[0-9a-f]{64}$" }
            pricingVersionId: { $ref: "#/components/schemas/BusinessId" }
            confirmationToken: { type: string, minLength: 1, maxLength: 512, writeOnly: true }
    GeoPlan:
      type: object
      additionalProperties: false
      required: [id, topicId, spaceId, productId, name, status, schedule, questionIds,
                 platformCodes, sampleMode, estimatedPointsPerRun, maxPointsPerRun,
                 pricingVersionId, nextRunAt, lastScheduledSlot, pauseReason, version, createdAt, updatedAt]
      properties:
        id: { $ref: "#/components/schemas/BusinessId" }
        topicId: { $ref: "#/components/schemas/BusinessId" }
        spaceId: { $ref: "#/components/schemas/BusinessId" }
        productId: { $ref: "#/components/schemas/NullableBusinessId" }
        name: { type: string, minLength: 1, maxLength: 100 }
        status: { type: string, enum: [ACTIVE, PAUSED] }
        schedule: { $ref: "#/components/schemas/GeoPlanSchedule" }
        questionIds: { type: array, minItems: 3, maxItems: 10, uniqueItems: true, items: { $ref: "#/components/schemas/BusinessId" } }
        platformCodes: { type: array, minItems: 1, maxItems: 7, uniqueItems: true, items: { type: string, enum: [DOUBAO, DEEPSEEK, QWEN, WENXIN, KIMI, YUANBAO, ZHIPU] } }
        sampleMode: { type: string, enum: [STANDARD, DEEP] }
        estimatedPointsPerRun: { type: integer, minimum: 1 }
        maxPointsPerRun: { type: integer, minimum: 1 }
        pricingVersionId: { $ref: "#/components/schemas/BusinessId" }
        nextRunAt: { type: [string, "null"], format: date-time }
        lastScheduledSlot: { type: [string, "null"], format: date-time }
        pauseReason: { type: [string, "null"], pattern: "^[A-Z][A-Z0-9_]{0,63}$" }
        version: { $ref: "#/components/schemas/ResourceVersion" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

      additionalProperties: false
      required: ["candidate","topicVersion","competitorSetVersion","existingPlansChanged"]
      properties: {"candidate":{"$ref":"#/components/schemas/GeoCompetitorCandidate"},"topicVersion":{"type":"integer","minimum":1},"competitorSetVersion":{"type":["integer","null"],"minimum":1},"existingPlansChanged":{"type":"boolean","const":false}}
    GeoCompetitiveInsightsApiResponse:
      allOf: [{"$ref":"#/components/schemas/SuccessEnvelope"},{"type":"object","required":["data"],"properties":{"data":{"$ref":"#/components/schemas/GeoCompetitiveInsights"}}}]
    GeoCompetitorCandidatePageApiResponse:
      allOf: [{"$ref":"#/components/schemas/SuccessEnvelope"},{"type":"object","required":["data"],"properties":{"data":{"$ref":"#/components/schemas/GeoCompetitorCandidatePage"}}}]
    GeoCompetitorCandidateApiResponse:
      allOf: [{"$ref":"#/components/schemas/SuccessEnvelope"},{"type":"object","required":["data"],"properties":{"data":{"$ref":"#/components/schemas/GeoCompetitorCandidate"}}}]
    GeoCompetitorConfirmationApiResponse:
      allOf: [{"$ref":"#/components/schemas/SuccessEnvelope"},{"type":"object","required":["data"],"properties":{"data":{"$ref":"#/components/schemas/GeoCompetitorConfirmation"}}}]
    GeoVisibilityTrend:
      type: object
      additionalProperties: false
      required: [topicId, days, questionScope, methodVersion, from, to, historyTruncated, pointLimit, baselineScanLimit, platforms, history]
      description: Discovery questions do not mention frozen product or brand identity terms. Validation questions do. Classification uses saved identities only. historyTruncated signals bounded history, baseline scan or evidence limits; no fabricated zero samples.
      properties:
        topicId: { $ref: "#/components/schemas/BusinessId" }
        days: { type: integer, enum: [7, 30, 90] }
        questionScope: { type: string, enum: [DISCOVERY, BRAND_VALIDATION] }
        methodVersion: { type: string, const: explicit-name-mention-v1 }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        historyTruncated: { type: boolean }
        pointLimit: { type: integer, const: 100 }
        baselineScanLimit: { type: integer, const: 100 }
        platforms: { type: array, maxItems: 7, items: { $ref: "#/components/schemas/GeoVisibilityTrendPlatform" } }
        history: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/GeoVisibilityTrendHistory" } }
    GeoVisibilityTrendPlatform:
      type: object
      additionalProperties: false
      required: [platformCode, baselineReportId, baselineObservedAt, baselineQuestionCount, baselineSampleCount, points]
      properties:
        platformCode: { type: string, enum: [DOUBAO, DEEPSEEK, QWEN, WENXIN, KIMI, YUANBAO, ZHIPU] }
        baselineReportId: { type: [string, "null"], pattern: "^[1-9][0-9]*$" }
        baselineObservedAt: { type: [string, "null"], format: date-time }
        baselineQuestionCount: { type: integer, minimum: 0 }
        baselineSampleCount: { type: integer, minimum: 0 }
        points: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/GeoVisibilityTrendPoint" } }
    GeoVisibilityTrendPoint:
      type: object
      additionalProperties: false
      required: [reportId, runId, observedAt, target, region, questionCount, baselineQuestionCount, explorationQuestionCount, expectedSamples, validSamples, mentionedSamples, mentionRate, baselineExpectedSamples, baselineValidSamples, baselineMentionedSamples, baselineMentionRate, failedSamples, missingSamples, evidenceTruncated, comparisonStatus, comparisonReason, connectToPrevious, comparison, questionChanges]
      description: mentionRate covers this batch. baselineMentionRate covers only unchanged original question versions and rounds; its expected count never shrinks on removal. A baseline line may connect only when connectToPrevious is true. Pairwise comparison separately uses common valid question versions and rounds from the two adjacent batches, including later exploration questions, and MUST NOT be presented as the change between the raw plotted points. observedAt is collection time, never reinterpretation time.
      properties:
        reportId: { type: [string, "null"], pattern: "^[1-9][0-9]*$" }
        runId: { $ref: "#/components/schemas/BusinessId" }
        observedAt: { type: string, format: date-time }
        target: { oneOf: [{ $ref: "#/components/schemas/GeoVisibilityTarget" }, { type: "null" }] }
        region: { type: [string, "null"] }
        questionCount: { type: integer, minimum: 0 }
        baselineQuestionCount: { type: integer, minimum: 0 }
        explorationQuestionCount: { type: integer, minimum: 0 }
        expectedSamples: { type: integer, minimum: 0 }
        validSamples: { type: integer, minimum: 0 }
        mentionedSamples: { type: [integer, "null"], minimum: 0 }
        mentionRate: { type: [number, "null"], minimum: 0, maximum: 100 }
        baselineExpectedSamples: { type: integer, minimum: 0 }
        baselineValidSamples: { type: integer, minimum: 0 }
        baselineMentionedSamples: { type: [integer, "null"], minimum: 0 }
        baselineMentionRate: { type: [number, "null"], minimum: 0, maximum: 100 }
        failedSamples: { type: integer, minimum: 0 }
        missingSamples: { type: integer, minimum: 0 }
        evidenceTruncated: { type: boolean }
        comparisonStatus: { type: string, enum: [FIRST_OBSERVATION, COMPARABLE, NOT_COMPARABLE] }
        comparisonReason: { type: [string, "null"], enum: [MISSING_TARGET_SNAPSHOT, AMBIGUOUS_TARGET_NAMES, MISSING_QUESTION_METADATA, MISSING_SAMPLING_METADATA, TARGET_CHANGED, REGION_CHANGED, SAMPLING_CHANGED, QUESTION_CHANGED, PLATFORM_NOT_SAMPLED, NO_COMMON_VALID_SAMPLES, BASELINE_UNAVAILABLE, EVIDENCE_LIMIT, null] }
        missingPeriod: { type: string, enum: [PREVIOUS, CURRENT, BOTH], description: Which adjacent frozen run omitted the platform; only present for PLATFORM_NOT_SAMPLED. }
        connectToPrevious: { type: boolean }
        comparison: { oneOf: [{ $ref: "#/components/schemas/GeoVisibilityTrendComparison" }, { type: "null" }] }
        questionChanges: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/GeoVisibilityTrendQuestionChange" } }
    GeoVisibilityTrendComparison:
      type: object
      additionalProperties: false
      required: [previousReportId, currentReportId, commonQuestions, commonSamples, previousMentionedSamples, currentMentionedSamples, previousMentionRate, currentMentionRate, deltaPercentagePoints]
      description: Both rates and the difference use exactly the same valid question versions and sample rounds shared by the two adjacent batches, including later exploration questions. Model, provider, collection method, target recognition, region and metric version must match. Fixed baseline rates are separate.
      properties:
        previousReportId: { type: [string, "null"], pattern: "^[1-9][0-9]*$" }
        currentReportId: { type: [string, "null"], pattern: "^[1-9][0-9]*$" }
        commonQuestions: { type: integer, minimum: 0 }
        commonSamples: { type: integer, minimum: 0 }
        previousMentionedSamples: { type: integer, minimum: 0 }
        currentMentionedSamples: { type: integer, minimum: 0 }
        previousMentionRate: { type: [number, "null"], minimum: 0, maximum: 100 }
        currentMentionRate: { type: [number, "null"], minimum: 0, maximum: 100 }
        deltaPercentagePoints: { type: number, minimum: -100, maximum: 100 }
    GeoVisibilityTrendQuestionChange:
      type: object
      additionalProperties: false
      required: [questionId, questionVersion, questionText, inBaseline, change, reason, previousReportId, currentReportId, previousMentionedSamples, previousValidSamples, currentMentionedSamples, currentValidSamples, previousUnitKeys, currentUnitKeys]
      description: For comparable questions the counts use common valid rounds. inBaseline identifies rows contributing to the fixed trend; exploration rows never increase its denominator. Report identifiers plus unit keys link to existing saved answers without returning their text here.
      properties:
        questionId: { $ref: "#/components/schemas/BusinessId" }
        questionVersion: { type: string, pattern: "^[a-f0-9]{64}$" }
        questionText: { type: string }
        inBaseline: { type: boolean }
        change: { type: string, enum: [NEWLY_MENTIONED, CONTINUED_MENTION, NO_LONGER_MENTIONED, NEVER_MENTIONED, NEW_EXPLORATION, NOT_COMPARABLE] }
        reason: { type: [string, "null"], enum: [MISSING_TARGET_SNAPSHOT, AMBIGUOUS_TARGET_NAMES, MISSING_QUESTION_METADATA, MISSING_SAMPLING_METADATA, TARGET_CHANGED, REGION_CHANGED, SAMPLING_CHANGED, QUESTION_CHANGED, PLATFORM_NOT_SAMPLED, NO_COMMON_VALID_SAMPLES, BASELINE_UNAVAILABLE, EVIDENCE_LIMIT, null] }
        previousReportId: { type: [string, "null"], pattern: "^[1-9][0-9]*$" }
        currentReportId: { type: [string, "null"], pattern: "^[1-9][0-9]*$" }
        previousMentionedSamples: { type: [integer, "null"], minimum: 0 }
        previousValidSamples: { type: integer, minimum: 0 }
        currentMentionedSamples: { type: [integer, "null"], minimum: 0 }
        currentValidSamples: { type: integer, minimum: 0 }
        missingPeriod: { type: string, enum: [PREVIOUS, CURRENT, BOTH], description: Which adjacent frozen run omitted the platform; only present for PLATFORM_NOT_SAMPLED. }
        previousUnitKeys: { type: array, maxItems: 3, items: { type: string } }
        currentUnitKeys: { type: array, maxItems: 3, items: { type: string } }
    GeoVisibilityTrendHistory:
      type: object
      additionalProperties: false
      required: [reportId, runId, observedAt, questionCount, addedQuestionCount, removedQuestionCount, changedQuestionCount, changeStatus]
      description: Question changes compare adjacent frozen scoped batches, not current editable questions. Added includes questions returning after an absent batch and is not a claim of first-ever discovery.
      properties:
        reportId: { type: [string, "null"], pattern: "^[1-9][0-9]*$" }
        runId: { $ref: "#/components/schemas/BusinessId" }
        observedAt: { type: string, format: date-time }
        questionCount: { type: integer, minimum: 0 }
        addedQuestionCount: { type: integer, minimum: 0 }
        removedQuestionCount: { type: integer, minimum: 0 }
        changedQuestionCount: { type: integer, minimum: 0 }
        changeStatus: { type: string, enum: [FIRST_OBSERVATION, UNCHANGED, CHANGED, UNAVAILABLE] }
    GeoVisibilityTrendApiResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object

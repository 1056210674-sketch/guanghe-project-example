    MemoryEntry:
      type: object
      additionalProperties: false
      required: [id, scope, projectId, kind, key, label, value, version, deleted, sourceType, sourceMessageId, sourceConversationId, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/BusinessId' }
        scope: { type: string, enum: [PROJECT, ACCOUNT] }
        projectId: { anyOf: [{ $ref: '#/components/schemas/BusinessId' }, { type: 'null' }] }
        kind: { type: string, enum: [FACT, PREFERENCE] }
        key: { type: string, pattern: '^[a-z][a-z0-9_.-]{0,63}$' }
        label: { type: string, minLength: 1, maxLength: 100 }
        value: { anyOf: [{ type: string, minLength: 1, maxLength: 2000 }, { type: 'null' }] }
        version: { type: integer, minimum: 1 }
        deleted: { type: boolean }
        sourceType: { type: string, enum: [USER_MESSAGE, USER_INPUT] }
        sourceMessageId: { anyOf: [{ $ref: '#/components/schemas/BusinessId' }, { type: 'null' }] }
        sourceConversationId: { anyOf: [{ $ref: '#/components/schemas/BusinessId' }, { type: 'null' }] }
        updatedAt: { type: string, format: date-time }
    CreateMemoryEntryRequest:
      type: object
      additionalProperties: false
      required: [scope, kind, key, label, value]
      properties:
        scope: { type: string, enum: [PROJECT, ACCOUNT] }
        projectId: { anyOf: [{ $ref: '#/components/schemas/BusinessId' }, { type: 'null' }] }
        kind: { type: string, enum: [FACT, PREFERENCE] }
        key: { type: string, pattern: '^[a-z][a-z0-9_.-]{0,63}$' }
        label: { type: string, minLength: 1, maxLength: 100 }
        value: { type: string, minLength: 1, maxLength: 2000 }
      description: ACCOUNT requires PREFERENCE and no projectId; PROJECT requires projectId. Maximum 100 entries including tombstones and 6000 key/label/value characters per scope. Existing key returns 409, never duplicates.
    UpdateMemoryEntryRequest:
      type: object
      additionalProperties: false
      required: [version, label, value]
      properties:
        version: { type: integer, minimum: 1 }
        label: { type: string, minLength: 1, maxLength: 100 }
        value: { type: string, minLength: 1, maxLength: 2000 }
        restore: { type: boolean, default: false }
      description: restore=true is required only for a deleted entry and rejected for a live entry. Exact current version is always required. Restored content is new USER_INPUT, never the old deleted value, and creates a fresh history cutoff.
    MemoryEntryApiResponse:
      allOf:
        - { $ref: '#/components/schemas/SuccessEnvelope' }
        - { type: object, required: [data], properties: { data: { $ref: '#/components/schemas/MemoryEntry' } } }
    MemoryEntryListApiResponse:
      allOf:
        - { $ref: '#/components/schemas/SuccessEnvelope' }
        - { type: object, required: [data], properties: { data: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/MemoryEntry' } } } }

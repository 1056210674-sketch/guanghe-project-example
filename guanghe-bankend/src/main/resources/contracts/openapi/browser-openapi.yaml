      properties:
        id: { $ref: "#/components/schemas/BusinessId" }
        batchId: { $ref: "#/components/schemas/BusinessId" }
        taskId: { $ref: "#/components/schemas/BusinessId" }
        articleId: { $ref: "#/components/schemas/BusinessId" }
        articleSnapshotId: { $ref: "#/components/schemas/BusinessId" }
        mediaResourceId: { $ref: "#/components/schemas/BusinessId" }
        mediaName: { type: string, minLength: 1, maxLength: 255 }
        status: { $ref: "#/components/schemas/MediaSubmissionStatus" }
        saleAmountCents: { type: integer, minimum: 1 }
        chargedPoints: { type: integer, minimum: 1 }
        publishedUrl: { type: [string, "null"], format: uri, pattern: "^https?://[^\\s/@?#]+([/?#][^\\s]*)?$" }
        publishedUrls:
          type: array
          maxItems: 20
          items: { type: string, format: uri, pattern: "^https?://[^\\s/@?#]+([/?#][^\\s]*)?$" }
        stableErrorCode: { type: [string, "null"], pattern: "^[A-Z][A-Z0-9_]{0,63}$" }

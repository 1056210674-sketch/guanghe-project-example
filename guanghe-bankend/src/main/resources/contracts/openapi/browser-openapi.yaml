      properties: {"reportId":{"$ref":"#/components/schemas/BusinessId"},"unitKey":{"type":"string"},"quote":{"type":"string","maxLength":240},"signal":{"type":"string","enum":["MENTION","POSITIVE_ATTRIBUTE","NEGATIVE_ATTRIBUTE"]}}
    GeoCompetitorCandidate:

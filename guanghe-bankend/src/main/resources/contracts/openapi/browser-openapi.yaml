        model: { type: string, pattern: "^deepseek-[A-Za-z0-9._-]{1,112}$" }
        usage: { type: object, additionalProperties: false }
      description: BODY/REWRITE content is committed to the article resource; task results expose only safe metadata and candidates.
    MediaArticlePricing:
      type: object
      additionalProperties: false
      required: [imageCount, baseSaleAmountCents, imageFeeAmountCents, totalSaleAmountCents,
                 basePoints, imageFeePoints, totalPoints, imageFeeMode, description]
      properties:
        imageCount: { type: integer, minimum: 0, maximum: 10 }
        baseSaleAmountCents: { type: integer, minimum: 1 }
        imageFeeAmountCents: { type: integer, minimum: 0 }
        totalSaleAmountCents: { type: integer, minimum: 1 }
        basePoints: { type: integer, minimum: 1 }
        imageFeePoints: { type: integer, minimum: 0 }
        totalPoints: { type: integer, minimum: 1 }
        imageFeeMode: { type: string, enum: [NONE, INCLUDED, PER_IMAGE, PER_ARTICLE] }
        description: { type: string, maxLength: 500 }
      description: >-
        Server-calculated pricing for the exact article image count. Total is the existing sale-price
        formula applied once to supplier base price plus image cost; imageFee is total minus base,
        including the effect of uniform whole-yuan rounding. Values must not be recomputed by the
        browser or submitted as quote inputs. Legacy persisted drafts may omit this summary.
    MediaResource:
      type: object
      additionalProperties: false
      required: [id, providerCode, upstreamModelId, upstreamResourceId, name, status,
                 capabilities, saleAmountCents, chargedPoints, quoteExpiresAt, syncedAt]
      properties:
        id: { $ref: "#/components/schemas/BusinessId" }
        providerCode: { type: string, pattern: "^[A-Z][A-Z0-9_]{0,63}$" }
        upstreamModelId: { type: string, maxLength: 32, description: Upstream media resource type; not an AI model. }
        upstreamResourceId: { type: string, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 255 }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        resourceType: { type: [string, "null"], maxLength: 64 }
        channelCategory: { type: [string, "null"], maxLength: 120 }
        region: { type: [string, "null"], maxLength: 120 }
        estimatedDays: { type: [integer, "null"], minimum: 0, maximum: 365 }
        capabilities:
          type: object
          additionalProperties: true
          maxProperties: 20
          properties:
            supportsImages: { type: boolean }
            imageFeeMode: { type: string, enum: [INCLUDED, PER_IMAGE, PER_ARTICLE] }
            imagePricingDescription: { type: string, maxLength: 500 }
            maxImageCount: { type: integer, minimum: 1, maximum: 10 }
            maxImageBytes: { type: integer, minimum: 1 }
            articlePricing: { $ref: "#/components/schemas/MediaArticlePricing" }
          description: Java-projected supportsImages requires enabled image delivery and a verified explicit fee rule, with server-enforced count/size bounds. Raw imagePolicy alone never authorizes submission. articlePricing is present for article recommendations, not generic catalog prices. Asset URLs and private supplier image-cost snapshots are never returned here.
        saleAmountCents: { type: integer, minimum: 1, description: Exact article total in recommendations; base media price in the generic catalog. }
        chargedPoints: { type: integer, minimum: 1, description: Exact article total in recommendations; base media points in the generic catalog. }
        quoteExpiresAt: { type: string, format: date-time }
        syncedAt: { type: string, format: date-time }
      description: Upstream price and markup are intentionally omitted from USER responses.
    MediaRecommendation:
      type: object
      additionalProperties: false
      required: [rank, mediaResourceId, reasonCode, reason, score, evidence, resource]
      properties:
        rank: { type: integer, minimum: 1, maximum: 5 }
        mediaResourceId: { $ref: "#/components/schemas/BusinessId" }
        reasonCode:
          type: string
          enum: [INDUSTRY_CATEGORY_MATCH, BROAD_REACH, COST_EFFECTIVE, ACTIVE_RESOURCE_FALLBACK]
        reason: { type: string, minLength: 1, maxLength: 300 }
        score: { type: integer, minimum: 0 }
        evidence: { type: array, minItems: 1, maxItems: 10, items: { type: string, minLength: 1, maxLength: 200 } }
        resource: { $ref: "#/components/schemas/MediaResource" }
      description: A deterministic Java recommendation; the nested resource carries current estimated points and price expiry.
    MediaRecommendationStrategy:
      type: object
      additionalProperties: false
      required: [goal, requiresLink, detectedCategories, candidateCount, dataLimitations]
      properties:
        goal: { $ref: "#/components/schemas/ArticleSubmissionGoal" }
        preferredRegion: { type: [string, "null"], maxLength: 120 }
        maxTotalPoints: { type: [integer, "null"], minimum: 1 }
        requiresLink: { type: boolean }
        detectedCategories: { type: array, maxItems: 20, items: { type: string, minLength: 1, maxLength: 120 } }
        candidateCount: { type: integer, minimum: 0 }

    GeoReportInterpretation:
      type: object
      additionalProperties: false
      required: [status, canRetry, attempts, maxAttempts, requestedAt, finishedAt, failureCode, unavailableReason, retryAfter]
      description: Interpretation recovery state is independent of the immutable collection/points lifecycle. GET never creates work. Original synthesis remains visible throughout queued/running/failed attempts.
      properties:
        status: { type: string, enum: [NOT_STARTED, QUEUED, RUNNING, SUCCEEDED, FAILED] }
        canRetry: { type: boolean }
        attempts: { type: integer, minimum: 0, maximum: 2 }

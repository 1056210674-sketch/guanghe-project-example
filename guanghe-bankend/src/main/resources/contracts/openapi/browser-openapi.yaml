          properties:
            data: { $ref: "#/components/schemas/GeoVisibilityTrend" }
    GeoVisibility:
      type: object
      additionalProperties: false
      required: [methodVersion, assessmentStatus, unavailableReason, target, platforms, samples]
      description: Read-only projection of frozen catalog identity and saved answer text, not recommendation, ranking, market share or consumer-app coverage. Failed/missing samples are excluded from the mention denominator and shown separately. No current catalog or topic-title fallback.
      properties:
        methodVersion: { type: string, const: explicit-name-mention-v1 }
        assessmentStatus: { type: string, enum: [AVAILABLE, UNAVAILABLE_TARGET, NO_VALID_SAMPLES] }
        unavailableReason: { type: [string, "null"], enum: [MISSING_TARGET_SNAPSHOT, AMBIGUOUS_TARGET_NAMES, NO_VALID_ANSWERS, null] }
        target:
          oneOf:
            - $ref: "#/components/schemas/GeoVisibilityTarget"
            - type: "null"
        platforms: { type: array, maxItems: 7, items: { $ref: "#/components/schemas/GeoVisibilityPlatform" } }
        samples: { type: array, maxItems: 210, items: { $ref: "#/components/schemas/GeoVisibilitySample" } }
    GeoVisibilityTarget:
      type: object
      additionalProperties: false
      required: [kind, id, name, aliases]
      properties:
        kind: { type: string, enum: [PRODUCT, BRAND] }
        id: { $ref: "#/components/schemas/BusinessId" }
        name: { type: string, minLength: 1, maxLength: 150 }
        aliases: { type: array, maxItems: 50, items: { type: string, minLength: 1, maxLength: 150 } }
    GeoVisibilityPlatform:
      type: object
      additionalProperties: false
      required: [platformCode, expectedSamples, validSamples, mentionedSamples, failedSamples, missingSamples, mentionRate]
      properties:
        platformCode: { type: string, enum: [DOUBAO, DEEPSEEK, QWEN, WENXIN, KIMI, YUANBAO, ZHIPU] }
        expectedSamples: { type: integer, minimum: 0, maximum: 30 }
        validSamples: { type: integer, minimum: 0, maximum: 30 }
        mentionedSamples: { type: [integer, "null"], minimum: 0, maximum: 30, description: Null when target cannot be identified or no valid answers exist; zero only when valid answers have no explicit target name. }
        failedSamples: { type: integer, minimum: 0, maximum: 30 }
        missingSamples: { type: integer, minimum: 0, maximum: 30 }
        mentionRate: { type: [number, "null"], minimum: 0, maximum: 100, description: Percentage 0..100, mentionedSamples divided by validSamples. Each valid answer counts once. }
    GeoVisibilitySample:
      type: object
      additionalProperties: false
      required: [unitKey, mentioned, matchedTerms]
      properties:
        unitKey: { type: string, pattern: "^[1-9][0-9]*:(DOUBAO|DEEPSEEK|QWEN|WENXIN|KIMI|YUANBAO|ZHIPU):[1-3]$" }
        mentioned: { type: [boolean, "null"], description: Null for failed answers or unavailable target. }
        matchedTerms: { type: array, maxItems: 51, items: { type: string, minLength: 1, maxLength: 150 } }
